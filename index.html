<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>成長型STG — 統合修正版 Part1（基盤・デッキ・ガチャ・入力）</title>
<style>
  :root{
    --bg:#041223; --panel:#072433; --accent:#4de0ff; --muted:rgba(255,255,255,0.06);
    --rarity-N: #bdbdbd;
    --rarity-R: #4da6ff;
    --rarity-SR: #c77dff;
    --rarity-SSR: #ffd700;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#00121a);font-family:system-ui,-apple-system,Roboto,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;color:#fff;overflow:hidden}
  #app{display:flex;flex-direction:column;align-items:center;padding:8px;box-sizing:border-box;height:100%}
  #topHud{width:100%;max-width:960px;display:flex;gap:8px;margin-bottom:6px}
  .statBox{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:8px;border-radius:10px;flex:1;min-width:0}
  .small{font-size:12px;opacity:0.9}
  #canvasWrap{width:100%;max-width:960px;flex:1;display:flex;align-items:center;justify-content:center;position:relative}
  canvas{width:100%;height:100%;border-radius:12px;background:linear-gradient(180deg,#021826,#00121a);touch-action:none}
  #stickBase{position:absolute;left:16px;bottom:16px;width:120px;height:120px;border-radius:60px;background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;z-index:80;touch-action:none;pointer-events:none;opacity:0}
  #stickKnob{width:56px;height:56px;border-radius:28px;background:rgba(255,255,255,0.04);transform:translate(0,0)}
  #overlay{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);z-index:100;pointer-events:auto}
  .panel{background:linear-gradient(180deg,#08202b,#05262b);padding:14px;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.6);width:92%;max-width:980px;max-height:86vh;overflow:auto;pointer-events:auto}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .choice{background:rgba(255,255,255,0.02);padding:10px;border-radius:10px;cursor:pointer;border:1px solid rgba(255,255,255,0.03);display:flex;justify-content:space-between;align-items:center}
  .choice .rarity{font-weight:800;margin-right:8px;padding:4px 8px;border-radius:8px;color:#001}
  .btn{background:var(--accent);padding:8px 12px;border-radius:9px;color:#012;font-weight:800;text-align:center;cursor:pointer;user-select:none}
  #bottomTabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.45));gap:8px;z-index:120}
  .tabBtn{background:rgba(255,255,255,0.02);padding:8px 12px;border-radius:10px;color:#fff;cursor:pointer;user-select:none}
  .tabBtn.active{background:var(--accent);color:#001}
  .cardList{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .card{background:rgba(255,255,255,0.02);padding:8px;border-radius:8px;font-size:13px}
  footer{font-size:12px;opacity:0.9;margin-top:6px}
  .rarity-N{background:var(--rarity-N);color:#001;padding:4px;border-radius:6px}
  .rarity-R{background:var(--rarity-R);color:#001;padding:4px;border-radius:6px}
  .rarity-SR{background:var(--rarity-SR);color:#001;padding:4px;border-radius:6px}
  .rarity-SSR{background:var(--rarity-SSR);color:#001;padding:4px;border-radius:6px}
  /* deck UI */
  #deckBar{position:fixed;right:12px;top:80px;display:flex;flex-direction:column;gap:6px;z-index:130}
  .deckSlot{width:62px;height:48px;background:rgba(255,255,255,0.02);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
  .gachaOverlay{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;z-index:200}
  .gachaCard{width:200px;height:280px;border-radius:12px;background:linear-gradient(180deg,#0a3444,#053241);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:12px;box-shadow:0 8px 40px rgba(0,0,0,0.6)}
  .centerNote{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:210}
  .rarity-tag{padding:6px 10px;border-radius:10px;font-weight:800}
  @media (min-width:900px){
    #stickBase{width:140px;height:140px}#stickKnob{width:64px;height:64px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topHud">
    <div class="statBox">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:900">Lv <span id="uiLevel">1</span></div>
        <div class="small" id="uiWaveLabel">Wave 1</div>
      </div>
      <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
        <div style="flex:1">
          <div class="small">XP</div>
          <div style="background:var(--muted);height:12px;border-radius:8px;overflow:hidden"><div id="uiXpBar" style="height:100%;background:linear-gradient(90deg,var(--accent),#00a6ff);width:0%"></div></div>
        </div>
        <div style="width:84px;text-align:right">
          <div class="small">XP: <span id="uiXpText">0</span></div>
        </div>
      </div>
    </div>

    <div class="statBox" style="text-align:center">
      <div style="font-weight:900">シールド</div>
      <div style="margin-top:6px" class="small" id="uiShield">5000 / 5000</div>
      <div style="margin-top:6px;background:var(--muted);height:12px;border-radius:8px;overflow:hidden"><div id="uiShieldBar" style="height:100%;background:linear-gradient(90deg,var(--accent),#00a6ff);width:100%"></div></div>
    </div>

    <div class="statBox" style="text-align:right">
      <div style="font-weight:900">Score <span id="uiScore">0</span></div>
      <div class="small" id="uiDps">攻撃 10 /秒</div>
    </div>
  </div>

  <div id="canvasWrap">
    <canvas id="gameCanvas"></canvas>

    <!-- 仮想スティック（プレースホルダ、画面どこでも出るように動的に配置） -->
    <div id="stickBase" aria-hidden="false"><div id="stickKnob"></div></div>

    <div id="overlay" aria-hidden="true"><div class="panel" id="overlayPanel"></div></div>

    <!-- ガチャ演出オーバーレイ -->
    <div class="gachaOverlay" id="gachaOverlay" style="display:none;background:rgba(0,0,0,0.7)">
      <div id="gachaAnimContainer"></div>
    </div>

  </div>

  <div style="width:100%;max-width:960px;display:flex;justify-content:space-between;align-items:center;margin-top:8px">
    <div class="small">基礎攻撃: <span id="uiBaseAtk">10</span> /秒</div>
    <div class="small">貫通/拡散: <span id="uiMisc">pierce:1 spread:1</span></div>
    <div class="small">敵残: <span id="uiEnemyCount">0</span></div>
  </div>

  <footer>Part1: 基盤（入力・画面・デッキ・ガチャ・XPループ）</footer>
</div>

<!-- デッキ表示（右側） -->
<div id="deckBar" aria-hidden="false"></div>

<div id="bottomTabs">
  <div class="tabBtn active" data-tab="stage">ステージ選択</div>
  <div class="tabBtn" data-tab="upgrade">強化（永続）</div>
  <div class="tabBtn" data-tab="play">出陣（プレイ）</div>
</div>

<script>
/* =========================
   Part1 — 統合基盤
   - ここは長めで慎重に書く
   - 役割: state管理、入出力、デッキUI、ガチャ基礎、XPでのレベルアップロジック、スティック（画面全体）など
   ========================= */

/* -----------------------
   定数 / 保存
   ----------------------- */
const SAVE_KEY = 'grow_stg_save_v4';
const MAX_ONSCREEN_PROJECTILES = 800;
const SPLIT_GLOBAL_LIMIT = 240;
const BASE_UPGRADE_BASE_COST = 1000;
const BASE_UPGRADE_SCALE = 1.5;

/* ステージ数 30 に設定 */
const MAX_STAGE = 30;

/* チャレンジ倍率：要求どおり長いリスト（値は文字列でもOK、内部は数） */
const CHALLENGE_MULTS = [1,2,4,8,16,32,64,128,256,512,1024,2048,4096,8196,16392,39000];

/* -----------------------
   統一状態
   ----------------------- */
const state = {
  screen: 'stage',        // 'stage' | 'upgrade' | 'play'
  running: false,
  overlayMode: null,
  overlayBusy: false,
  debug: false
};

/* -----------------------
   保存 (load/persist)
   ----------------------- */
let save = null;
function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){
      save = {
        version:'4.0',
        totalXP: 0,
        baseUpgrades: { atk:0, shield:0, speed:0 },
        ownedCards: [], // will init below
        cardPools: { N:40*3, R:10*3, SR:5*3, SSR:2*3 }, // 3倍化
        unlockedStages: [1],
        settings: { challengeMultiplier:1 },
        choiceSlots: 3,
        // activeDeck: sessionの出陣デッキ（永続保存しておく）
        activeDeck: []
      };
      // 初期10枚（必ず名前と効果あり）
      const initial = [
        { id:'N_init_strike', baseId:'N_template_01', rarity:'N', label:'基礎射撃訓練', desc:'攻撃力+12%（セッション）', effectKey:'atk_pct', params:{pct:0.12} },
        { id:'N_init_boots', baseId:'N_template_02', rarity:'N', label:'機動ブーツ', desc:'移動速度+12%', effectKey:'speed_pct', params:{pct:0.12} },
        { id:'N_init_shield', baseId:'N_template_03', rarity:'N', label:'小型シールド', desc:'シールド+400', effectKey:'shield_plus', params:{amt:400} },
        { id:'N_init_regen', baseId:'N_template_04', rarity:'N', label:'自己修復', desc:'シールド回復+4/s', effectKey:'regen', params:{amt:4} },
        { id:'N_init_pierce', baseId:'N_template_05', rarity:'N', label:'貫通基礎', desc:'貫通+1', effectKey:'pierce_plus', params:{amt:1} },
        { id:'N_init_spread', baseId:'N_template_06', rarity:'N', label:'拡散基礎', desc:'拡散+1', effectKey:'spread_plus', params:{amt:1} },
        { id:'N_init_bspeed', baseId:'N_template_07', rarity:'N', label:'弾速強化', desc:'弾速+10%', effectKey:'bullet_speed_pct', params:{pct:0.10} },
        { id:'N_init_xp', baseId:'N_template_08', rarity:'N', label:'学習の兆し', desc:'獲得XP+10%', effectKey:'xp_boost_pct', params:{pct:0.10} },
        { id:'N_init_split', baseId:'N_template_09', rarity:'N', label:'小型分裂弾', desc:'命中時低確率で小分裂', effectKey:'split_on_hit', params:{chance:0.18, shards:2} },
        { id:'N_init_pulse', baseId:'N_template_10', rarity:'N', label:'小範囲パルス', desc:'短間隔の小範囲ダメージ', effectKey:'area_pulse', params:{interval:6000,dmg:30} }
      ];
      save.ownedCards = initial.slice();
      persistSave();
      return save;
    }
    save = JSON.parse(raw);
    // ensure fields
    if(!save.baseUpgrades) save.baseUpgrades = { atk:0, shield:0, speed:0 };
    if(!Array.isArray(save.ownedCards)) save.ownedCards = [];
    if(!save.cardPools) save.cardPools = { N:40*3, R:10*3, SR:5*3, SSR:2*3 };
    if(!save.settings) save.settings = { challengeMultiplier:1 };
    if(!save.choiceSlots) save.choiceSlots = 3;
    if(!Array.isArray(save.activeDeck)) save.activeDeck = [];
    return save;
  } catch(e){
    console.error('loadSave error', e);
    localStorage.removeItem(SAVE_KEY);
    return loadSave();
  }
}
function persistSave(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch(e){
    console.error('persistSave error', e);
  }
}

/* -----------------------
   UI 要素
   ----------------------- */
const ui = {
  canvas: document.getElementById('gameCanvas'),
  overlay: document.getElementById('overlay'),
  overlayPanel: document.getElementById('overlayPanel'),
  stickBase: document.getElementById('stickBase'),
  stickKnob: document.getElementById('stickKnob'),
  tabs: document.querySelectorAll('.tabBtn'),
  uiLevel: document.getElementById('uiLevel'),
  uiXpBar: document.getElementById('uiXpBar'),
  uiXpText: document.getElementById('uiXpText'),
  uiShield: document.getElementById('uiShield'),
  uiShieldBar: document.getElementById('uiShieldBar'),
  uiScore: document.getElementById('uiScore'),
  uiDps: document.getElementById('uiDps'),
  uiBaseAtk: document.getElementById('uiBaseAtk'),
  uiMisc: document.getElementById('uiMisc'),
  uiEnemyCount: document.getElementById('uiEnemyCount'),
  uiWaveLabel: document.getElementById('uiWaveLabel'),
  deckBar: document.getElementById('deckBar'),
  gachaOverlay: document.getElementById('gachaOverlay'),
  gachaAnimContainer: document.getElementById('gachaAnimContainer')
};
const ctx = ui.canvas.getContext('2d');

/* -----------------------
   Canvas サイズ
   ----------------------- */
let CANVAS_W = 540, CANVAS_H = 960;
function resizeCanvas(){
  const maxW = Math.min(window.innerWidth - 16, 960);
  CANVAS_W = Math.floor(maxW);
  CANVAS_H = Math.floor(Math.min(window.innerHeight * 0.72, 1200));
  ui.canvas.width = Math.max(320, CANVAS_W);
  ui.canvas.height = Math.max(520, CANVAS_H);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* -----------------------
   Player / Entities 初期化
   ----------------------- */
let player = null;
function resetPlayerForSession(stageMultiplier){
  const atkMult = Math.pow(BASE_UPGRADE_SCALE, (save.baseUpgrades.atk || 0));
  const shieldMult = Math.pow(BASE_UPGRADE_SCALE, (save.baseUpgrades.shield || 0));
  const speedMult = Math.pow(1.2, (save.baseUpgrades.speed || 0));
  player = {
    x: CANVAS_W/2,
    y: CANVAS_H - 80,
    r: 18,
    shieldMax: Math.floor(5000 * shieldMult),
    shield: Math.floor(5000 * shieldMult),
    fireCooldown: 500, // ms
    damagePerShot: Math.max(1, Math.ceil(5 * atkMult)),
    lastShot: 0,
    speedBase: Math.floor(220 * speedMult),
    spread: 1,
    pierce: 1,
    regen: 0,
    level: 1,
    xp: 0,
    xpNext: 10, // 初回を小さめに
    passives: {},
    buffs: {}
  };
}

/* -----------------------
   コンテナ
   ----------------------- */
let bullets = [], enemies = [], enemyBullets = [], effects = [], drones = [];

/* -----------------------
   スティック: 画面どこでも出る実装
   - タッチ開始地点にスティックを移動して表示
   - pointer capture を使う（PCはマウス）
   ----------------------- */
const stickInput = { x:0, y:0, active:false };
let activePointerId = null;
let stickCenter = null;

function initAnywhereStick(){
  const base = ui.stickBase;
  const knob = ui.stickKnob;

  // pointerdown anywhere on canvasWrap (or overlay blocked when overlay open)
  const wrap = document.getElementById('canvasWrap');
  function onPointerDown(e){
    if(state.overlayMode) return; // overlayが開いていたら無効
    activePointerId = e.pointerId;
    try { wrap.setPointerCapture(activePointerId); } catch(_){}
    stickInput.active = true;
    stickCenter = { x: e.clientX, y: e.clientY };
    // position visual stick at center
    base.style.left = (stickCenter.x - base.offsetWidth/2) + 'px';
    base.style.top = (stickCenter.y - base.offsetHeight/2) + 'px';
    base.style.opacity = 1;
    base.style.pointerEvents = 'auto';
    updateKnobFromEvent(e);
  }
  function onPointerMove(e){
    if(!stickInput.active || activePointerId !== e.pointerId) return;
    updateKnobFromEvent(e);
  }
  function onPointerUp(e){
    if(activePointerId !== e.pointerId) return;
    try { wrap.releasePointerCapture(activePointerId); } catch(_){}
    activePointerId = null;
    stickInput.active = false;
    stickInput.x = 0; stickInput.y = 0;
    knob.style.transform = `translate(0,0)`;
    base.style.opacity = 0;
    base.style.pointerEvents = 'none';
  }
  function updateKnobFromEvent(e){
    const dx = e.clientX - (stickCenter.x);
    const dy = e.clientY - (stickCenter.y);
    const max = 48;
    const nx = Math.max(-1, Math.min(1, dx / max));
    const ny = Math.max(-1, Math.min(1, dy / max));
    stickInput.x = nx;
    stickInput.y = ny;
    knob.style.transform = `translate(${nx * max}px, ${ny * max}px)`;
  }

  // bind
  wrap.removeEventListener('pointerdown', onPointerDown);
  wrap.addEventListener('pointerdown', onPointerDown);
  window.removeEventListener('pointermove', onPointerMove);
  window.addEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  window.addEventListener('pointerup', onPointerUp);

  // initially hidden
  base.style.opacity = 0;
  base.style.pointerEvents = 'none';
}
initAnywhereStick();

/* -----------------------
   ステージ／セッション 管理
   ----------------------- */
const session = {
  currentStage: 1,
  stageDifficultyMultiplier: 1,
  sessionXP: 0,
  wave: 1,
  waveState: 'idle',
  spawnTimer: 0,
  spawnedCount: 0,
  activeDeck: [] // runtime deck (synced with save.activeDeck on deploy)
};

/* -----------------------
   カードライブラリ（テンプレート） — 3倍化のためにテンプレートを増やす
   - N: 40*3, R:10*3, SR:5*3, SSR:2*3 (pool counts reflect this)
   ----------------------- */
const CARD_LIBRARY = { N:[], R:[], SR:[], SSR:[] };

/* helper to add template (keeps ids unique) */
function addTemplate(cat, name, desc, effectKey, params){
  const id = `${cat}_${String(CARD_LIBRARY[cat].length+1).padStart(3,'0')}`;
  CARD_LIBRARY[cat].push({ id, baseId:id, rarity:cat, name, desc, effectKey, params, persistentAllowed:true });
}

/* build variety of templates — enough diversity (simplified but large) */
(function buildTemplates(){
  const nBase = [
    ['攻撃+8%','攻撃力が8%上昇', 'atk_pct', {pct:0.08}],
    ['発射速度+12%','発射速度が12%向上','fire_rate_pct',{pct:0.12}],
    ['シールド+450','シールド最大値+450','shield_plus',{amt:450}],
    ['シールド回復+6/s','シールド回復+6/s','regen',{amt:6}],
    ['移動速度+10%','移動速度が10%上昇','speed_pct',{pct:0.10}],
    ['貫通+1','弾の貫通が+1','pierce_plus',{amt:1}],
    ['拡散+1','ショットの拡散が+1','spread_plus',{amt:1}],
    ['弾速+10%','弾の速度が+10%','bullet_speed_pct',{pct:0.10}],
    ['XP+12%','獲得XPが+12%','xp_boost_pct',{pct:0.12}],
    ['小分裂','命中時まれに小分裂','split_on_hit',{chance:0.18,shards:2}]
  ];
  // create 120 N templates by varying params
  for(let i=0;i<120;i++){
    const b = nBase[i % nBase.length];
    const params = JSON.parse(JSON.stringify(b[3]));
    if(params.pct) params.pct = Math.round(params.pct * (0.9 + (i%4)*0.03) * 100)/100;
    if(params.amt) params.amt = Math.ceil(params.amt * (0.9 + (i%5)*0.08));
    addTemplate('N', `${b[0]} (${i+1})`, b[1], b[2], params);
  }

  const rDefs = [
    ['命中分裂','命中時小弾に分裂','split_on_hit',{chance:0.28,shards:3}],
    ['命中爆発','命中時爆発','explode_on_hit',{chance:0.12,dmgMul:0.9,radius:36}],
    ['追尾弾','命中時確率で追尾弾生成','homing_on_hit',{chance:0.18,power:0.45}],
    ['撃破散布','撃破時小弾散布','kill_scatter',{shards:6,dmgMul:0.35}],
    ['与ダメ吸収','与ダメの6%をシールド化','leech_pct',{pct:0.06}],
    ['命中遅延','命中時遅延付与','slow_on_hit',{chance:0.30,dur:1500}],
    ['XP+15%','獲得XP+15%','xp_up_pct',{pct:0.15}],
    ['二連射','一定確率で追加弾','double_shot',{chance:0.5}],
    ['貫通大','貫通+2','pierce_big',{amt:2}],
    ['拡散大','拡散+2','spread_big',{amt:2}]
  ];
  for(let i=0;i<rDefs.length*3;i++){
    const d = rDefs[i % rDefs.length];
    addTemplate('R', `${d[0]} (${i+1})`, d[1], d[2], JSON.parse(JSON.stringify(d[3])));
  }

  const srDefs = [
    ['強爆発','命中時30%で大爆発','explode10',{chance:0.30,radius:48,dmgMul:1.1}],
    ['撃破XP倍','撃破時25%でXP2倍','xp_double_chance',{chance:0.25}],
    ['範囲パルス','一定間隔で範囲攻撃','area_pulse',{interval:4000,dmg:60}],
    ['リスク高報酬','シールド-30% 攻撃+60%','high_risk_high_reward',{shieldMul:0.7,atkMul:1.6}],
    ['ランダムバフ','稀に強化が発生','random_buff',{chance:0.18,buffDur:2500,atkMul:1.5}]
  ];
  for(let i=0;i<srDefs.length*3;i++){
    const d = srDefs[i % srDefs.length];
    addTemplate('SR', `${d[0]} (${i+1})`, d[1], d[2], JSON.parse(JSON.stringify(d[3])));
  }

  const ssrDefs = [
    ['全方向大弾','一度だけ全方向大弾を放つ','all_dir_shot',{burst:12,dmgMul:0.8}],
    ['XP×2常時','獲得XPが常時2倍','xp_gain_double',{mul:2}]
  ];
  for(let i=0;i<ssrDefs.length*3;i++){
    const d = ssrDefs[i % ssrDefs.length];
    addTemplate('SSR', `${d[0]} (${i+1})`, d[1], d[2], JSON.parse(JSON.stringify(d[3])));
  }
})();

/* -----------------------
   Helper: rarity color and tag
   ----------------------- */
function rarityColor(r){ if(r==='SSR') return getComputedStyle(document.documentElement).getPropertyValue('--rarity-SSR'); if(r==='SR') return getComputedStyle(document.documentElement).getPropertyValue('--rarity-SR'); if(r==='R') return getComputedStyle(document.documentElement).getPropertyValue('--rarity-R'); return getComputedStyle(document.documentElement).getPropertyValue('--rarity-N'); }

/* -----------------------
   CARD_EFFECTS: player へ即時適用される関数群
   - ここを拡張すると効果が戦闘で確実に反映されます
   ----------------------- */
const CARD_EFFECTS = {
  atk_pct: function(card){
    const pct = (card.params && card.params.pct) || 0.10;
    player.damagePerShot = Math.max(1, Math.ceil(player.damagePerShot * (1 + pct)));
  },
  fire_rate_pct: function(card){
    const pct = (card.params && card.params.pct) || 0.15;
    player.fireCooldown = Math.max(60, Math.floor(player.fireCooldown * (1 - pct)));
  },
  shield_plus: function(card){
    const amt = (card.params && card.params.amt) || 500;
    player.shieldMax += amt;
    player.shield = Math.min(player.shield, player.shieldMax);
  },
  shield_heal: function(card){
    const amt = (card.params && card.params.amt) || 800;
    player.shield = Math.min(player.shieldMax, player.shield + amt);
  },
  regen: function(card){
    const amt = (card.params && card.params.amt) || 5;
    player.regen += amt;
  },
  speed_pct: function(card){
    const pct = (card.params && card.params.pct) || 0.10;
    player.speedBase = Math.floor(player.speedBase * (1 + pct));
  },
  pierce_plus: function(card){
    const amt = (card.params && card.params.amt) || 1;
    player.pierce = Math.min(10, player.pierce + amt);
  },
  spread_plus: function(card){
    const amt = (card.params && card.params.amt) || 1;
    player.spread = Math.min(6, player.spread + amt);
  },
  bullet_speed_pct: function(card){
    const pct = (card.params && card.params.pct) || 0.12;
    player.passives.bulletSpeed = (player.passives.bulletSpeed || 1) * (1 + pct);
  },
  xp_boost_pct: function(card){
    const pct = (card.params && card.params.pct) || 0.30;
    player.passives.xpBoost = (player.passives.xpBoost || 0) + pct;
  },

  // R
  split_on_hit: function(card){
    player.passives.splitOnHit = true;
    player.passives.splitChance = Math.min(0.9, (card.params && card.params.chance) || 0.28);
    player.passives.splitShards = Math.min(12, (card.params && card.params.shards) || 3);
  },
  explode_on_hit: function(card){
    player.passives.explodeChance = (player.passives.explodeChance || 0) + ((card.params && card.params.chance) || 0.12);
    player.passives.explodeDmgMul = (player.passives.explodeDmgMul || 1) * ((card.params && card.params.dmgMul) || 1);
    player.passives.explodeRadius = Math.max(player.passives.explodeRadius || 32, (card.params && card.params.radius) || 36);
  },
  homing_on_hit: function(card){
    player.passives.homing = (player.passives.homing || 0) + ((card.params && card.params.power) || 0.45);
  },
  kill_scatter: function(card){
    player.passives.killScatter = (player.passives.killScatter || 0) + ((card.params && card.params.shards) || 6);
  },
  leech_pct: function(card){
    player.passives.leech = (player.passives.leech || 0) + ((card.params && card.params.pct) || 0.06);
  },
  slow_on_hit: function(card){
    player.passives.slow = (player.passives.slow || 0) + ((card.params && card.params.chance) || 0.30);
  },
  xp_up_pct: function(card){
    player.passives.xpBoost = (player.passives.xpBoost || 0) + ((card.params && card.params.pct) || 0.15);
  },
  double_shot: function(card){
    player.passives.doubleShot = (player.passives.doubleShot || 0) + ((card.params && card.params.chance) || 0.5);
  },
  pierce_big: function(card){ player.pierce = Math.min(10, player.pierce + ((card.params && card.params.amt) || 2)); },
  spread_big: function(card){ player.spread = Math.min(6, player.spread + ((card.params && card.params.amt) || 2)); },

  // SR
  explode10: function(card){
    player.passives.explodeChance = (player.passives.explodeChance || 0) + ((card.params && card.params.chance) || 0.30);
    player.passives.explodeRadius = Math.max(player.passives.explodeRadius || 48, (card.params && card.params.radius) || 48);
    player.passives.explodeDmgMul = (player.passives.explodeDmgMul || 1) * ((card.params && card.params.dmgMul) || 1.1);
  },
  xp_double_chance: function(card){
    player.passives.xpDouble = Math.max(player.passives.xpDouble || 0, (card.params && card.params.chance) || 0.25);
  },
  area_pulse: function(card){
    player.passives.areaPulse = player.passives.areaPulse || [];
    player.passives.areaPulse.push({ interval: (card.params && card.params.interval) || 4000, dmg: (card.params && card.params.dmg) || 60, timer:0 });
  },
  high_risk_high_reward: function(card){
    const sm = (card.params && card.params.shieldMul) || 0.7;
    const am = (card.params && card.params.atkMul) || 1.6;
    player.shieldMax = Math.max(200, Math.floor(player.shieldMax * sm));
    player.shield = Math.min(player.shield, player.shieldMax);
    player.damagePerShot = Math.max(1, Math.ceil(player.damagePerShot * am));
  },
  random_buff: function(card){
    player.passives.randomBuff = (player.passives.randomBuff || 0) + ((card.params && card.params.chance) || 0.18);
    player.passives.randomBuffDur = Math.max(player.passives.randomBuffDur || 0, (card.params && card.params.buffDur) || 2500);
    player.passives.randomBuffAtkMul = Math.max(player.passives.randomBuffAtkMul || 1.5, (card.params && card.params.atkMul) || 1.5);
  },

  // SSR
  all_dir_shot: function(card){
    executeAllDirBurst((card.params && card.params.burst) || 12, (card.params && card.params.dmgMul) || 0.8);
  },
  xp_gain_double: function(card){
    player.passives.xpGlobalMul = (player.passives.xpGlobalMul || 1) * ((card.params && card.params.mul) || 2);
  }
};

/* -----------------------
   executeAllDirBurst
   ----------------------- */
function executeAllDirBurst(count, dmgMul){
  const dmg = Math.max(1, Math.floor(player.damagePerShot * (dmgMul || 1)));
  const spawnCount = Math.min(48, count);
  for(let i=0;i<spawnCount;i++){
    if(bullets.length + enemyBullets.length >= SPLIT_GLOBAL_LIMIT) break;
    const ang = (Math.PI*2) * (i / spawnCount);
    const speed = randRange(220,520);
    spawnBullet({ x:player.x, y:player.y - 10, vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed, damage: dmg, pierce:0, gen:1, radius:4 });
  }
}

/* -----------------------
   applyCardToPlayer: 即時に player に効果を適用
   - persistent: 真なら save.activeDeck などに入れて永続化
   ----------------------- */
function applyCardToPlayer(card, options = { persistent:false }){
  if(!card || !card.effectKey) return { applied:false, message: 'カード不正' };
  try {
    const handler = CARD_EFFECTS[card.effectKey];
    if(typeof handler === 'function'){
      handler(card);
    } else {
      // fallback simple handler
      if(card.params && card.params.pct) player.damagePerShot = Math.max(1, Math.ceil(player.damagePerShot * (1 + card.params.pct)));
      else if(card.params && card.params.amt) player.shieldMax += card.params.amt;
    }
    if(options.persistent && save){
      // add to save.ownedCards if not exist
      const inst = { id: `${card.baseId || card.id}_${Date.now()}`, baseId: card.baseId || card.id, rarity: card.rarity || 'N', label: card.name || card.label || card.baseId || card.id, desc: card.desc || '', effectKey: card.effectKey, params: Object.assign({}, card.params || {}) };
      save.ownedCards.push(inst);
      persistSave();
    }
    updateUI();
    effects.push({ type:'apply', x:player.x, y:player.y - 24, ttl:900, maxTtl:900, desc: `${card.rarity} ${card.name || card.label}` });
    return { applied:true };
  } catch(err){
    console.error('applyCardToPlayer error', err);
    return { applied:false, message: String(err) };
  }
}

/* -----------------------
   bullets/enemies spawning helpers
   ----------------------- */
function spawnEnemy({x,y,hp,speed}){
  enemies.push({ id:'mob', x,y,w:44,h:34, hp, maxHp:hp, speed, damage: Math.max(10, Math.ceil(hp/40)*40), status:[] });
}
function spawnBoss({x,y,hp,vx,shootInterval}){
  enemies.push({ id:'boss', x,y,w:160,h:86, hp, maxHp:hp, vx, shootInterval, shootTimer:0, status:[] });
}
function spawnBullet({x,y,vx,vy,damage=1,pierce=0,gen=0,radius=4,meta={}}){
  if(bullets.length + enemyBullets.length >= MAX_ONSCREEN_PROJECTILES) {
    // prune oldest friendly bullets
    while(bullets.length && (bullets.length + enemyBullets.length) >= MAX_ONSCREEN_PROJECTILES) bullets.shift();
    if(bullets.length + enemyBullets.length >= MAX_ONSCREEN_PROJECTILES) return null;
  }
  bullets.push({ x,y,vx,vy,damage,pierce,gen,radius,meta, born:performance.now() });
  return true;
}

/* -----------------------
   XP / レベル処理（敵撃破でXPが入り、レベルに達したら選択肢）
   ----------------------- */
function computeFinalXP(baseXp){
  let xp = baseXp;
  if(player.passives && player.passives.xpBoost) xp = Math.floor(xp * (1 + player.passives.xpBoost));
  if(player.passives && player.passives.xpGlobalMul) xp = Math.floor(xp * player.passives.xpGlobalMul);
  if(player.passives && player.passives.xpDouble && Math.random() < player.passives.xpDouble) xp *= 2;
  return xp;
}
function giveXP(baseXp){
  const xp = computeFinalXP(Math.floor(baseXp));
  session.sessionXP += xp;
  player.xp += xp;
  // handle level-ups possibly multiple times
  while(player.xp >= player.xpNext){
    player.xp -= player.xpNext;
    player.level++;
    // xpNext scaling (gentler)
    player.xpNext = Math.ceil(player.xpNext * 1.35);
    // open choices using save.choiceSlots
    openLevelUpChoices(save.choiceSlots || 3, { origin:'levelup' });
  }
  updateUI();
}

/* -----------------------

/* -----------------------
   Level-up choices（save.choiceSlots に従う）
   - pickCandidatesForChoices を使う（activeDeck優先）
   ----------------------- */
function pickCandidatesForChoices(num){
  // if activeDeck exists and non-empty, sample from it
  const pool = (session.activeDeck && session.activeDeck.length) ? session.activeDeck : save.ownedCards;
  const shuffled = shuffle(pool || []);
  const results = [];
  for(let i=0;i<shuffled.length && results.length < num;i++){
    const c = shuffled[i];
    // ensure label/desc present
    const card = Object.assign({}, c);
    if(!card.label) card.label = card.name || card.baseId || card.id || '無名カード';
    if(!card.desc) card.desc = c.desc || '';
    if(!card.effectKey && c.effectKey) card.effectKey = c.effectKey;
    results.push(card);
  }
  // fallback if not enough
  while(results.length < num){
    results.push({ id:`fallback_${Date.now()}_${results.length}`, rarity:'N', label:'基礎攻撃+10%', desc:'仮効果: 攻撃+10%', effectKey:'atk_pct', params:{pct:0.10} });
  }
  return results;
}

function openLevelUpChoices(num, opts = {}){
  state.running = false;
  openOverlay('levelUp', (panel) => {
    const title = document.createElement('div'); title.style.fontWeight='900'; title.style.fontSize='18px';
    title.textContent = (opts.origin === 'kill') ? '撃破ボーナス — 効果を選択' : (opts.origin === 'waveClear') ? 'Wave報酬' : 'レベルアップ — 効果を選択';
    panel.appendChild(title);
    const sub = document.createElement('div'); sub.className='small'; sub.style.marginTop='8px'; sub.textContent = `選択肢: ${num} 個表示`;
    panel.appendChild(sub);
    const listDiv = document.createElement('div'); listDiv.className='choices'; listDiv.style.marginTop='10px';
    panel.appendChild(listDiv);
    const candidates = pickCandidatesForChoices(num);
    for(const card of candidates){
      const el = document.createElement('div'); el.className='choice';
      const colorClass = (card.rarity==='SSR')?'rarity-SSR':(card.rarity==='SR')?'rarity-SR':(card.rarity==='R')?'rarity-R':'rarity-N';
      el.innerHTML = `<div style="flex:1;display:flex;align-items:center"><div class="rarity-tag ${colorClass}" style="margin-right:8px">${card.rarity}</div><div><strong>${card.label}</strong><div class="small">${card.desc}</div></div></div><div style="width:70px;text-align:center" class="small">選択</div>`;
      el.addEventListener('click', ()=>{
        // apply session-only
        applyCardToPlayer(card, { persistent:false });
        closeOverlay();
        state.running = true;
      });
      listDiv.appendChild(el);
    }
    const skip = document.createElement('div'); skip.className='btn'; skip.style.marginTop='10px'; skip.textContent='スキップ'; skip.onclick = () => { closeOverlay(); state.running = true; };
    panel.appendChild(skip);
  });
}

/* -----------------------
   startPlay / startWave など
   ----------------------- */
function startPlay(stageNumber, challengeMultiplier=1){
  if(state.overlayBusy) return;
  state.screen = 'play';
  session.currentStage = Math.max(1, Math.min(MAX_STAGE, stageNumber));
  session.stageDifficultyMultiplier = calculateStageMultiplier(session.currentStage) * (challengeMultiplier || 1);
  session.sessionXP = 0;
  session.wave = 1;
  session.waveState = 'spawning';
  session.spawnTimer = 0;
  session.spawnedCount = 0;
  state.running = true;
  bullets = []; enemies = []; enemyBullets = []; effects = []; drones = [];

  // reset player with base upgrades
  resetPlayerForSession(session.stageDifficultyMultiplier);
  // apply deck effects (session.activeDeck)
  session.activeDeck = (save.activeDeck && save.activeDeck.length) ? JSON.parse(JSON.stringify(save.activeDeck)) : [];
  applyActiveDeckToPlayer();

  // start first wave
  startWave(1);
  closeOverlay();
  updateUI();
  switchToTab('play', false);
}

function startWave(waveNum){
  session.wave = waveNum;
  session.spawnTimer = 0;
  session.spawnedCount = 0;
  session.waveState = 'spawning';
  ui.uiWaveLabel.textContent = `Wave ${waveNum}`;
}

/* stage multiplier: simple growth */
function calculateStageMultiplier(stage){
  // exponential-ish but gentle
  return Math.pow(1.08, stage-1);
}

/* apply activeDeck to player (reset then apply each card) */
function applyActiveDeckToPlayer(){
  if(!player) return;
  // reset stats to base (recreate player baseline then reapply baseUpgrades)
  const baseAtk = Math.max(1, Math.ceil(5 * Math.pow(BASE_UPGRADE_SCALE, (save.baseUpgrades.atk||0))));
  player.damagePerShot = baseAtk;
  player.fireCooldown = 500;
  player.pierce = 1;
  player.spread = 1;
  player.regen = 0;
  player.passives = {};
  player.buffs = {};
  // apply each card in session.activeDeck
  for(const c of session.activeDeck){
    // find template if c is instance
    const card = (c.baseId) ? (save.ownedCards.find(x => x.id === c.id) || c) : c;
    applyCardToPlayer(card, { persistent:false });
  }
}

/* -----------------------
   onEnemyDefeated
   ----------------------- */
function onEnemyDefeated(e){
  const mul = session.stageDifficultyMultiplier || 1;
  state.score = (state.score || 0) + Math.max(10, Math.floor((e.maxHp || 100) * 1.2) * mul);
  if(e.id === 'mob'){
    const baseXp = 10 * Math.ceil((e.maxHp||100)/100) * mul; // smaller XP per kill but scales with HP
    giveXP(baseXp);
  } else if(e.id === 'boss'){
    giveXP(400 * mul);
    onGameEnd(true);
  }
}

/* -----------------------
   onGameEnd -> result overlay (commit session XP)

function onGameEnd(win){
  state.running = false;
  openOverlay('result', (panel) => {

      persistSave();

    };

/* -----------------------
   update / mainLoop
   ----------------------- */
let lastTs = performance.now();
function mainLoop(ts){
  const dt = Math.min(40, ts - lastTs);
  lastTs = ts;
  if(state.running){
    try {
      update(dt);
    } catch(e){
      console.error('Update error', e);
      showMessage(`実行時エラー: ${e && e.message ? e.message : String(e)}`);
      state.running = false;
    }
  }
  draw();
  requestAnimationFrame(mainLoop);
}

/* minimal update / draw loops — Part1 は基盤。Part2/3で拡張想定 */
function update(dt){
  // spawn handling simple: spawn enemies by stage/wave
  handleSpawn(dt);

  // move player by stickInput (both axes allowed now; user wanted vertical lock earlier? they asked "どこ押してもスティックが出てきて移動できるように" so allow full movement)
  if(stickInput.active && state.screen === 'play' && state.running){
    const nx = stickInput.x;
    const ny = stickInput.y;
    const speed = player.speedBase;
    player.x += nx * speed * (dt/1000);
    player.y += ny * speed * (dt/1000);
    player.x = clamp(player.x, player.r, CANVAS_W - player.r);
    player.y = clamp(player.y, 60, CANVAS_H - 40);
  }

  // auto fire
  const now = performance.now();
  if(player && now - player.lastShot >= player.fireCooldown && state.running){
    player.lastShot = now;
    const count = player.spread || 1;
    const arc = (count > 1) ? Math.PI/12 : 0;
    for(let i=0;i<count;i++){
      const angle = -Math.PI/2 + (count>1 ? (i - (count-1)/2) * arc : 0);
      const speedBullet = 700 * (player.passives && player.passives.bulletSpeed || 1);
      const vx = Math.cos(angle) * 0;
      const vy = Math.sin(angle) * speedBullet;
      spawnBullet({ x:player.x, y:player.y - player.r - 6, vx, vy, damage:player.damagePerShot, pierce:player.pierce, gen:0, radius:4, meta:{ allowSplit: !!player.passives.splitOnHit, splitChance: player.passives.splitChance || 0.35 } });
      // double_shot passive
      if(player.passives.doubleShot && Math.random() < player.passives.doubleShot){
        // extra immediate bullet
        spawnBullet({ x:player.x+12, y:player.y - player.r - 6, vx, vy, damage:player.damagePerShot, pierce:player.pierce, gen:0, radius:4, meta:{} });
      }
    }
  }

  // bullets move & collision
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += (b.vx || 0) * (dt/1000);
    b.y += (b.vy || -500) * (dt/1000);
    if(b.y < -40 || b.y > CANVAS_H + 40 || b.x < -80 || b.x > CANVAS_W + 80){
      bullets.splice(i,1); continue;
    }
    for(let j = enemies.length - 1; j >= 0; j--){
      const e = enemies[j];
      if(pointInRect(b.x, b.y, e.x, e.y, e.w, e.h)){
        e.hp -= b.damage;
        // splitting
        if(b.gen === 0 && b.meta && b.meta.allowSplit && Math.random() < (b.meta.splitChance || 0.35)){
          const shards = Math.min(6, Math.max(1, Math.floor((b.damage||1)/2)));
          if(bullets.length + enemyBullets.length + shards <= SPLIT_GLOBAL_LIMIT){
            for(let s=0;s<shards;s++){
              const ang = randRange(-Math.PI*0.8, -Math.PI*0.2);
              spawnBullet({ x:e.x, y:e.y, vx: Math.cos(ang)*randRange(40,180), vy: Math.sin(ang)*randRange(260,520), damage: Math.max(1, Math.floor((b.damage||1) * 0.45)), pierce:0, gen:1, radius:3 });
            }
          }
        }
        b.pierce--;
        if(b.pierce < 0){ bullets.splice(i,1); }
        if(e.hp <= 0){ onEnemyDefeated(e); enemies.splice(j,1); }
        break;
      }
    }
  }

  // enemies
  for(let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    if(e.status && e.status.length){
      for(let sIdx = e.status.length - 1; sIdx >= 0; sIdx--){
        const s = e.status[sIdx];
        if(s.type === 'poison'){ e.hp -= s.dps * (dt/1000); s.remain -= dt; if(s.remain <= 0) e.status.splice(sIdx,1); }
        if(s.type === 'slow'){ s.remain -= dt; if(s.remain <= 0) e.status.splice(sIdx,1); }
      }
    }
    if(e.id === 'mob'){
      let slowFactor = 1;
      if(e.status) for(const st of e.status) if(st.type === 'slow') slowFactor = 0.5;
      e.y += e.speed * (dt/1000) * slowFactor;
      if(e.y - e.h/2 > CANVAS_H){
        player.shield -= e.damage;
        enemies.splice(i,1);
        if(player.shield <= 0){ player.shield = 0; onGameEnd(false); return; }
      }
    } else if(e.id === 'boss'){
      e.x += e.vx * (dt/1000);
      if(e.x < e.w/2){ e.x = e.w/2; e.vx *= -1; }
      if(e.x > CANVAS_W - e.w/2){ e.x = CANVAS_W - e.w/2; e.vx *= -1; }
      e.shootTimer = (e.shootTimer || 0) + dt;
      if(e.shootTimer > (e.shootInterval || 900)){
        e.shootTimer = 0;
        const shots = 7;
        for(let s=0;s<shots;s++){
          const ang = Math.PI/2 + (s - (shots-1)/2) * 0.20;
          enemyBullets.push({ x:e.x + randRange(-20,20), y:e.y + e.h/2, vx: Math.cos(ang)*120, vy: Math.sin(ang)*220, damage: Math.ceil(e.maxHp/160) });
        }
      }
      if(e.hp <= 0){ onEnemyDefeated(e); enemies.splice(i,1); }
    }
  }

  // enemy bullets
  for(let i = enemyBullets.length - 1; i >= 0; i--){
    const b = enemyBullets[i];
    b.x += b.vx * (dt/1000);
    b.y += b.vy * (dt/1000);
    if(pointInRect(b.x,b.y,player.x,player.y,player.r*2,player.r*2)){
      player.shield -= b.damage; enemyBullets.splice(i,1);
      if(player.shield <= 0){ player.shield = 0; onGameEnd(false); return; }
      continue;
    }
    if(b.y > CANVAS_H + 40 || b.x < -80 || b.x > CANVAS_W + 80) enemyBullets.splice(i,1);
  }

  // effects TTL
  for(let i = effects.length - 1; i >= 0; i--){
    effects[i].ttl -= dt;
    if(effects[i].ttl <= 0) effects.splice(i,1);
  }

  // regen
  if(player && player.regen > 0) player.shield = Math.min(player.shieldMax, player.shield + player.regen * (dt/1000));

  // wave clear
  if(session.waveState === 'active' && enemies.length === 0){
    session.waveState = 'cleared';
    state.running = false;
    giveXP(50 * (session.stageDifficultyMultiplier || 1));
    openLevelUpChoices(1, { origin:'waveClear' });
  }

  updateUI();
}

function draw(){
  ctx.clearRect(0,0,ui.canvas.width, ui.canvas.height);

  // backdrop stars
  for(let i=0;i<40;i++){
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(((i*47) + (Date.now()/30|0)) % CANVAS_W, (i*31) % CANVAS_H, 1,1);
  }

  // enemies
  for(const e of enemies){
    ctx.save(); ctx.translate(e.x,e.y);
    if(e.id === 'mob'){
      ctx.fillStyle = '#ffb366'; roundRect(ctx, -e.w/2, -e.h/2, e.w, e.h, 8); ctx.fill();
      ctx.fillStyle = '#333'; ctx.fillRect(-e.w/2, e.h/2 + 6, e.w, 8);
      ctx.fillStyle = '#ff6666'; ctx.fillRect(-e.w/2, e.h/2 + 6, e.w * Math.max(0,e.hp) / e.maxHp, 8);
    } else {
      ctx.fillStyle = '#a84d4d'; roundRect(ctx, -e.w/2, -e.h/2, e.w, e.h, 12); ctx.fill();
      ctx.fillStyle = '#222'; ctx.fillRect(-e.w/2, e.h/2 + 10, e.w, 12);
      ctx.fillStyle = '#ff8a8a'; ctx.fillRect(-e.w/2, e.h/2 + 10, e.w * Math.max(0,e.hp) / e.maxHp, 12);
      ctx.fillStyle = '#fff'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText(`BOSS ${Math.floor(e.hp)}/${e.maxHp}`, 0, -e.h/2 - 8);
    }
    ctx.restore();
  }

  // bullets
  for(const b of bullets){ ctx.beginPath(); ctx.fillStyle = '#c6f9ff'; ctx.ellipse(b.x,b.y,b.radius,b.radius,0,0,Math.PI*2); ctx.fill(); }
  for(const eb of enemyBullets){ ctx.beginPath(); ctx.fillStyle = '#ffcccb'; ctx.arc(eb.x,eb.y,5,0,Math.PI*2); ctx.fill(); }

  // effects
  for(const fx of effects){
    if(fx.type === 'explosion'){ ctx.beginPath(); ctx.fillStyle = 'rgba(255,140,60,0.12)'; ctx.arc(fx.x,fx.y,fx.r*(fx.ttl/fx.maxTtl),0,Math.PI*2); ctx.fill(); }
    if(fx.type === 'apply'){ ctx.fillStyle='#fff'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText(fx.desc || '', fx.x, fx.y); }
    if(fx.type === 'pulse'){ ctx.beginPath(); ctx.fillStyle='rgba(120,200,255,0.08)'; ctx.arc(fx.x,fx.y,fx.r*(fx.ttl/fx.maxTtl),0,Math.PI*2); ctx.fill(); }
  }

  // player
  if(player){
    ctx.save(); ctx.translate(player.x,player.y); ctx.fillStyle='#66c0ff'; roundRect(ctx,-player.r,-player.r,player.r*2,player.r*2,8); ctx.fill(); ctx.fillStyle='#032'; ctx.fillRect(-8,-6,16,12); ctx.restore();
  }
}

/* -----------------------
   performGacha (消費して結果を返す)
   - pool respects save.cardPools
   ----------------------- */
function weightedRaritySampleRespectPool(){
  const pool = save.cardPools || {};
  const probs = [
    {key:'SSR',prob:0.02,count:pool.SSR || 0},
    {key:'SR',prob:0.08,count:pool.SR || 0},
    {key:'R',prob:0.20,count:pool.R || 0},
    {key:'N',prob:0.70,count:pool.N || 0}
  ];
  // prefer higher rarities with count>0
  const avail = probs.filter(p => (pool[p.key] || 0) > 0);
  if(avail.length === 0){
    // fallback to N
    return 'N';
  }
  let total = avail.reduce((s,a)=>s+a.prob,0);
  let p = Math.random()*total;
  for(const a of avail){
    if(p < a.prob) return a.key;
    p -= a.prob;
  }
  return avail[avail.length-1].key;
}
function performGacha(){
  if(!save.cardPools) save.cardPools = { N:40*3, R:10*3, SR:5*3, SSR:2*3 };
  const chosenR = weightedRaritySampleRespectPool();
  const list = CARD_LIBRARY[chosenR];
  if(!list || list.length === 0) return null;
  const templ = list[Math.floor(Math.random()*list.length)];
  const instance = { id:`${templ.id}_${Date.now()}`, baseId: templ.id, rarity: templ.rarity, label: templ.name, desc: templ.desc, effectKey: templ.effectKey, params: Object.assign({}, templ.params) };
  save.ownedCards.push(instance);
  save.cardPools[chosenR] = Math.max(0, (save.cardPools[chosenR] || 0) - 1);
  persistSave();
  return instance;
}

/* -----------------------
   handleSpawn (simple progressive waves by stage)
   ----------------------- */
const baseWaveTemplate = function(stage, wave){
  // scale HP / count by stage and wave
  const baseCount = 4 + Math.min(20, Math.floor(stage/2)) + (wave-1)*2;
  const baseHp = Math.max(60, Math.floor(80 + stage*20 + wave*30));
  const speed = Math.min(80, 18 + Math.floor(stage/6) + wave*2);
  return { count: baseCount, hp: baseHp, speed, spawnInterval: Math.max(420, 1100 - wave*60) };
};

function handleSpawn(dt){
  if(session.waveState !== 'spawning' && session.waveState !== 'active') return;
  // boss on every 5th wave or final wave
  if(session.wave % 5 === 0){
    // boss wave
    if(session.waveState === 'spawning' && session.spawnedCount === 0){
      const mul = session.stageDifficultyMultiplier || 1;
      const bossHp = Math.max(1, Math.floor((800 + session.currentStage*120 + session.wave*300) * mul));
      spawnBoss({ x: CANVAS_W/2, y: 80, hp: bossHp, vx: 28, shootInterval: 900 });
      session.spawnedCount = 1;
      session.waveState = 'active';
    }
    return;
  }
  // normal spawn
  const cfg = baseWaveTemplate(session.currentStage, session.wave);
  session.spawnTimer += dt;
  if(session.spawnedCount < cfg.count && session.spawnTimer >= cfg.spawnInterval){
    session.spawnTimer -= cfg.spawnInterval;
    session.spawnedCount++;
    const mul = session.stageDifficultyMultiplier || 1;
    const ex = randRange(30, CANVAS_W - 30);
    const hp = Math.max(1, Math.floor(cfg.hp * mul));
    spawnEnemy({ x:ex, y:-40, hp, speed: cfg.speed });
    if(session.spawnedCount >= cfg.count){
      session.waveState = 'active';
    }
  }
}

/* -----------------------
   Utility
   ----------------------- */
function randRange(a,b){ return Math.random()*(b-a)+a; }
function randint(a,b){ return Math.floor(randRange(a,b+1)); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function shuffle(arr){ return arr.slice().sort(()=>Math.random()-0.5); }
function pointInRect(px,py,rx,ry,rw,rh){ return px >= rx - rw/2 && px <= rx + rw/2 && py >= ry - rh/2 && py <= ry + rh/2; }

<!-- Part1.5 — 小パッチ: ウェーブ遷移とウェーブクリア報酬の堅牢化 -->
<script>
/*
  Part1.5 patch
  目的:
   - ウェーブがクリアになったあと次のウェーブへ移行しないケースを防ぐ
   - レベルアップ／Waveクリア報酬（openLevelUpChoices）の表示・スキップが効かず
     ゲームが停止したままになるケースを防ぐ
  方針:
   - 「報酬表示は非同期の副作用を起こしうる」ことを前提にキューを導入。
   - overlayBusy/overlayMode の不整合によるブロックを回避するため、必ず
     1) overlay の状態を強制クリアするわけではなく（既存UIを壊さない）、
     2) 報酬処理が失敗・例外した場合にゲームを再開するフェイルセーフを入れる
   - 次ウェーブ遷移は session.nextWaveTimer を用いた確実なデクリメントで行う
   - openLevelUpChoices の Skip 挙動を必ず resume（state.running = true）するようにする
*/

(function(){
  // Safety checks
  if(typeof session === 'undefined' || typeof state === 'undefined'){
    console.warn('Part1.5: session/state が未定義です。Part1 の後に挿入してください。');
    return;
  }

  // 設定: ウェーブ遷移ディレイ（ミリ秒）
  const PART15_WAVE_TRANSITION_DELAY = 1200;

  // 報酬キュー: openLevelUpChoices 呼び出しを安定して処理するためのFIFO
  window._part15_rewardQueue = window._part15_rewardQueue || [];

  // 既存関数のバックアップ（存在する場合のみ）
  const _orig_openLevelUpChoices = window.openLevelUpChoices || null;
  const _orig_startWave = window.startWave || null;
  const _orig_handleSpawn = window.handleSpawn || null;
  const _orig_update = window.update || null;

  /* -----------------------
     ユーティリティ: 報酬キュー処理
     - queue item = { type:'levelup'|'waveClear'|'kill', num, opts }
     - openLevelUpChoices の表示に失敗しても resume されるようフェイルセーフを用意
  */
  function processRewardQueueOnce(){
    if(!_part15_rewardQueue || _part15_rewardQueue.length === 0) return false;
    const item = _part15_rewardQueue.shift();
    try {
      // Try to call the "official" level-up display if present
      if(typeof _orig_openLevelUpChoices === 'function'){
        // call wrapped original in try-catch
        try {
          _orig_openLevelUpChoices(item.num || 1, item.opts || {});
          return true;
        } catch(err){
          console.error('Part1.5: orig openLevelUpChoices threw', err);
          // fallthrough to our safe UI below
        }
      }
      // Fallback safe UI: ensure skip always resumes
      safeOpenLevelUpChoices(item.num || 1, item.opts || {});
      return true;
    } catch(err){
      console.error('Part1.5: processRewardQueueOnce failed', err);
      // ensure we don't deadlock the game
      state.running = true;
      return false;
    }
  }

  /* -----------------------
     safeOpenLevelUpChoices:
     - openLevelUpChoices が不安定な環境向けの堅牢な実装
     - skip を必ず受け取れるようにし、例外・overlayBusy時でも resume する
  */
  function safeOpenLevelUpChoices(num, opts){
    // Guard: don't double-open
    if(state.overlayMode && state.overlayMode !== 'levelUp'){
      // If some other overlay is present, queue this reward and return
      window._part15_rewardQueue.push({ type:'levelup', num, opts });
      return;
    }

    // Pause game
    state.running = false;

    // Use openOverlay if present, but make sure overlayBusy toggling is safe
    try {
      // ensure overlayBusy false before we call (defensive)
      state.overlayBusy = false;
      openOverlay('levelUp', (panel) => {
        // Build safe UI (similar to Part1 style but with guaranteed Skip behavior)
        const title = document.createElement('div'); title.style.fontWeight='900'; title.style.fontSize='18px';
        title.textContent = (opts && opts.origin === 'waveClear') ? 'Waveクリア報酬 — 選択' : 'レベルアップ — 効果を選択';
        panel.appendChild(title);

        const sub = document.createElement('div'); sub.className='small'; sub.style.marginTop='8px';
        sub.textContent = `選択肢を ${num} 個提示します。`;
        panel.appendChild(sub);

        const listDiv = document.createElement('div'); listDiv.className='choices'; listDiv.style.marginTop='10px';
        panel.appendChild(listDiv);

        // pick candidates defensively (use existing helper if available)
        let candidates = [];
        try {
          if(typeof pickCandidatesForChoices === 'function') candidates = pickCandidatesForChoices(num);
        } catch(e){
          console.warn('Part1.5: pickCandidatesForChoices threw, falling back', e);
        }
        if(!candidates || candidates.length === 0){
          // fallback simple generator (non-blocking)
          for(let i=0;i<num;i++){
            candidates.push({ id:`fallback_${i}`, rarity:'N', label:'基礎攻撃+10%', desc:'仮効果', effectKey:'atk_pct', params:{pct:0.10} });
          }
        }

        // render candidates
        candidates.forEach(card => {
          const el = document.createElement('div'); el.className = 'choice';
          const rarity = card.rarity || 'N';
          el.innerHTML = `<div style="flex:1"><strong>[${rarity}] ${card.label || card.name || card.id}</strong><div class="small">${card.desc || ''}</div></div><div style="width:70px;text-align:center" class="small">選択</div>`;
          el.addEventListener('click', ()=>{
            try {
              applyCardToPlayer(card, { persistent:false });
            } catch(e){
              console.error('Part1.5: applyCardToPlayer threw', e);
            } finally {
              closeOverlay();
              state.running = true;
            }
          });
          listDiv.appendChild(el);
        });

        // Skip ボタン: ここが押されたら必ず resume する（overlayBusy に左右されない）
        const skip = document.createElement('div'); skip.className='btn'; skip.style.marginTop='10px'; skip.textContent = 'スキップ';
        skip.addEventListener('click', () => {
          try {
            // mark skip in session if needed (analytics)
            session._lastChoiceSkippedAt = Date.now();
          } finally {
            // close overlay robustly
            try { closeOverlay(); } catch(e){ /* ignore */ }
            state.running = true;
            // If there are queued rewards, schedule immediate processing next tick so game continues but rewards don't pile
            setTimeout(() => { processRewardQueueOnce(); }, 30);
          }
        });
        panel.appendChild(skip);
      });
    } catch(err){
      console.error('Part1.5: safeOpenLevelUpChoices failed', err);
      // crucial: ensure game resumes
      state.running = true;
    }
  }

  /* -----------------------
     override openLevelUpChoices to enqueue + use safe fallback
     - 既存の openLevelUpChoices は残しつつ、こちらを経由してキューに追加する
  */
  window.openLevelUpChoices = function(num, opts){
    // push into reward queue and try to process immediately
    window._part15_rewardQueue.push({ type:'levelup', num: num || 1, opts: opts || {} });
    // process immediately (but non-blocking)
    setTimeout(() => { processRewardQueueOnce(); }, 10);
  };

  /* -----------------------
     wave transition manager
     - session.nextWaveTimer を導入して確実に次へ移行させる
     - 既存 startWave/handleSpawn を壊さず補強する
  */
  if(typeof session.nextWaveTimer === 'undefined') session.nextWaveTimer = null;

  // wrap original startWave to ensure nextWaveTimer reset
  window.startWave = function(waveNum){
    try {
      if(typeof _orig_startWave === 'function'){
        _orig_startWave(waveNum);
      } else {
        // graceful fallback
        session.wave = waveNum;
        session.spawnTimer = 0;
        session.spawnedCount = 0;
        session.waveState = 'spawning';
        ui && ui.uiWaveLabel && (ui.uiWaveLabel.textContent = `Wave ${waveNum}`);
      }
    } catch(e){
      console.error('Part1.5: startWave wrapper orig threw', e);
      // fallback assignments
      session.wave = waveNum;
      session.spawnTimer = 0;
      session.spawnedCount = 0;
      session.waveState = 'spawning';
      if(ui && ui.uiWaveLabel) ui.uiWaveLabel.textContent = `Wave ${waveNum}`;
    } finally {
      // always clear pending nextWaveTimer
      session.nextWaveTimer = null;
    }
  };

  // inject transition tick into main update: wrap existing update
  window.update = function(dt){
    // call original update if present (to keep existing behavior)
    try {
      if(typeof _orig_update === 'function'){
        _orig_update(dt);
      } else {
        // if no original exists, try to keep minimal behavior: call handleSpawn if present
        if(typeof window.handleSpawn === 'function') window.handleSpawn(dt);
      }
    } catch(e){
      console.error('Part1.5: calling original update failed', e);
    }

    // Post-update: check for wave cleared condition and ensure transitions
    try {
      // If waveState set to 'cleared' but nextWaveTimer not set, initialize timer
      if(session.waveState === 'cleared' && (session.nextWaveTimer === null || typeof session.nextWaveTimer === 'undefined')){
        session.nextWaveTimer = PART15_WAVE_TRANSITION_DELAY;
        // ensure we are paused while reward UI is showing; but if overlay isn't open for some reason, we still start timer
        try {
          // If overlay not open, attempt to open reward UI via queue
          if(!state.overlayMode || state.overlayMode === null){
            // give a small delay to let any UI finish
            setTimeout(() => { processRewardQueueOnce(); }, 30);
          }
        } catch(e){ /* ignore */ }
      }
      // countdown
      if(session.waveState === 'cleared' && typeof session.nextWaveTimer === 'number'){
        session.nextWaveTimer -= dt;
        if(session.nextWaveTimer <= 0){
          // move to next wave if any, else end session (call onGameEnd(true))
          session.nextWaveTimer = null;
          // increment wave
          const next = (session.wave || 1) + 1;
          // if there is a max wave logic, respect it if present, otherwise allow increment
          const maxWave = (typeof session.maxWave === 'number') ? session.maxWave : (typeof MAX_STAGE === 'number' ? MAX_STAGE : 9999);
          if(next <= maxWave){
            // start next wave
            try {
              startWave(next);
              // resume running in case we paused
              state.running = true;
            } catch(e){
              console.error('Part1.5: startWave failed on transition', e);
              // fallback: set session values and resume
              session.wave = next;
              session.spawnTimer = 0;
              session.spawnedCount = 0;
              session.waveState = 'spawning';
              state.running = true;
            }
          } else {
            // finished all waves -> call onGameEnd(true) if exists
            if(typeof onGameEnd === 'function') {
              try { onGameEnd(true); } catch(e){ console.error('Part1.5: onGameEnd threw', e); }
            } else {
              state.running = false;
            }
          }
        }
      }

      // Defensive: if wave is 'active' but enemies are 0 and no enemy bullets, move to 'cleared' (fix for cases where earlier code missed)
      try {
        if(session.waveState === 'active' && (Array.isArray(enemies) && enemies.length === 0) && (Array.isArray(enemyBullets) && enemyBullets.length === 0)){
          // occur a wave-clear event
          session.waveState = 'cleared';
          // register a reward (waveClear) to the reward queue if not already queued recently
          // prevent multiple enqueues
          const lastEnq = session._lastWaveClearEnqueuedAt || 0;
          if(Date.now() - lastEnq > 300){ // debounce 300ms
            session._lastWaveClearEnqueuedAt = Date.now();
            // award XP immediately (safer to call giveXP here)
            try { giveXP(50 * (session.stageDifficultyMultiplier || 1)); } catch(e){ console.warn('Part1.5: giveXP threw', e); }
            // enqueue reward UI
            window._part15_rewardQueue.push({ type:'waveClear', num: 1, opts: { origin:'waveClear' } });
          }
        }
      } catch(e){ /* ignore detection errors */ }

    } catch(err){
      console.error('Part1.5: update post-checks failed', err);
      // ensure game not stuck
      state.running = true;
    }
  }; // end update wrapper

  /* -----------------------
     Ensure skip works even if overlayBusy stuck (watchdog)
     - もし overlayBusy が true で長時間経過している場合、
       watchDog が解除して UI を閉じて state.running=true にする（最終手段）
  */
  (function installOverlayWatchdog(){
    const WATCHDOG_INTERVAL = 800; // ms
    const MAX_BUSY_MS = 5000; // ms -> 強制解除しないとプレイヤーが詰む
    window._part15_overlayBusySince = window._part15_overlayBusySince || null;
    setInterval(() => {
      if(state && state.overlayBusy){
        if(!window._part15_overlayBusySince) window._part15_overlayBusySince = Date.now();
        else {
          if(Date.now() - window._part15_overlayBusySince > MAX_BUSY_MS){
            // force-close overlay non-destructively
            try {
              // if overlay DOM exists, click its skip/close if any
              if(document && document.getElementById && document.getElementById('overlayPanel')){
                // attempt to find any .btn with text matching 'スキップ' or '閉じる' or 'OK' and click
                const panel = document.getElementById('overlayPanel');
                const btns = panel.querySelectorAll('.btn');
                for(const b of btns){
                  const txt = (b.textContent||'').trim();
                  if(txt === 'スキップ' || txt === '閉じる' || txt === 'OK' || txt === 'OK'){
                    try { b.click(); } catch(e){}
                  }
                }
              }
            } catch(e){
              // ignore
            } finally {
              // final fallback: clear flags
              state.overlayBusy = false;
              state.overlayMode = null;
              try { closeOverlay(); } catch(e){ /* ignore */ }
              state.running = true;
              window._part15_overlayBusySince = null;
            }
          }
        }
      } else {
        window._part15_overlayBusySince = null;
      }
    }, WATCHDOG_INTERVAL);
  })();

  /* -----------------------
     Small helper: ensure rewardQueue will be processed regularly
     - If nothing processing it, process once per 300ms when game isn't running
  */
  (function installRewardQueueDrainer(){
    setInterval(() => {
      try {
        // Only process if queue exists and game is paused or overlay not open for convenience
        if(window._part15_rewardQueue && window._part15_rewardQueue.length > 0){
          // If game paused, process; if running, process only 1 item
          if(!state.running){
            processRewardQueueOnce();
          } else {
            // if running, don't disturb too much: process one item only to avoid unexpected pausing
            // but still process if overlay is null (meaning original didn't open)
            if(!state.overlayMode) processRewardQueueOnce();
          }
        }
      } catch(e){ /* ignore drainer errors */ }
    }, 300);
  })();

  // Done: log that patch applied
  console.log('Part1.5 applied: Wave transition + Reward queue + overlay watchdog installed.');
})();

<!-- Part2 — 拡張：カード適用の完全化 / 装備スロット(最大10) / ガチャ演出強化 / ジョイスティック任意出現 / ステージ倍率拡張等 -->
<script>
/*
  Part2 (大改修)
  - 目的（要点）:
    1. カード効果（攻撃以外）を確実に player に反映する（applyCardToPlayer を強化）
    2. 永続装備スロット（save.equipped）を導入し、最大デフォルト 10 枚まで装備可能にする
       - 強化画面の「適用」ボタンで装備（追加/削除）
       - 出陣(startPlay)時に装備カードがセッションへ適用される
    3. ガチャのプールを 3 倍化（テンプレート/カウントの“実質”増加）し、演出を派手にする
    4. ステージ選択に幅広いチャレンジ倍率オプションを追加（1x,2x,4x,...,39000x 等、壊れても可）
    5. 画面のどこを押してもスティックが現れ移動できるように（overlay 時は無効）
    6. 初期所持カードに必ず名前・説明・効果を付与（欠損補填）
    7. レアリティ毎の UI 色付け（見分けやすくする）
    8. 敵を倒したときの「経験値ベースの成長選択肢」動作を確実化（giveXP → openLevelUpChoices）
    9. 既存実装を壊さないように可能な限りラップ・上書き（互換性優先）
*/

(function(){

  /* -----------------------
     Safety / boot checks & defaults
     ----------------------- */
  if(typeof window.save === 'undefined') window.save = {};
  if(typeof window.player === 'undefined') {
    // Not fatal — many functions will guard against undefined player
    console.warn('Part2: player undefined (will defer some actions until player exists)');
  }
  // Ensure arrays & fields
  save.ownedCards = Array.isArray(save.ownedCards) ? save.ownedCards : [];
  save.cardPools = save.cardPools || { N:40, R:10, SR:5, SSR:2 };
  save.equipped = Array.isArray(save.equipped) ? save.equipped : []; // persistent equipped loadout
  save.equipCapacity = (typeof save.equipCapacity === 'number') ? save.equipCapacity : 10; // user asked 10
  save.choiceSlots = (typeof save.choiceSlots === 'number') ? save.choiceSlots : 3;

  // Rarity -> color (used in UI badges)
  const RARITY_COLORS = { N:'#9aa6b2', R:'#7ad1ff', SR:'#d19bff', SSR:'#ffd36b' };

  // Multi-stage multipliers (extend to 30 stages)
  const EXTRA_MULTIPLIERS = [1,2,4,8,16,32,64,128,256,512,1024,2048,4096,8196,16392,39000];
  // Fill to 30 entries: after provided ones continue doubling (or cap)
  const STAGE_COUNT = 30;
  const STAGE_MULTIPLIERS_NEW = [];
  for(let i=0;i<STAGE_COUNT;i++){
    if(i < EXTRA_MULTIPLIERS.length) STAGE_MULTIPLIERS_NEW.push(EXTRA_MULTIPLIERS[i]);
    else {
      // continue doubling from last known (but may overflow; clamp to big integer)
      const prev = STAGE_MULTIPLIERS_NEW[i-1] || 1;
      const candidate = prev * 2;
      STAGE_MULTIPLIERS_NEW.push(Math.min(candidate, 999999999));
    }
  }

  /* -----------------------
     Triple the gacha pool counts on first-run of this Part (non-destructive)
     - This implements "ガチャの中のカード数を今の3倍に"
     - We multiply counters if a marker not present to avoid triple-multiplying on reloads
     ----------------------- */
  if(!save._part2_gacha_triple_applied){
    save.cardPools.N = Math.max(0, (save.cardPools.N || 40) * 3);
    save.cardPools.R = Math.max(0, (save.cardPools.R || 10) * 3);
    save.cardPools.SR = Math.max(0, (save.cardPools.SR || 5) * 3);
    save.cardPools.SSR = Math.max(0, (save.cardPools.SSR || 2) * 3);
    save._part2_gacha_triple_applied = true;
    try { if(typeof persistSave === 'function') persistSave(); } catch(e){ console.warn('Part2: persistSave error', e); }
  }

  /* -----------------------
     Ensure initial owned cards have labels & effects (defensive)
     - Fill missing fields using CARD_LIBRARY templates if available
     ----------------------- */
  function ensureOwnedCardsHaveLabels(){
    for(let i=0;i<save.ownedCards.length;i++){
      const c = save.ownedCards[i];
      if(!c || typeof c !== 'object') {
        // replace with a random template instance
        const templ = (window.CARD_LIBRARY && CARD_LIBRARY.N && CARD_LIBRARY.N[0]) ? CARD_LIBRARY.N[0] : null;
        if(templ){
          save.ownedCards[i] = { id: `${templ.id}_${Date.now()}`, baseId: templ.id, rarity:templ.rarity||'N', label:templ.name||templ.id, desc:templ.desc||'', effectKey:templ.effectKey||'atk_pct', params: Object.assign({}, templ.params||{}) };
        } else {
          save.ownedCards[i] = { id:`N_fill_${Date.now()}_${i}`, baseId:'N_fallback', rarity:'N', label:'基礎攻撃+10%', desc:'補填カード', effectKey:'atk_pct', params:{pct:0.10} };
        }
        continue;
      }
      // fix missing fields
      if(!c.label || typeof c.label !== 'string' || c.label.trim().length < 2){
        if(c.baseId && typeof window.findTemplateByBaseId === 'function'){
          const templ = findTemplateByBaseId(c.baseId);
          if(templ){ c.label = templ.name || templ.id; c.desc = c.desc || templ.desc || ''; c.effectKey = c.effectKey || templ.effectKey; c.params = c.params || Object.assign({}, templ.params || {}); continue; }
        }
        // fallback: create basic label
        c.label = c.label || `初期カード ${i+1}`;
        c.desc = c.desc || '補填された初期カード';
        c.effectKey = c.effectKey || 'atk_pct';
        c.params = c.params || { pct: 0.10 };
      }
    }
    try { if(typeof persistSave === 'function') persistSave(); } catch(e){ /* ignore */ }
  }
  ensureOwnedCardsHaveLabels();

  /* -----------------------
     Enhanced CARD_EFFECTS applier
     - Wrap/extend applyCardToPlayer so every supported effectKey modifies player/passives robustly
     - Make changes idempotent: applying same template twice will still have reasonable behavior
     ----------------------- */
  const _orig_applyCardToPlayer = window.applyCardToPlayer || null;
  window.applyCardToPlayer = function(card, options = { persistent:false }){

  /* -----------------------
     performGacha augmentation (use updated cardPools; respects triple pool)

     - If pool exhausted for rarity, fallback to N.
     ----------------------- */
  const _orig_performGacha = window.performGacha || null;
  window.performGacha = function(){
    // Use existing implementation if present but wrap to be defensive
    if(typeof _orig_performGacha === 'function'){
      try {
        const inst = _orig_performGacha();
        // if original returned null but pools > 0, try fallback sampling
        if(!inst){
          // fallback simple sampling from CARD_LIBRARY respecting pool counts
          const avail = Object.keys(save.cardPools || {}).filter(k => (save.cardPools[k] || 0) > 0);
          const key = avail.length ? avail[Math.floor(Math.random()*avail.length)] : 'N';
          const list = (window.CARD_LIBRARY && CARD_LIBRARY[key]) ? CARD_LIBRARY[key] : (window.CARD_LIBRARY && CARD_LIBRARY.N ? CARD_LIBRARY.N : []);
          const templ = list[Math.floor(Math.random()*list.length)];
          if(templ){
            const instance = { id: `${templ.id}_${Date.now()}`, baseId: templ.id, rarity: templ.rarity, label: templ.name, desc: templ.desc, effectKey: templ.effectKey, params: Object.assign({}, templ.params || {}) };
            save.ownedCards.push(instance);
            save.cardPools[key] = Math.max(0, (save.cardPools[key]||0) - 1);
            try{ persistSave(); }catch(e){}
            return instance;
          }
        }
        return inst;
      } catch(e){
        console.warn('Part2: orig performGacha threw, falling back', e);
      }
    }

    // Fallback if no original performGacha
    if(!window.CARD_LIBRARY) return null;
    // choose rarity by probabilities but respect pools
    const probs = [{key:'SSR',prob:0.02},{key:'SR',prob:0.08},{key:'R',prob:0.20},{key:'N',prob:0.70}]; // sample from high->low to bias toward SSR last
    let chosen = 'N';
    // build weighted list of available rarities
    const available = probs.filter(p => (save.cardPools[p.key] || 0) > 0);
    if(available.length === 0) available.push({key:'N',prob:1});
    // normalize and sample
    const total = available.reduce((s,a)=>s+a.prob,0);
    let r = Math.random()*total;
    for(const a of available){ if(r < a.prob){ chosen = a.key; break } r -= a.prob; }
    const list = CARD_LIBRARY[chosen] || CARD_LIBRARY.N || [];
    if(!list || list.length === 0) return null;
    const templ = list[Math.floor(Math.random()*list.length)];
    const instance = { id: `${templ.id}_${Date.now()}`, baseId: templ.id, rarity: templ.rarity, label: templ.name, desc: templ.desc, effectKey: templ.effectKey, params: Object.assign({}, templ.params || {}) };
    save.ownedCards.push(instance);
    save.cardPools[chosen] = Math.max(0, (save.cardPools[chosen]||0) - 1);
    try{ persistSave(); }catch(e){}
    return instance;
  };

  /* -----------------------------
     2) SyntaxError 緩和/診断ヘルパ

     - また、簡易的に inline script のテキストを検査し "譜面的" な余分なセミコロンや未閉鎖括弧の兆候をログに出す
     - 注意: parse 時点で既に失敗しているスクリプトを完全に自動修正することは保証できませんが、
       影響を最小化してユーザーが次に取るべき手順（どのファイル・行を修正すべきか）を明示します。
  */
  (function installSyntaxErrorHandler(){
    // accumulate errors to avoid spamming
    window._miniPart25_syntaxErrors = window._miniPart25_syntaxErrors || [];

    window.addEventListener('error', function(ev){
      try {
        // ev.message, ev.filename, ev.lineno, ev.colno, ev.error
        const msg = ev && ev.message ? String(ev.message) : 'Unknown error';
        const filename = ev && ev.filename ? ev.filename : '(inline)';
        const lineno = ev && ev.lineno ? ev.lineno : null;
        const colno = ev && ev.colno ? ev.colno : null;
        const stack = ev && ev.error && ev.error.stack ? ev.error.stack : (ev && ev.error ? String(ev.error) : '');
        // If it's a SyntaxError or contains "Unexpected token" treat specially
        const isSyntax = /SyntaxError|Unexpected token|unexpected token/i.test(msg);
        // Deduplicate by message+filename+lineno within a short window
        const key = `${msg} @ ${filename}:${lineno}:${colno}`;
        if(window._miniPart25_syntaxErrors.indexOf(key) !== -1) return;
        window._miniPart25_syntaxErrors.push(key);
        setTimeout(()=> { const idx = window._miniPart25_syntaxErrors.indexOf(key); if(idx>=0) window._miniPart25_syntaxErrors.splice(idx,1); }, 120000);

        // Show user-friendly message via showMessage if available
        const show = typeof showMessage === 'function' ? showMessage : function(txt){ console.warn('MSG:', txt); };
        if(isSyntax){
          // Try to find offending <script> element by matching filename or scanning inline scripts for suspicious content around the reported line
          let foundScript = null;
          try {
            const scripts = Array.from(document.getElementsByTagName('script'));
            // Match by src (absolute or relative)
            foundScript = scripts.find(s => {
              if(!s) return false;
              if(s.src && filename && filename !== '(inline)'){
                // Compare last path segments to be flexible
                const a = (s.src||'').split('/').slice(-1)[0];
                const b = (filename||'').split('/').slice(-1)[0];
                if(a && b && a === b) return true;
                // Or full match
                if(s.src === filename) return true;
              }
              return false;
            });
            // If not found and filename is '(inline)', try to match by scanning inline script text for suspicious token near lineno (best-effort)
            if(!foundScript && lineno !== null){
              for(const s of scripts){
                if(!s.src){
                  const txt = s.textContent || '';
                  // simple heuristic: if the line number is relatively small and the script length is large, skip;
                  // otherwise check if 'Unexpected token' related characters near lineno are present (like extra semicolons)
                  const lines = txt.split('\n');
                  if(lines.length >= lineno-3 && lines.length <= lineno+3 + 1000){
                    // check lines around lineno for ';;' or unmatched parentheses
                    const idx = Math.max(0, Math.min(lines.length-1, lineno-1));
                    const snippet = lines.slice(Math.max(0,idx-3), Math.min(lines.length, idx+3)).join('\n');
                    if(/;;|Unexpected token|syntax error|[^)]\);/.test(snippet) || /function\s+\w+\(|=>/.test(snippet)){
                      foundScript = s;
                      break;
                    }
                  }
                }
              }
            }
          } catch(err){
            console.warn('MiniPart2.5: script find failed', err);
          }

          // Construct helpful message
          let userMsg = `構文エラーを検出しました:\n${msg}\nファイル: ${filename}${lineno ? ` (行 ${lineno}${colno ? ` 列 ${colno}` : ''})` : ''}\n`;
          userMsg += 'このエラーは該当スクリプトの構文が正しくないことを示します。開発者コンソールのログ（エラーメッセージとスタック）を確認し、該当ファイルのその行付近の括弧やカンマ、引数リストを見直してください。';

          // If we found a likely script element, try to "quarantine" it to prevent further parse/execution attempts
          if(foundScript){
            try {
              // Mark original and disable by changing type to text/plain so browser won't execute it if reinserted
              foundScript.setAttribute('data-mini-part25-quarantined','1');
              // Best-effort: replace problematic characters around suspected line if inline (non-src) -- we do NOT attempt aggressive automated edits, only comment out the suspected line(s)
              if(!foundScript.src){
                const txt = foundScript.textContent || '';
                const lines = txt.split('\n');
                const targetLine = (lineno && lineno > 0 && lineno <= lines.length) ? lineno-1 : Math.max(0, Math.floor(lines.length/2));
                // comment out the single suspicious line to try to recover execution of the remainder
                lines[targetLine] = `/* MiniPart2.5: auto-commented suspected syntax error line to allow recovery */ ${lines[targetLine].replace(/./g,' ')}`;
                // create a new script element with type text/javascript but safe content: we will try to re-add a sanitized version as text/plain (so it is inert)
                const sanitized = document.createElement('script');
                sanitized.type = 'text/plain';
                sanitized.textContent = lines.join('\n');
                // insert sanitized after original and remove original to avoid re-execution
                foundScript.parentNode && foundScript.parentNode.insertBefore(sanitized, foundScript.nextSibling);
                // Also disable original to prevent future re-eval (if any) by renaming its type
                foundScript.type = 'text/plain';
              } else {
                // For external script (src), we cannot modify its source from the client safely; instead we mark and notify user
                foundScript.type = 'text/plain'; // this will stop future execution attempts if script element is re-evaluated
              }
              userMsg += '\n該当スクリプト要素を一時的に隔離しました（自動緩和）。ただし自動修正は限定的です。';
            } catch(err){
              console.warn('MiniPart2.5: quarantining script failed', err);
              userMsg += '\n該当スクリプトの隔離に失敗しました。コンソールの詳細ログを開いてください。';
            }
          } else {
            userMsg += '\n自動的に該当スクリプトを特定できませんでした。コンソールのファイル名と行番号を手がかりに該当スクリプトを編集してください。';
          }

          // Present the message to the user
          try {
            show(userMsg, () => {});
          } catch(e){
            try { showMessage(userMsg); } catch(_){ alert(userMsg); }
          }

          // log details to console
          console.error('MiniPart2.5 SyntaxError detected:', msg, filename, lineno, colno, stack);
        } // end if isSyntax
      } catch(e){ console.warn('MiniPart2.5: error handler threw', e); }
    });
  })();

     Utilities: expose a recovery function in console for manual intervention
     - window.miniPart25_recoverScript(filename, lineno)
     - This will attempt to locate inline script and comment out the given line number (best-effort).
  */
  window.miniPart25_recoverScript = function(filename, lineno){
    try {
      const show = typeof showMessage === 'function' ? showMessage : function(t){ console.log(t); };
      const scripts = Array.from(document.getElementsByTagName('script'));
      let target = null;
      if(filename){
        target = scripts.find(s => s.src && s.src.indexOf(filename) !== -1);
      }
      if(!target){
        // pick first inline script that is not the mini patch itself (heuristic)
        for(const s of scripts){
          if(!s.src && !(s.getAttribute && s.getAttribute('data-mini-part25-quarantined') === '1')){
            target = s; break;
          }
        }
      }
      if(!target) { show('対象のスクリプトが見つかりませんでした。console にあるスクリプト一覧を確認してください。'); return; }
      if(target.src){
        show('対象は外部スクリプトです。ブラウザで直接編集できないため、ソースファイルを修正して再読み込みして下さい: ' + target.src);
        return;
      }
      const txt = target.textContent || '';
      const lines = txt.split('\n');
      const idx = Math.max(0, Math.min(lines.length-1, (lineno || 1) - 1));
      lines[idx] = `/* miniPart25 auto-comment line ${idx+1} */ ${lines[idx].replace(/./g,' ')}`;
      const sanitized = document.createElement('script');
      sanitized.type = 'text/plain';
      sanitized.textContent = lines.join('\n');
      target.parentNode && target.parentNode.insertBefore(sanitized, target.nextSibling);
      // disable original
      target.type = 'text/plain';
      show('インラインスクリプトの該当行をコメントアウトして隔離しました（再読み込みは不要）。ただし自動修正は限定的です。');
    } catch(e){
      console.error('miniPart25_recoverScript failed', e);
      try { showMessage('復旧処理に失敗しました。コンソールを確認してください。'); } catch(_) {}
    }
  };

  /* -----------------------------
     最後に: ログ出力でパッチ適用を通知
  */
  console.log('Mini Part2.5 applied: speed level capped to 3; buy/reset/openUpgradePanel patched; SyntaxError handler installed.');
})();

  // Implement core handlers (safe, idempotent)

  /*** ---- Helper: all-direction burst ---- ***/

  /*** ---- applyCardToPlayer: robust wrapper that uses CARD_EFFECTS map ----*/
  const origApplyCard = typeof w.applyCardToPlayer === 'function' ? w.applyCardToPlayer : null;
  w.applyCardToPlayer = function(card, options){
    options = options || { persistent:false };

    try {
      // normalize card object
      const c = Object.assign({}, card);
      // if card is a template (no label), try to map to label
      if(!c.label && c.baseId && typeof findTemplateByBaseId === 'function'){
        const templ = findTemplateByBaseId(c.baseId);
        if(templ){ c.label = templ.name || templ.id; c.desc = c.desc || templ.desc || ''; c.effectKey = c.effectKey || templ.effectKey; c.params = c.params || templ.params; }
      }
      // prefer CARD_EFFECTS entry
      if(w.CARD_EFFECTS && typeof w.CARD_EFFECTS[c.effectKey] === 'function'){
        w.CARD_EFFECTS[c.effectKey](c);
      } else if(origApplyCard){

      } else {

  /*** ---- Equip system enhancements ----***/
  // equip card to save (idempotent by baseId)
  function equipCard(card){

    if(save.equipped.length >= (save.equipCapacity || MAX_EQUIP_CAP)) return { ok:false, msg:'equip full' };
    // prevent duplicate baseId
    const base = card.baseId || card.id;
    if(save.equipped.some(x => (x.baseId || x.id) === base)) return { ok:false, msg:'already equipped' };
    const inst = { id: `${base}_${Date.now()}`, baseId: base, rarity: card.rarity || 'N', label: card.label || card.name || base, desc: card.desc || '', effectKey: card.effectKey, params: Object.assign({}, card.params || {}) };
