<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>成長型STG — 修正版 Part1（入力・状態・UI 安定版）</title>
<style>
  :root{
    --bg:#041223; --panel:#072433; --accent:#4de0ff; --muted:rgba(255,255,255,0.06);
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#00121a);font-family:system-ui,-apple-system,Roboto,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;color:#fff;overflow:hidden}
  #app{display:flex;flex-direction:column;align-items:center;padding:8px;box-sizing:border-box;height:100%}
  #topHud{width:100%;max-width:720px;display:flex;gap:8px;margin-bottom:6px}
  .statBox{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:8px;border-radius:10px;flex:1;min-width:0}
  .small{font-size:12px;opacity:0.9}
  #canvasWrap{width:100%;max-width:720px;flex:1;display:flex;align-items:center;justify-content:center;position:relative}
  canvas{width:100%;height:100%;border-radius:12px;background:linear-gradient(180deg,#021826,#00121a);touch-action:none}
  /* スティックは常に最前面だが、overlayが開いているときは無効化（pointer-eventsで制御） */
  #stickBase{position:absolute;left:16px;bottom:16px;width:120px;height:120px;border-radius:60px;background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;z-index:80;touch-action:none}
  #stickKnob{width:56px;height:56px;border-radius:28px;background:rgba(255,255,255,0.04);transform:translate(0,0)}
  /* オーバーレイ（モーダル） */
  #overlay{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);z-index:100;pointer-events:auto}
  .panel{background:linear-gradient(180deg,#08202b,#05262b);padding:14px;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.6);width:92%;max-width:780px;max-height:86vh;overflow:auto;pointer-events:auto}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .choice{background:rgba(255,255,255,0.02);padding:10px;border-radius:10px;cursor:pointer;border:1px solid rgba(255,255,255,0.03);display:flex;justify-content:space-between;align-items:center}
  .choice:active{transform:translateY(1px)}
  .btn{background:var(--accent);padding:8px 12px;border-radius:9px;color:#012;font-weight:800;text-align:center;cursor:pointer;user-select:none}
  #bottomTabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.45));gap:8px;z-index:120}
  .tabBtn{background:rgba(255,255,255,0.02);padding:8px 12px;border-radius:10px;color:#fff;cursor:pointer;user-select:none}
  .tabBtn.active{background:var(--accent);color:#001}
  .cardList{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .card{background:rgba(255,255,255,0.02);padding:8px;border-radius:8px;font-size:13px}
  footer{font-size:12px;opacity:0.9;margin-top:6px}
  @media (min-width:900px){
    #stickBase{width:140px;height:140px}#stickKnob{width:64px;height:64px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topHud">
    <div class="statBox">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:900">Lv <span id="uiLevel">1</span></div>
        <div class="small" id="uiWaveLabel">Wave 1</div>
      </div>
      <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
        <div style="flex:1">
          <div class="small">XP</div>
          <div style="background:var(--muted);height:12px;border-radius:8px;overflow:hidden"><div id="uiXpBar" style="height:100%;background:linear-gradient(90deg,var(--accent),#00a6ff);width:0%"></div></div>
        </div>
        <div style="width:84px;text-align:right">
          <div class="small">XP: <span id="uiXpText">0</span></div>
        </div>
      </div>
    </div>

    <div class="statBox" style="text-align:center">
      <div style="font-weight:900">シールド</div>
      <div style="margin-top:6px" class="small" id="uiShield">5000 / 5000</div>
      <div style="margin-top:6px;background:var(--muted);height:12px;border-radius:8px;overflow:hidden"><div id="uiShieldBar" style="height:100%;background:linear-gradient(90deg,var(--accent),#00a6ff);width:100%"></div></div>
    </div>

    <div class="statBox" style="text-align:right">
      <div style="font-weight:900">Score <span id="uiScore">0</span></div>
      <div class="small" id="uiDps">攻撃 10 /秒</div>
    </div>
  </div>

  <div id="canvasWrap">
    <canvas id="gameCanvas"></canvas>

    <!-- 仮想スティック（UIは常設。処理は logic 側で消費） -->
    <div id="stickBase" aria-hidden="false"><div id="stickKnob"></div></div>

    <div id="overlay" aria-hidden="true"><div class="panel" id="overlayPanel"></div></div>
  </div>

  <div style="width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;margin-top:8px">
    <div class="small">基礎攻撃: <span id="uiBaseAtk">10</span> /秒</div>
    <div class="small">貫通/拡散: <span id="uiMisc">pierce:1 spread:1</span></div>
    <div class="small">敵残: <span id="uiEnemyCount">0</span></div>
  </div>

  <footer>このファイルは Part1（入力と画面遷移の安定化）です。Part2でカード詳細を結合してください。</footer>
</div>

<div id="bottomTabs">
  <div class="tabBtn active" data-tab="stage">ステージ選択</div>
  <div class="tabBtn" data-tab="upgrade">強化（永続）</div>
  <div class="tabBtn" data-tab="play">出陣（プレイ）</div>
</div>

<script>
/* ------------------------------------------------------------------
   修正版 Part1 (完全版) — 目的:
   - スティック入力の確実化（UI/ロジック分離）
   - state管理の一本化（screen, running, overlayMode）
   - overlay/ステージ選択/チャレンジ2x が確実に動くように
   - startPlay -> spawn のフロー固定化（敵が出ない問題解消）
   - 保存の初期カードをわかりやすく設定（"N-1"などの曖昧名対策）
   - 単一の game loop、二重ループや再帰の排除
   - event binding の二重付与回避
   ------------------------------------------------------------------ */

/* -----------------------
   定数 / 保存
   ----------------------- */
const SAVE_KEY = 'grow_stg_save_v3';
const STAGE_MULTIPLIERS = [1,2,4,8,16];
const MAX_ONSCREEN_PROJECTILES = 400;
const SPLIT_GLOBAL_LIMIT = 120; // 安全上の総弾数閾値
const BASE_UPGRADE_BASE_COST = 1000;
const BASE_UPGRADE_SCALE = 1.5;
const GACHA_COST_RATIO = 0.30;

/* -----------------------
   統一状態
   ----------------------- */
const state = {
  screen: 'stage',        // 'stage' | 'upgrade' | 'play'
  running: false,         // ゲームループ内で更新するか
  overlayMode: null,      // null | 'stageSelect' | 'upgrade' | 'levelUp' | 'result' | 'message'
  overlayBusy: false,     // overlay操作の再入禁止フラグ
  debug: false
};

/* -----------------------
   save のロード/初期化
   - 初期の所持カードはわかりやすいラベルを与える（N初期カード: 基本効果の説明つき）
   ----------------------- */
let save = null;

function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw){
      save = {
        version:'3.0',
        totalXP: 0,
        baseUpgrades: { atk:0, shield:0, speed:0 },
        // initial 10 descriptive N-cards to avoid "n-1" ambiguity
        ownedCards: [],
        cardPools: { N:40, R:10, SR:5, SSR:2 },
        unlockedStages: [1],
        settings: { challengeMultiplier2xOnDeploy:false }
      };
      // create 10 initial descriptive N cards
      for(let i=0;i<10;i++){
        save.ownedCards.push({
          id:`N_init_${i+1}`,
          baseId:`N_template_${(i%10)+1}`,
          rarity:'N',
          label:`初期Nカード (${i+1})`,
          desc:`攻撃力やシールドに小さな恩恵を与える基本カード #${i+1}`,
          effectKey:'atk_pct',
          params:{ pct:0.10 } // small 10% for initial to be reasonable
        });
      }
      persistSave();
      return save;
    }
    save = JSON.parse(raw);
    // ensure basic fields exist
    if(!save.baseUpgrades) save.baseUpgrades = { atk:0, shield:0, speed:0 };
    if(!Array.isArray(save.ownedCards)) save.ownedCards = [];
    if(!save.cardPools) save.cardPools = { N:40, R:10, SR:5, SSR:2 };
    if(!save.settings) save.settings = { challengeMultiplier2xOnDeploy:false };
    return save;
  } catch(e){
    console.error('loadSave error', e);
    // create fallback save
    localStorage.removeItem(SAVE_KEY);
    return loadSave();
  }
}
function persistSave(){
  try {
    const raw = JSON.stringify(save);
    // safety: very large saves are warned (but still attempt)
    if(raw.length > 1900000){
      console.warn('Save nearing size limit', raw.length);
      // still write but notify user
      showMessage('セーブサイズが大きくなっています。不要なカードを整理してください。');
    }
    localStorage.setItem(SAVE_KEY, raw);
  } catch(e){
    console.error('persistSave error', e);
    showMessage('セーブに失敗しました（ブラウザの容量制限の可能性あり）');
  }
}

/* -----------------------
   UI要素参照
   ----------------------- */
const ui = {
  canvas: document.getElementById('gameCanvas'),
  overlay: document.getElementById('overlay'),
  overlayPanel: document.getElementById('overlayPanel'),
  stickBase: document.getElementById('stickBase'),
  stickKnob: document.getElementById('stickKnob'),
  tabs: document.querySelectorAll('.tabBtn'),
  uiLevel: document.getElementById('uiLevel'),
  uiXpBar: document.getElementById('uiXpBar'),
  uiXpText: document.getElementById('uiXpText'),
  uiShield: document.getElementById('uiShield'),
  uiShieldBar: document.getElementById('uiShieldBar'),
  uiScore: document.getElementById('uiScore'),
  uiDps: document.getElementById('uiDps'),
  uiBaseAtk: document.getElementById('uiBaseAtk'),
  uiMisc: document.getElementById('uiMisc'),
  uiEnemyCount: document.getElementById('uiEnemyCount'),
  uiWaveLabel: document.getElementById('uiWaveLabel')
};
const ctx = ui.canvas.getContext('2d');

/* -----------------------
   Canvas サイズ調整
   ----------------------- */
let CANVAS_W = 360, CANVAS_H = 640;
function resizeCanvas(){
  const maxW = Math.min(window.innerWidth - 16, 720);
  CANVAS_W = Math.floor(maxW);
  CANVAS_H = Math.floor(Math.min(window.innerHeight * 0.72, 960));
  ui.canvas.width = Math.max(320, CANVAS_W);
  ui.canvas.height = Math.max(520, CANVAS_H);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* -----------------------
   プレイヤー/エンティティ初期化ロジック（resetPlayer 経由で再現性を担保）
   ----------------------- */
let player = null;
function resetPlayerForSession(stageMultiplier){
  const atkMult = Math.pow(BASE_UPGRADE_SCALE, (save.baseUpgrades.atk || 0));
  const shieldMult = Math.pow(BASE_UPGRADE_SCALE, (save.baseUpgrades.shield || 0));
  const speedMult = Math.pow(1.2, (save.baseUpgrades.speed || 0));
  player = {
    x: CANVAS_W/2,
    y: CANVAS_H - 80,
    r: 18,
    shieldMax: Math.floor(5000 * shieldMult),
    shield: Math.floor(5000 * shieldMult),
    fireCooldown: 500, // ms
    damagePerShot: Math.max(1, Math.ceil(5 * atkMult)),
    lastShot: 0,
    speedBase: Math.floor(220 * speedMult),
    spread: 1,
    pierce: 1,
    regen: 0,
    level: 1,
    xp: 0,
    xpNext: Math.ceil(100 * (stageMultiplier || 1) * Math.pow(1.25, 0)),
    passives: {},
    buffs: {}
  };
}

/* -----------------------
   弾／敵 等コンテナ
   ----------------------- */
let bullets = [];
let enemies = [];
let enemyBullets = [];
let effects = [];
let drones = [];

/* -----------------------
   スティック入力: UI とロジックを分離
   - stickInput は UI が更新するだけ（x,yは -1..1）
   - ロジックは毎フレームこれを参照して player を移動する
   ----------------------- */
const stickInput = { x:0, y:0, active:false }; // normalized -1..1
let activePointerId = null;
let stickCenter = null; // base center client coords for translation

function initStick(){
  const base = ui.stickBase;
  const knob = ui.stickKnob;

  function pointerDown(e){
    // ignore if overlay modal open (we disable stick while overlay active)
    if(state.overlayMode) return;
    activePointerId = e.pointerId;
    base.setPointerCapture(activePointerId);
    stickInput.active = true;
    // compute center
    const rect = base.getBoundingClientRect();
    stickCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
    updateKnobPositionFromEvent(e);
  }
  function pointerMove(e){
    if(!stickInput.active || activePointerId !== e.pointerId) return;
    updateKnobPositionFromEvent(e);
  }
  function pointerUp(e){
    if(activePointerId !== e.pointerId) return;
    try{ base.releasePointerCapture(activePointerId); } catch(_){}
    activePointerId = null;
    stickInput.active = false;
    stickInput.x = 0; stickInput.y = 0;
    knob.style.transform = `translate(0,0)`;
  }
  function updateKnobPositionFromEvent(e){
    const dx = e.clientX - stickCenter.x;
    const dy = e.clientY - stickCenter.y;
    const max = 44; // max pixel movement visually
    const nx = Math.max(-1, Math.min(1, dx / max));
    const ny = Math.max(-1, Math.min(1, dy / max));
    stickInput.x = nx;
    stickInput.y = ny;
    knob.style.transform = `translate(${nx * max}px, ${ny * max}px)`;
  }

  // attach listeners (ensure we don't add duplicates)
  base.removeEventListener('pointerdown', pointerDown);
  base.addEventListener('pointerdown', pointerDown);
  window.removeEventListener('pointermove', pointerMove);
  window.addEventListener('pointermove', pointerMove);
  window.removeEventListener('pointerup', pointerUp);
  window.addEventListener('pointerup', pointerUp);

  // disabling stick when overlay is open: we will check state.overlayMode in pointer handlers above
}
initStick();

/* -----------------------
   spawn / wave 管理の session
   ----------------------- */
const session = {
  currentStage: 1,
  stageDifficultyMultiplier: 1,
  sessionXP: 0,
  wave: 1,
  waveState: 'idle', // spawning | active | cleared
  spawnTimer: 0,
  spawnedCount: 0
};

/* base wave definitions (kept simple here) */
const baseWaves = {
  1: { count:6, hp:100, speed:20, spawnInterval:900 },
  2: { count:8, hp:140, speed:24, spawnInterval:850 },
  3: { boss:true, bossHP:2000, bossSpeedX:30, bossBulletInterval:900 }
};

/* -----------------------
   敵生成関数（factory）
   ----------------------- */
function spawnEnemy({x,y,hp,speed}){
  enemies.push({ id:'mob', x,y,w:44,h:34, hp, maxHp:hp, speed, damage: Math.max(10, Math.ceil(hp/40)*40), status:[] });
}
function spawnBoss({x,y,hp,vx,shootInterval}){
  enemies.push({ id:'boss', x,y,w:160,h:86, hp, maxHp:hp, vx, shootInterval, shootTimer:0, status:[] });
}

/* -----------------------
   bullet spawn (object param to avoid positional confusion)
   ----------------------- */
function spawnBullet({x,y,vx,vy,damage=1,pierce=0,gen=0,radius=4,meta={}}){
  // enforce global projectile cap lightly (drop oldest friendly bullets first)
  if(bullets.length + enemyBullets.length >= MAX_ONSCREEN_PROJECTILES){
    while(bullets.length + enemyBullets.length >= MAX_ONSCREEN_PROJECTILES && bullets.length) bullets.shift();
    while(bullets.length + enemyBullets.length >= MAX_ONSCREEN_PROJECTILES && enemyBullets.length) enemyBullets.shift();
    if(bullets.length + enemyBullets.length >= MAX_ONSCREEN_PROJECTILES) return null;
  }
  bullets.push({ x,y,vx,vy,damage,pierce,gen,radius,meta, born:performance.now() });
  return true;
}

/* -----------------------
   XP / level functions (centralized)
   ----------------------- */
function computeFinalXP(baseXp){
  let xp = baseXp;
  if(player.passives && player.passives.xpBoost) xp = Math.floor(xp * (1 + player.passives.xpBoost));
  if(player.passives && player.passives.xpGlobalMul) xp = Math.floor(xp * player.passives.xpGlobalMul);
  if(player.passives && player.passives.xpDouble && Math.random() < player.passives.xpDouble) xp *= 2;
  return xp;
}
function giveXP(baseXp){
  const xp = computeFinalXP(Math.floor(baseXp));
  session.sessionXP += xp;
  player.xp += xp;
  // level-up loop: handle one level at a time to avoid nested modals
  if(player.xp >= player.xpNext){
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.ceil(player.xpNext * 1.25);
    // pause game and open level-up
    openLevelUpChoices(3, { origin:'levelup' });
  }
  updateUI();
}

/* -----------------------
   Overlay / Modal helpers
   - openOverlay closes previous and opens new content
   - overlayBusy prevents reentrancy
   ----------------------- */
function openOverlay(mode, builder){
  if(state.overlayBusy) return;
  state.overlayBusy = true;
  state.overlayMode = mode;
  ui.overlay.style.display = 'flex';
  ui.overlay.setAttribute('aria-hidden','false');
  ui.overlayPanel.innerHTML = '';
  try {
    builder(ui.overlayPanel);
  } catch(e){
    console.error('overlay builder error', e);
    ui.overlayPanel.innerHTML = `<div style="font-weight:900">エラー</div><div class="small">${String(e)}</div><div style="margin-top:8px" class="btn" id="overlayCloseBtn">閉じる</div>`;
    const btn = document.getElementById('overlayCloseBtn');
    if(btn) btn.onclick = () => { closeOverlay(); };
  } finally {
    state.overlayBusy = false;
  }
}
function closeOverlay(){
  ui.overlay.style.display = 'none';
  ui.overlay.setAttribute('aria-hidden','true');
  ui.overlayPanel.innerHTML = '';
  state.overlayMode = null;
  state.overlayBusy = false;
}

/* ESC でモーダルを閉じる（アクセシビリティ） */
window.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && state.overlayMode && !state.overlayBusy){
    closeOverlay();
    // resume game if it was paused by modal
    if(!state.running && state.screen === 'play') state.running = true;
  }
});

/* -----------------------
   Level-up / reward UI (basic, safe)
   - Uses save.ownedCards as source and sensible fallback
   ----------------------- */
function openLevelUpChoices(num, opts = {}){
  // Pause updates
  state.running = false;
  openOverlay('levelUp', (panel) => {
    const title = document.createElement('div'); title.style.fontWeight='900'; title.style.fontSize='18px';
    title.textContent = (opts.origin === 'kill') ? '撃破ボーナス — 1つ選択' : (opts.origin === 'waveClear') ? 'Waveクリア報酬' : 'レベルアップ — 効果を選択';
    panel.appendChild(title);
    const sub = document.createElement('div'); sub.className='small'; sub.style.marginTop='8px'; sub.textContent = '所持カードまたは候補からランダムで選ばれます。';
    panel.appendChild(sub);
    const listDiv = document.createElement('div'); listDiv.className='choices'; listDiv.style.marginTop='10px';
    panel.appendChild(listDiv);

    const candidates = [];
    const owned = shuffle(save.ownedCards || []);
    for(let i=0;i<owned.length && candidates.length < num;i++) candidates.push(owned[i]);
    // fallback simple placeholders if not enough
    while(candidates.length < num) candidates.push({ id:`fallback_${candidates.length}`, rarity:'N', label:'基礎攻撃+10%', desc:'仮効果: 攻撃力が10%上がる', effectKey:'atk_pct', params:{pct:0.10} });

    for(const card of candidates){
      const el = document.createElement('div'); el.className='choice';
      el.innerHTML = `<div style="flex:1"><strong>[${card.rarity}] ${card.label}</strong><div class="small">${card.desc || ''}</div></div><div style="width:70px;text-align:center" class="small">選択</div>`;
      el.addEventListener('click', ()=>{
        // apply minimal safe effect (part1 doesn't contain full CARD_EFFECTS)
        applyCardEffectStub(card);
        closeOverlay();
        state.running = true;
      });
      listDiv.appendChild(el);
    }

    const skip = document.createElement('div'); skip.className='btn'; skip.style.marginTop='10px'; skip.textContent='スキップ'; skip.onclick = () => { closeOverlay(); state.running = true; };
    panel.appendChild(skip);
  });
}

/* Minimal safe effect applicator for Part1 (keeps things deterministic)
   - Makes sure "attack" or "shield" changes are applied and updateUI is called.
   - This avoids the problem where choosing a growth does nothing.
*/
function applyCardEffectStub(card){
  if(!card) return;
  // Try to use common keys
  const k = card.effectKey;
  if(k === 'atk_pct' || (card.params && card.params.pct)){
    const pct = (card.params && card.params.pct) || 0.10;
    player.damagePerShot = Math.max(1, Math.ceil(player.damagePerShot * (1 + pct)));
    effects.push({ type:'apply', x:player.x, y:player.y - 20, ttl:800, maxTtl:800, desc: `攻撃+${Math.round(pct*100)}%` });
    updateUI();
    return;
  }
  if(k === 'shield_plus' || (card.params && card.params.amt)){
    const amt = (card.params && card.params.amt) || 500;
    player.shieldMax += amt;
    player.shield = Math.min(player.shield, player.shieldMax);
    effects.push({ type:'apply', x:player.x, y:player.y - 20, ttl:800, maxTtl:800, desc: `シールド+${amt}` });
    updateUI();
    return;
  }
  // fallback: if label contains "攻撃" or "シールド" do a text-match heuristic
  if(card.label && card.label.includes('攻撃')){
    player.damagePerShot = Math.max(1, Math.ceil(player.damagePerShot * 1.10));
    updateUI();
    return;
  }
  // unknown — notify user gently (no alert blocking)
  showMessage('この段階ではカード効果が未定義です（詳細はPart2で適用）');
}

/* -----------------------
   startPlay と spawn の一本化（必ず呼ぶこと）
   - startPlay が必ず resetPlayerForSession を呼び、startWave で spawn を始める
   ----------------------- */
function startPlay(stageNumber, challenge=false){
  // unify start flow and guard reentrancy
  if(state.overlayBusy) return;
  state.screen = 'play';
  session.currentStage = stageNumber;
  session.stageDifficultyMultiplier = STAGE_MULTIPLIERS[stageNumber-1] * (challenge ? 2 : 1);
  session.sessionXP = 0;
  session.wave = 1;
  session.waveState = 'spawning';
  session.spawnTimer = 0;
  session.spawnedCount = 0;
  state.running = true;

  // reset entities
  bullets = []; enemies = []; enemyBullets = []; effects = []; drones = [];

  // reset player using persistent upgrades
  resetPlayerForSession(session.stageDifficultyMultiplier);

  // begin wave 1 immediately
  startWave(1);

  // ensure overlay closed and UI updated
  closeOverlay();
  updateUI();
  switchToTab('play', false);
}

/* startWave simply initializes counters; handleSpawn in update will create enemies */
function startWave(waveNum){
  session.wave = waveNum;
  session.spawnTimer = 0;
  session.spawnedCount = 0;
  session.waveState = 'spawning';
  ui.uiWaveLabel.textContent = `Wave ${waveNum}`;
}

/* handleSpawn called in update() */
function handleSpawn(dt){
  if(session.waveState !== 'spawning' && session.waveState !== 'active') return;
  const cfg = baseWaves[session.wave];
  if(!cfg) return;
  if(session.wave < 3){
    session.spawnTimer += dt;
    const interval = cfg.spawnInterval;
    if(session.spawnedCount < cfg.count && session.spawnTimer >= interval){
      session.spawnTimer -= interval;
      session.spawnedCount++;
      const mul = session.stageDifficultyMultiplier || 1;
      const ex = randRange(30, CANVAS_W - 30);
      const hp = Math.max(1, Math.floor(cfg.hp * mul));
      spawnEnemy({ x:ex, y:-40, hp, speed: cfg.speed });
      if(session.spawnedCount >= cfg.count){
        session.waveState = 'active';
      }
    }
  } else {
    if(session.waveState === 'spawning'){
      const mul = session.stageDifficultyMultiplier || 1;
      const bossHp = Math.max(1, Math.floor(cfg.bossHP * mul));
      spawnBoss({ x: CANVAS_W/2, y: 80, hp: bossHp, vx: cfg.bossSpeedX || 30, shootInterval: cfg.bossBulletInterval || 900 });
      session.waveState = 'active';
    }
  }
}

/* -----------------------
   onEnemyDefeated: unified reward flow (no spam)
   ----------------------- */
let lastKillRewardAt = 0;
function onEnemyDefeated(e){
  const mul = session.stageDifficultyMultiplier || 1;
  state.score = (state.score || 0) + Math.max(10, Math.floor((e.maxHp || 100) * 1.2) * mul);
  if(e.id === 'mob'){
    const baseXp = 50 * mul;
    giveXP(baseXp);
    const now = performance.now();
    if(now - lastKillRewardAt > 600){
      lastKillRewardAt = now;
      // show kill reward choices but limited frequency to avoid breakage
      openLevelUpChoices(3, { origin:'kill' });
    }
  } else if(e.id === 'boss'){
    giveXP(200 * mul);
    onGameEnd(true);
  }
}

/* -----------------------
   onGameEnd -> result overlay -> commit session XP to save when user confirms
   ----------------------- */
function onGameEnd(win){
  state.running = false;
  openOverlay('result', (panel) => {
    const title = document.createElement('div'); title.style.fontWeight='900'; title.textContent = win ? '勝利！' : '敗北';
    panel.appendChild(title);

    info.innerHTML = `今回の獲得XP: ${session.sessionXP}<br>累計XP: ${save.totalXP}`;
    panel.appendChild(info);

    const toUpgrade = document.createElement('div'); toUpgrade.className='btn'; toUpgrade.textContent='強化画面へ'; toUpgrade.onclick = () => {
      // commit xp
      save.totalXP = (save.totalXP || 0) + session.sessionXP;
      persistSave();
      closeOverlay();
      switchToTab('upgrade', true);
    };
    const toStage = document.createElement('div'); toStage.className='btn'; toStage.textContent='ステージ選択へ'; toStage.onclick = () => {

/* -----------------------
   update/draw single unified loop
   - ensures no duplicated requestAnimationFrame calls
   ----------------------- */
let lastTs = performance.now();
function mainLoop(ts){
  const dt = Math.min(40, ts - lastTs);
  lastTs = ts;
  if(state.running){
    try {
      update(dt);
    } catch(e){
      console.error('Update error', e);
      showMessage(`実行時エラーが発生しました: ${e && e.message ? e.message : String(e)}`);
      state.running = false;
    }
  }
  draw();
  requestAnimationFrame(mainLoop);
}
requestAnimationFrame(mainLoop);

/* -----------------------
   update: game logic per-frame
   ----------------------- */
function update(dt){
  // spawn handling
  handleSpawn(dt);

  // move player by stickInput (separated from UI)
  if(stickInput.active && state.screen === 'play' && state.running){
    // normalized input applied to speed
    const nx = stickInput.x;
    const ny = stickInput.y;
    const speed = player.speedBase;
    player.x += nx * speed * (dt/1000);
    player.y += ny * speed * (dt/1000);
    player.x = clamp(player.x, player.r, CANVAS_W - player.r);
    player.y = clamp(player.y, 60, CANVAS_H - 40);
  }

  // auto fire (simple)
  const now = performance.now();
  if(now - player.lastShot >= player.fireCooldown && state.running){
    player.lastShot = now;
    // shoot count = spread
    const count = player.spread || 1;
    const arc = (count > 1) ? Math.PI/12 : 0;
    for(let i=0;i<count;i++){
      const angle = -Math.PI/2 + (count>1 ? (i - (count-1)/2) * arc : 0);
      const speedBullet = 700;
      const vx = Math.cos(angle) * 0;
      const vy = Math.sin(angle) * speedBullet;
      const allowSplit = !!(player.passives && player.passives.splitOnHit);
      const splitChance = (player.passives && player.passives.splitChance) ? player.passives.splitChance : 0.35;
      spawnBullet({ x:player.x, y:player.y - player.r - 6, vx, vy, damage:player.damagePerShot, pierce:player.pierce, gen:0, radius:4, meta:{ allowSplit, splitChance } });
    }
  }

  // bullets collision + movement (similar to earlier but robust)
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += (b.vx || 0) * (dt/1000);
    b.y += (b.vy || -500) * (dt/1000);
    if(b.y < -40 || b.y > CANVAS_H + 40 || b.x < -80 || b.x > CANVAS_W + 80){
      bullets.splice(i,1); continue;
    }
    for(let j = enemies.length - 1; j >= 0; j--){
      const e = enemies[j];
      if(pointInRect(b.x, b.y, e.x, e.y, e.w, e.h)){
        e.hp -= b.damage;
        // splitting safety
        if(b.gen === 0 && b.meta && b.meta.allowSplit && Math.random() < (b.meta.splitChance || 0.35)){
          const shards = Math.min(6, Math.max(1, Math.floor((b.damage||1)/2)));
          if(bullets.length + enemyBullets.length + shards <= SPLIT_GLOBAL_LIMIT){
            for(let s=0;s<shards;s++){
              const ang = randRange(-Math.PI*0.8, -Math.PI*0.2);
              spawnBullet({ x:e.x, y:e.y, vx: Math.cos(ang)*randRange(40,180), vy: Math.sin(ang)*randRange(260,520), damage: Math.max(1, Math.floor((b.damage||1) * 0.45)), pierce:0, gen:1, radius:3 });
            }
          }
        }
        b.pierce--;
        if(b.pierce < 0){ bullets.splice(i,1); }
        if(e.hp <= 0){ onEnemyDefeated(e); enemies.splice(j,1); }
        break;
      }
    }
  }

  // enemies
  for(let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    // status effects (simple)
    if(e.status && e.status.length){
      for(let sIdx = e.status.length - 1; sIdx >= 0; sIdx--){
        const s = e.status[sIdx];
        if(s.type === 'poison'){ e.hp -= s.dps * (dt/1000); s.remain -= dt; if(s.remain <= 0) e.status.splice(sIdx,1); }
        if(s.type === 'slow'){ s.remain -= dt; if(s.remain <= 0) e.status.splice(sIdx,1); }
      }
    }
    if(e.id === 'mob'){
      let slowFactor = 1;
      if(e.status) for(const st of e.status) if(st.type === 'slow') slowFactor = 0.5;
      e.y += e.speed * (dt/1000) * slowFactor;
      if(e.y - e.h/2 > CANVAS_H){
        player.shield -= e.damage;
        enemies.splice(i,1);
        if(player.shield <= 0){ player.shield = 0; onGameEnd(false); return; }
      }
    } else if(e.id === 'boss'){
      e.x += e.vx * (dt/1000);
      if(e.x < e.w/2){ e.x = e.w/2; e.vx *= -1; }
      if(e.x > CANVAS_W - e.w/2){ e.x = CANVAS_W - e.w/2; e.vx *= -1; }
      e.shootTimer = (e.shootTimer || 0) + dt;
      if(e.shootTimer > (e.shootInterval || 900)){
        e.shootTimer = 0;
        const shots = 7;
        for(let s=0;s<shots;s++){
          const ang = Math.PI/2 + (s - (shots-1)/2) * 0.20;
          enemyBullets.push({ x:e.x + randRange(-20,20), y:e.y + e.h/2, vx: Math.cos(ang)*120, vy: Math.sin(ang)*220, damage: Math.ceil(e.maxHp/160) });
        }
      }
      if(e.hp <= 0){ onEnemyDefeated(e); enemies.splice(i,1); }
    }
  }

  // enemy bullets
  for(let i = enemyBullets.length - 1; i >= 0; i--){
    const b = enemyBullets[i];
    b.x += b.vx * (dt/1000);
    b.y += b.vy * (dt/1000);
    if(pointInRect(b.x,b.y,player.x,player.y,player.r*2,player.r*2)){
      player.shield -= b.damage; enemyBullets.splice(i,1);
      if(player.shield <= 0){ player.shield = 0; onGameEnd(false); return; }
      continue;
    }
    if(b.y > CANVAS_H + 40 || b.x < -80 || b.x > CANVAS_W + 80) enemyBullets.splice(i,1);
  }

  // effects TTL
  for(let i = effects.length - 1; i >= 0; i--){
    effects[i].ttl -= dt;
    if(effects[i].ttl <= 0) effects.splice(i,1);
  }

  // passive pulses etc. (kept simple for Part1)
  if(player.passives && player.passives.areaPulse){
    for(const p of player.passives.areaPulse){
      p.timer = (p.timer || 0) + dt;
      if(p.timer >= p.interval){
        p.timer -= p.interval;
        const dmg = p.dmg || 40;
        for(let i=enemies.length-1;i>=0;i--){
          const e = enemies[i];
          if(Math.hypot(e.x-player.x, e.y-(player.y-60)) <= 72){ e.hp -= dmg; if(e.hp <= 0){ onEnemyDefeated(e); enemies.splice(i,1); } }
        }
        effects.push({ type:'pulse', x:player.x, y:player.y-60, ttl:600, maxTtl:600, r:72 });
      }
    }
  }

  // regen
  if(player.regen > 0) player.shield = Math.min(player.shieldMax, player.shield + player.regen * (dt/1000));

  // wave clear
  if(session.waveState === 'active' && enemies.length === 0){
    session.waveState = 'cleared';
    state.running = false;
    giveXP(50 * (session.stageDifficultyMultiplier || 1));
    openLevelUpChoices(1, { origin:'waveClear' });
  }

  updateUI();
}

/* -----------------------
   draw: canvas rendering
   ----------------------- */
function draw(){
  ctx.clearRect(0,0,ui.canvas.width, ui.canvas.height);

  // backdrop stars
  for(let i=0;i<40;i++){
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(((i*47) + (Date.now()/30|0)) % CANVAS_W, (i*31) % CANVAS_H, 1,1);
  }

  // enemies
  for(const e of enemies){
    ctx.save(); ctx.translate(e.x,e.y);
    if(e.id === 'mob'){
      ctx.fillStyle = '#ffb366'; roundRect(ctx, -e.w/2, -e.h/2, e.w, e.h, 8); ctx.fill();
      ctx.fillStyle = '#333'; ctx.fillRect(-e.w/2, e.h/2 + 6, e.w, 8);
      ctx.fillStyle = '#ff6666'; ctx.fillRect(-e.w/2, e.h/2 + 6, e.w * Math.max(0,e.hp) / e.maxHp, 8);
    } else {
      ctx.fillStyle = '#a84d4d'; roundRect(ctx, -e.w/2, -e.h/2, e.w, e.h, 12); ctx.fill();
      ctx.fillStyle = '#222'; ctx.fillRect(-e.w/2, e.h/2 + 10, e.w, 12);
      ctx.fillStyle = '#ff8a8a'; ctx.fillRect(-e.w/2, e.h/2 + 10, e.w * Math.max(0,e.hp) / e.maxHp, 12);
      ctx.fillStyle = '#fff'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText(`BOSS ${Math.floor(e.hp)}/${e.maxHp}`, 0, -e.h/2 - 8);
    }
    ctx.restore();
  }

  // bullets
  for(const b of bullets){ ctx.beginPath(); ctx.fillStyle = '#c6f9ff'; ctx.ellipse(b.x,b.y,b.radius,b.radius,0,0,Math.PI*2); ctx.fill(); }
  for(const eb of enemyBullets){ ctx.beginPath(); ctx.fillStyle = '#ffcccb'; ctx.arc(eb.x,eb.y,5,0,Math.PI*2); ctx.fill(); }

  // effects
  for(const fx of effects){
    if(fx.type === 'explosion'){ ctx.beginPath(); ctx.fillStyle = 'rgba(255,140,60,0.12)'; ctx.arc(fx.x,fx.y,fx.r*(fx.ttl/fx.maxTtl),0,Math.PI*2); ctx.fill(); }
    if(fx.type === 'apply'){ ctx.fillStyle='#fff'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText(fx.desc || '', fx.x, fx.y); }
    if(fx.type === 'pulse'){ ctx.beginPath(); ctx.fillStyle='rgba(120,200,255,0.08)'; ctx.arc(fx.x,fx.y,fx.r*(fx.ttl/fx.maxTtl),0,Math.PI*2); ctx.fill(); }
  }

  // player
  ctx.save(); ctx.translate(player.x,player.y); ctx.fillStyle='#66c0ff'; roundRect(ctx,-player.r,-player.r,player.r*2,player.r*2,8); ctx.fill(); ctx.fillStyle='#032'; ctx.fillRect(-8,-6,16,12); ctx.restore();
}

/* base upgrade purchase */
function buyBaseUpgrade(key){
  const lvl = save.baseUpgrades[key] || 0;
  const cost = Math.ceil(BASE_UPGRADE_BASE_COST * Math.pow(BASE_UPGRADE_SCALE, lvl));
  if((save.totalXP || 0) < cost){ showMessage('累計XPが足りません'); return; }
  save.totalXP -= cost;
  save.baseUpgrades[key] = lvl + 1;
  persistSave();
  // reconstruct player (safe) so upgrades don't stack erroneously
  resetPlayerForSession(session.stageDifficultyMultiplier || 1);
  showMessage(`${key} を強化しました`, ()=>{ openUpgradePanel(); });
}

/* -----------------------
   Tab wiring (centralized and idempotent)
   ----------------------- */
function switchToTab(tab, openOverlayNow=true){
  state.screen = tab;
  document.querySelectorAll('.tabBtn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if(tab === 'stage'){
    if(openOverlayNow) buildStageSelection();
  } else if(tab === 'upgrade'){
    if(openOverlayNow) openUpgradePanel();
  } else if(tab === 'play'){
    closeOverlay();
  }
}
document.querySelectorAll('.tabBtn').forEach(b => {
  b.onclick = () => { switchToTab(b.dataset.tab, true); };
});

/* -----------------------
   Helpers: random / clamp / shuffle
   ----------------------- */
function randRange(a,b){ return Math.random()*(b-a)+a; }
function randint(a,b){ return Math.floor(randRange(a,b+1)); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function shuffle(arr){ return arr.slice().sort(()=>Math.random()-0.5); }
function pointInRect(px,py,rx,ry,rw,rh){ return px >= rx - rw/2 && px <= rx + rw/2 && py >= ry - rh/2 && py <= ry + rh/2; }

/* -----------------------
   Utility: roundRect
   ----------------------- */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

<!-- Part2/2 — 修正版（カード・ガチャ・効果・永続化・選択肢精緻化）
  使い方:

   - 全ての永続データは save に入り、persistSave() で保存される（Part1 の persistSave を利用）。

<script>

/* ----------------------------

/* Card template shape:
   {
     id: 'N_001', baseId:'N_template_1', rarity:'N'|'R'|'SR'|'SSR',

*/
const CARD_LIBRARY = { N:[], R:[], SR:[], SSR:[] };

/* build card templates (exact counts: N:40 R:10 SR:5 SSR:2) */
(function buildTemplates(){

    { name:'シールド上限+500', desc:'シールド最大値を+500する（即時）', effectKey:'shield_plus', params:{amt:500} },
    { name:'シールド回復+800', desc:'シールドを即時+800回復', effectKey:'shield_heal', params:{amt:800} },
    { name:'回復+5/s', desc:'シールドの自動回復が+5/s', effectKey:'regen', params:{amt:5} },
    { name:'移動速度+10%', desc:'移動速度が10%上昇', effectKey:'speed_pct', params:{pct:0.10} },
    { name:'貫通+1', desc:'弾の貫通が+1', effectKey:'pierce_plus', params:{amt:1} },

    { name:'弾速+12%', desc:'弾の速度が+12%', effectKey:'bullet_speed_pct', params:{pct:0.12} },
    { name:'XP獲得+30%', desc:'獲得XPが+30%', effectKey:'xp_boost_pct', params:{pct:0.30} }
  ];
  for(let i=0;i<40;i++){
    const base = nTemplatesBase[i % nTemplatesBase.length];
    const tweak = JSON.parse(JSON.stringify(base.params || {}));
    // small variation so templates are not identical
    if (tweak.pct) tweak.pct = Math.round(tweak.pct * (0.9 + (i%3)*0.05) * 100)/100;
    if (tweak.amt) tweak.amt = Math.ceil(tweak.amt * (0.9 + (i%4)*0.1));
    CARD_LIBRARY.N.push({
      id: `N_${String(i+1).padStart(3,'0')}`,
      baseId: `N_template_${(i%10)+1}`,
      rarity: 'N',
      name: `${base.name} (${i+1})`,
      desc: base.desc,
      effectKey: base.effectKey,

  // R (10)
  const rDefs = [
    { name:'命中分裂', desc:'命中時、確率で小弾に分裂する（壊れ防止あり）', effectKey:'split_on_hit', params:{chance:0.28, shards:3} },
    { name:'命中爆発', desc:'命中時一定確率で爆発ダメージ', effectKey:'explode_on_hit', params:{chance:0.12, dmgMul:0.9, radius:36} },

    { name:'撃破散布', desc:'敵撃破時に小弾をばら撒く', effectKey:'kill_scatter', params:{shards:6, dmgMul:0.35} },
    { name:'与ダメ吸収6%', desc:'与ダメージの6%をシールドで吸収', effectKey:'leech_pct', params:{pct:0.06} },
    { name:'命中遅延', desc:'命中時に敵を遅くする（確率）', effectKey:'slow_on_hit', params:{chance:0.30, dur:1500} },
    { name:'XP+15%', desc:'獲得XP +15%', effectKey:'xp_up_pct', params:{pct:0.15} },
    { name:'二連射', desc:'一定確率で追加弾を同方向に発射', effectKey:'double_shot', params:{chance:0.5} },
    { name:'貫通大', desc:'貫通 +2', effectKey:'pierce_big', params:{amt:2} },
    { name:'拡散大', desc:'拡散 +2', effectKey:'spread_big', params:{amt:2} }

  rDefs.forEach((d,i) => {
    CARD_LIBRARY.R.push(Object.assign({
      id:`R_${String(i+1).padStart(3,'0')}`,

      name:d.name,

  const srDefs = [

    { name:'ランダムバフ', desc:'稀に強化が発生する', effectKey:'random_buff', params:{chance:0.18, buffDur:2500, atkMul:1.5} }
  ];
  srDefs.forEach((d,i) => {
    CARD_LIBRARY.SR.push(Object.assign({
      id:`SR_${String(i+1).padStart(3,'0')}`,
      baseId:`SR_template_${i+1}`,
      rarity:'SR',
      name:d.name,
      desc:d.desc,
      effectKey:d.effectKey,
      params:d.params,
      persistentAllowed:true
    }, {}));
  });

  // SSR (2) — レア
  const ssrDefs = [
    { name:'全方向大弾', desc:'一度だけ全方向大弾を放つ', effectKey:'all_dir_shot', params:{burst:12, dmgMul:0.8} },
    { name:'XP×2常時', desc:'獲得XPが常時2倍になる', effectKey:'xp_gain_double', params:{mul:2} }
  ];
  ssrDefs.forEach((d,i) => {
    CARD_LIBRARY.SSR.push(Object.assign({
      id:`SSR_${String(i+1).padStart(3,'0')}`,
      baseId:`SSR_template_${i+1}`,
      rarity:'SSR',

/* ----------------------------
   Rarity probabilities & pool setup
   - RARITY_PROBS: base probabilities (N/R/SR/SSR)
   - Pool counts must match the number of templates or desired inventory (user asked for N:40,R:10,SR:5,SSR:2)
   ---------------------------- */
const RARITY_PROBS = [{key:'N',prob:0.70},{key:'R',prob:0.20},{key:'SR',prob:0.08},{key:'SSR',prob:0.02}];

/* ensure save.cardPools exists and matches expected pool counts */
(function ensurePools(){
  if(!save) { /* in case Part1 hasn't loaded save yet */ }
  // set default if missing
  if(!save || !save.cardPools){
    // If save not ready yet, postpone; otherwise set counts
    if(save) {
      save.cardPools = { N:40, R:10, SR:5, SSR:2 };
      persistSave();
    }
  } else {
    // ensure minimum values
    save.cardPools.N = Math.max(0, save.cardPools.N || 40);
    save.cardPools.R = Math.max(0, save.cardPools.R || 10);
    save.cardPools.SR = Math.max(0, save.cardPools.SR || 5);
    save.cardPools.SSR = Math.max(0, save.cardPools.SSR || 2);
    persistSave();
  }
})();

/* ----------------------------
   CARD_EFFECTS: 実際に player に効果を適用するハンドラ群
   - applyCardToPlayer はここを呼ぶ
   - すべて安全に（clamp / upper bounds / try/catch）
   ---------------------------- */
const CARD_EFFECTS = {
  atk_pct: function(card){
    const pct = (card.params && card.params.pct) || 0.10;
    player.damagePerShot = Math.max(1, Math.ceil(player.damagePerShot * (1 + pct)));
  },
  fire_rate_pct: function(card){
    const pct = (card.params && card.params.pct) || 0.15;
    player.fireCooldown = Math.max(80, Math.floor(player.fireCooldown * (1 - pct)));
  },
  shield_plus: function(card){
    const amt = (card.params && card.params.amt) || 500;
    player.shieldMax += amt;
    player.shield = Math.min(player.shield, player.shieldMax);
  },
  shield_heal: function(card){
    const amt = (card.params && card.params.amt) || 800;
    player.shield = Math.min(player.shieldMax, player.shield + amt);
  },
  regen: function(card){
    const amt = (card.params && card.params.amt) || 5;
    player.regen += amt;
  },
  speed_pct: function(card){
    const pct = (card.params && card.params.pct) || 0.10;
    player.speedBase = Math.floor(player.speedBase * (1 + pct));
  },
  pierce_plus: function(card){
    const amt = (card.params && card.params.amt) || 1;
    player.pierce = Math.min(10, player.pierce + amt);
  },
  spread_plus: function(card){
    const amt = (card.params && card.params.amt) || 1;
    player.spread = Math.min(6, player.spread + amt);
  },
  bullet_speed_pct: function(card){
    const pct = (card.params && card.params.pct) || 0.12;
    player.passives.bulletSpeed = (player.passives.bulletSpeed || 1) * (1 + pct);
  },
  xp_boost_pct: function(card){
    const pct = (card.params && card.params.pct) || 0.30;
    player.passives.xpBoost = (player.passives.xpBoost || 0) + pct;
  },

  // R
  split_on_hit: function(card){
    player.passives.splitOnHit = true;
    player.passives.splitChance = Math.min(0.45, (card.params && card.params.chance) || 0.28);
    player.passives.splitShards = Math.min(8, (card.params && card.params.shards) || 3);
  },
  explode_on_hit: function(card){
    player.passives.explodeChance = (player.passives.explodeChance || 0) + ((card.params && card.params.chance) || 0.12);
    player.passives.explodeDmgMul = (player.passives.explodeDmgMul || 1) * ((card.params && card.params.dmgMul) || 1);
    player.passives.explodeRadius = Math.max(player.passives.explodeRadius || 32, (card.params && card.params.radius) || 36);
  },
  homing_on_hit: function(card){
    player.passives.homing = (player.passives.homing || 0) + ((card.params && card.params.power) || 0.45);
  },
  kill_scatter: function(card){
    player.passives.killScatter = (player.passives.killScatter || 0) + ((card.params && card.params.shards) || 6);
  },
  leech_pct: function(card){
    player.passives.leech = (player.passives.leech || 0) + ((card.params && card.params.pct) || 0.06);
  },
  slow_on_hit: function(card){
    player.passives.slow = (player.passives.slow || 0) + ((card.params && card.params.chance) || 0.30);
  },
  xp_up_pct: function(card){
    player.passives.xpBoost = (player.passives.xpBoost || 0) + ((card.params && card.params.pct) || 0.15);
  },
  double_shot: function(card){
    player.passives.doubleShot = (player.passives.doubleShot || 0) + ((card.params && card.params.chance) || 0.5);
  },
  pierce_big: function(card){ player.pierce = Math.min(10, player.pierce + ((card.params && card.params.amt) || 2)); },
  spread_big: function(card){ player.spread = Math.min(6, player.spread + ((card.params && card.params.amt) || 2)); },

  // SR
  explode10: function(card){
    player.passives.explodeChance = (player.passives.explodeChance || 0) + ((card.params && card.params.chance) || 0.30);
    player.passives.explodeRadius = Math.max(player.passives.explodeRadius || 48, (card.params && card.params.radius) || 48);
    player.passives.explodeDmgMul = (player.passives.explodeDmgMul || 1) * ((card.params && card.params.dmgMul) || 1.1);
  },
  xp_double_chance: function(card){
    player.passives.xpDouble = Math.max(player.passives.xpDouble || 0, (card.params && card.params.chance) || 0.25);
  },
  area_pulse: function(card){
    player.passives.areaPulse = player.passives.areaPulse || [];
    player.passives.areaPulse.push({ interval: (card.params && card.params.interval) || 4000, dmg: (card.params && card.params.dmg) || 60, timer:0 });
  },
  high_risk_high_reward: function(card){
    const sm = (card.params && card.params.shieldMul) || 0.7;
    const am = (card.params && card.params.atkMul) || 1.6;
    player.shieldMax = Math.max(200, Math.floor(player.shieldMax * sm));
    player.shield = Math.min(player.shield, player.shieldMax);
    player.damagePerShot = Math.max(1, Math.ceil(player.damagePerShot * am));
  },
  random_buff: function(card){
    player.passives.randomBuff = (player.passives.randomBuff || 0) + ((card.params && card.params.chance) || 0.18);
    player.passives.randomBuffDur = Math.max(player.passives.randomBuffDur || 0, (card.params && card.params.buffDur) || 2500);
    player.passives.randomBuffAtkMul = Math.max(player.passives.randomBuffAtkMul || 1.5, (card.params && card.params.atkMul) || 1.5);
  },

  // SSR
  all_dir_shot: function(card){
    // immediate effect + passive marker (one-shot immediate handled here)
    const burst = (card.params && card.params.burst) || 12;
    const dmgMul = (card.params && card.params.dmgMul) || 0.8;
    executeAllDirBurst(burst, dmgMul);
  },
  xp_gain_double: function(card){
    player.passives.xpGlobalMul = (player.passives.xpGlobalMul || 1) * ((card.params && card.params.mul) || 2);
  }
};

/* ----------------------------
   実行ヘルパー: 全方位バースト (SSR)
   - global caps を見て弾を生成する
   ---------------------------- */
function executeAllDirBurst(count, dmgMul){
  const dmg = Math.max(1, Math.floor(player.damagePerShot * (dmgMul || 1)));
  const spawnCount = Math.min(24, count);
  for(let i=0;i<spawnCount;i++){
    if(bullets.length + enemyBullets.length >= SPLIT_GLOBAL_LIMIT) break;
    const ang = (Math.PI*2) * (i / spawnCount);
    const speed = randRange(220,520);
    spawnBullet({ x:player.x, y:player.y - 10, vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed, damage: dmg, pierce:0, gen:1, radius:4 });
  }
}

/* ----------------------------
   applyCardToPlayer(card, options)
   - card: template or instance object
   - options: { persistent: boolean } -> if true, add to save.ownedCards and persist
   - returns { applied:true/false, message? }
   ---------------------------- */
function applyCardToPlayer(card, options = { persistent:false }){
  if(!card || !card.effectKey) return { applied:false, message:'カード不正' };
  try {
    // If card is an instance from save it may already have params; else template
    const handler = CARD_EFFECTS[card.effectKey];
    if(typeof handler === 'function'){
      handler(card);
    } else {
      // fallback: small safe handling
      if(card.params && card.params.pct) player.damagePerShot = Math.max(1, Math.ceil(player.damagePerShot * (1 + card.params.pct)));
      else if(card.params && card.params.amt) player.shieldMax += card.params.amt;
      else {
        debugLog('No handler for', card.effectKey);
      }
    }
    // If persistent requested and allowed by template, add to save
    if(options.persistent){
      // make instance object minimal for saving
      const inst = {
        id: `${card.id}_${Date.now()}`,
        baseId: card.baseId || card.id,
        rarity: card.rarity || 'N',
        label: card.name || card.label || card.id,
        desc: card.desc || '',
        effectKey: card.effectKey,
        params: Object.assign({}, card.params || {})
      };
      save.ownedCards.push(inst);
      persistSave();
    }
    updateUI();
    effects.push({ type:'apply', x:player.x, y:player.y - 24, ttl:900, maxTtl:900, desc: `${card.rarity} ${card.name || card.label}` });
    return { applied:true };
  } catch(err){
    console.error('applyCardToPlayer error', err);
    return { applied:false, message: String(err) };
  }
}

/* ----------------------------
   Gacha 実装: performGacha()
   - uses save.cardPools counts and RARITY_PROBS weights
   - decrements pool counts for chosen rarity
   - returns instance that was added to save.ownedCards (or null)
   ---------------------------- */
function performGacha(){
  if(!save.cardPools) save.cardPools = { N:40, R:10, SR:5, SSR:2 };
  // build available rarities (with prob)
  const available = RARITY_PROBS.filter(r => (save.cardPools[r.key] || 0) > 0);
  if(available.length === 0){
    // pool exhausted: fallback to N if still any N templates exist
    if((save.cardPools.N || 0) <= 0) return null;
    available.push({key:'N',prob:0.7});
  }
  // normalize probabilities across available
  const total = available.reduce((s,a)=>s+a.prob,0);
  let p = Math.random()*total;
  let chosenKey = available[available.length-1].key;
  for(const a of available){
    if(p < a.prob){ chosenKey = a.key; break; }
    p -= a.prob;
  }
  // pick a random template from CARD_LIBRARY[chosenKey]
  const list = CARD_LIBRARY[chosenKey];
  if(!list || list.length === 0){
    console.warn('No templates for chosen rarity', chosenKey);
    return null;
  }
  const templ = list[Math.floor(Math.random()*list.length)];
  // create instance and append to save
  const instance = {
    id: `${templ.id}_${Date.now()}`,
    baseId: templ.id,
    rarity: templ.rarity,
    label: templ.name,
    desc: templ.desc,
    effectKey: templ.effectKey,
    params: Object.assign({}, templ.params)
  };
  save.ownedCards.push(instance);
  save.cardPools[chosenKey] = Math.max(0, (save.cardPools[chosenKey] || 0) - 1);
  persistSave();
  debugLog('Gacha got', instance.id, 'pool left', save.cardPools);
  return instance;
}

/* ----------------------------
   weightedRaritySample: helper that returns 'N'/'R'/'SR'/'SSR' by base probabilities
   ---------------------------- */
function weightedRaritySample(){
  let total = RARITY_PROBS.reduce((s,a)=>s+a.prob,0);
  let p = Math.random() * total;
  for(const r of RARITY_PROBS){
    if(p < r.prob) return r.key;
    p -= r.prob;
  }
  return RARITY_PROBS[RARITY_PROBS.length-1].key;
}

/* ----------------------------
   Helper: pickCandidatesForChoices(num)
   - returns an array of card-like objects for display (does NOT modify save)
   - ensures names/descriptions are present (fixes 'n-1' ambiguity)
   ---------------------------- */
function pickCandidatesForChoices(num){
  const results = [];
  const owned = shuffle(save.ownedCards || []);
  for(let i=0;i<owned.length && results.length < num;i++){
    const c = owned[i];
    results.push({ id:c.id, baseId:c.baseId, rarity:c.rarity, name:c.label || c.name || c.id, desc:c.desc || '', effectKey:c.effectKey, params:c.params });
  }
  let attempts = 0;
  while(results.length < num && attempts < 200){
    attempts++;
    const r = weightedRaritySample();
    const list = CARD_LIBRARY[r];
    if(!list || list.length === 0) continue;
    const templ = list[Math.floor(Math.random()*list.length)];
    if(!results.some(x => x.baseId === templ.id)) results.push({ id:templ.id, baseId:templ.id, rarity:templ.rarity, name:templ.name, desc:templ.desc, effectKey:templ.effectKey, params:templ.params });
  }
  // fallback safe items
  while(results.length < num){
    results.push({ id:`fallback_${Date.now()}_${results.length}`, rarity:'N', name:'基礎攻撃+10%', desc:'仮効果：攻撃が+10%', effectKey:'atk_pct', params:{pct:0.10} });
  }
  return results;
}

/* ----------------------------
   split bullet safety improvements (hook into existing collision code)
   - Part1's collision uses b.meta.allowSplit and splitChance; we enforce generation and global caps here
   - Already handled in Part1; keep this function as documentation and utility
   ---------------------------- */
function safeSpawnSplitFragments(originX, originY, baseDamage, shards){
  const spawnCount = Math.min(shards, 8);
  if(bullets.length + enemyBullets.length + spawnCount > SPLIT_GLOBAL_LIMIT) return;
  for(let i=0;i<spawnCount;i++){
    const ang = randRange(-Math.PI*0.8, -Math.PI*0.2);
    const vx = Math.cos(ang) * randRange(30,200);
    const vy = Math.sin(ang) * randRange(260,520);
    spawnBullet({ x: originX, y: originY, vx, vy, damage: Math.max(1, Math.floor(baseDamage * 0.45)), pierce:0, gen:1, radius:3, meta:{} });
  }
}

/* ----------------------------
   Utility: weighted sample that respects pool availability, used for preview sampling (does NOT consume pool)
   ---------------------------- */
function sampleRarityRespectPool(){
  const pool = save.cardPools || { N:40, R:10, SR:5, SSR:2 };
  const avail = RARITY_PROBS.filter(r => (pool[r.key] || 0) > 0);
  if(avail.length === 0) return 'N';
  let total = avail.reduce((s,a) => s + a.prob, 0);
  let p = Math.random() * total;
  for(const a of avail){
    if(p < a.prob) return a.key;
    p -= a.prob;
  }
  return avail[avail.length-1].key;
}

function isValidCardObject(cardObj){

function findTemplateByBaseId(baseId){
  if(!baseId) return null;
  for(const r of ['N','R','SR','SSR']){
    const list = CARD_LIBRARY[r] || [];
    for(const t of list){
      if(t.id === baseId || t.baseId === baseId) return t;
    }
  }
  return null;
}

function getRandomTemplate(preferRarity='N'){
  const list = (CARD_LIBRARY[preferRarity] && CARD_LIBRARY[preferRarity].length) ? CARD_LIBRARY[preferRarity] : null;
  if(list && list.length) return list[Math.floor(Math.random()*list.length)];
  // fallback to any
  const all = [].concat(CARD_LIBRARY.N||[], CARD_LIBRARY.R||[], CARD_LIBRARY.SR||[], CARD_LIBRARY.SSR||[]);

}

          baseId: templ.id,
          rarity: templ.rarity || (templ.rarity || 'N'),
          label: templ.name || templ.label || `(${templ.rarity||'N'}) ${templ.id}`,
          desc: templ.desc || '',
          effectKey: templ.effectKey || templ.effect || 'atk_pct',
          params: Object.assign({}, templ.params || {}),
        };
        save.ownedCards[i] = newInst;
        repair.new = newInst;
        repair.reason = '補填: baseId に対応するテンプレートが存在したためテンプレートで上書き';
        result.repairs.push(repair);
        result.changed = true;
        continue;
      }
    }

    // Attempt 2: if label exists but effectKey missing, try to infer from label text (heuristic)
    if(c && c.label && typeof c.label === 'string'){
      const label = c.label.toLowerCase();
      let inferred = null;
      if(label.includes('攻') || label.includes('atk') || label.includes('attack')) inferred = getRandomTemplate('N');
      if(inferred){
        const newInst = {
          id: c.id || `${inferred.id}_${Date.now()}`,
          baseId: inferred.id,
          rarity: inferred.rarity || 'N',
          label: c.label || inferred.name,
          desc: c.desc || inferred.desc,
          effectKey: inferred.effectKey,
          params: Object.assign({}, inferred.params || {})
        };
        save.ownedCards[i] = newInst;
        repair.new = newInst;
        repair.reason = '推測補填: label から推測して N テンプレで置換';
        result.repairs.push(repair);
        result.changed = true;
        continue;
      }
    }

    // Attempt 3: full fallback — ランダムな N テンプレートを割り当てる
    const fallback = getRandomTemplate('N');
    if(fallback){
      const newInst = {
        id: c && c.id ? c.id : `${fallback.id}_${Date.now()}`,
        baseId: fallback.id,
        rarity: fallback.rarity || 'N',
        label: fallback.name || `初期N-${i+1}`,
        desc: fallback.desc || '初期補填カード',
        effectKey: fallback.effectKey || 'atk_pct',
        params: Object.assign({}, fallback.params || {})
      };
      save.ownedCards[i] = newInst;
      repair.new = newInst;
      repair.reason = '完全補填: 不正/欠損カードのためランダムNテンプレで置換';
      result.repairs.push(repair);
      result.changed = true;
      continue;
    }

    // If all fails (unexpected), remove the element to avoid UI issues
    save.ownedCards.splice(i,1);
    repair.new = null;
    repair.reason = '削除: 補填不可のため所持リストから除去';
    result.repairs.push(repair);
    result.changed = true;
    i--; // adjust index due to splice
  } // end for

  return result;
}

/* -------------------------
   初期所持カードが空／不十分な場合に N プールから適切に 10 枚配布する関数
   - save.ownedCards が 10 未満のときに実行（ユーザーの既存所持を壊さない）
   - 振る舞い: 重複しないように baseId を選び、インスタンスとして保存
   ------------------------- */
function ensureInitialOwnedCards(desiredCount = 10){
  if(!save) return { changed:false, added:0 };
  if(!Array.isArray(save.ownedCards)) save.ownedCards = [];
  const addedCards = [];
  const existingBaseIds = new Set((save.ownedCards||[]).map(c => c.baseId || c.id));
  const avail = (CARD_LIBRARY.N || []).slice(); // shallow copy
  // shuffle available templates
  for(let i=avail.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [avail[i], avail[j]] = [avail[j], avail[i]];
  }
  let idx = 0;
  while(save.ownedCards.length < desiredCount && idx < avail.length){
    const templ = avail[idx++];
    if(existingBaseIds.has(templ.id)) continue;
    const inst = {
      id: `${templ.id}_${Date.now()}_${Math.floor(Math.random()*1000)}`,
      baseId: templ.id,
      rarity: templ.rarity || 'N',
      label: templ.name || templ.label || `初期N-${templ.id}`,
      desc: templ.desc || '',
      effectKey: templ.effectKey || 'atk_pct',
      params: Object.assign({}, templ.params || {})
    };
    save.ownedCards.push(inst);
    existingBaseIds.add(templ.id);
    addedCards.push(inst);
  }
  // If not enough templates (very unlikely), fill by cloning any template already added (to reach count)
  while(save.ownedCards.length < desiredCount){
    const templ = CARD_LIBRARY.N && CARD_LIBRARY.N[0] ? CARD_LIBRARY.N[0] : getRandomTemplate('N');
    const inst = {
      id: `${templ.id}_${Date.now()}_${Math.floor(Math.random()*1000)}`,
      baseId: templ.id,
      rarity: templ.rarity || 'N',
      label: templ.name || templ.label || '初期N-補填',
      desc: templ.desc || '',
      effectKey: templ.effectKey || 'atk_pct',
      params: Object.assign({}, templ.params || {})
    };
    save.ownedCards.push(inst);
    addedCards.push(inst);
  }
  return { changed: addedCards.length > 0, added: addedCards.length, addedCards };
}

/* -------------------------
   所持カードのラベル欠損・省略ラベル（例: "n-1"）を検出するユーティリティ
   - 単純ヒューリスティック: label に 'n-' もしくは /^n[_\-]?(\d+)/i のような表記があれば「省略可能ラベル」と見なす
   ------------------------- */
function isPlaceholderLabel(label){
  if(!label || typeof label !== 'string') return true;
  const low = label.toLowerCase();
  if(low.startsWith('n-') || low.startsWith('n_') || /^n\d+$/i.test(low) || /^n[_\-]?\d+/i.test(low)) return true;
  if(label.trim().length < 3) return true; // too short to be meaningful
  return false;
}

/* -------------------------
   pickCandidatesForChoices の補強ラッパー
   - 既存の pickCandidatesForChoices があるなら上書きしないが、表示の際に label/desc がなければ修復版を使う
   - ここでは新たに safePickCandidatesForChoices を定義し、openLevelUpChoices から使われるように上書きも可能
   ------------------------- */
function safePickCandidatesForChoices(num){
  // prefer using existing function if it exists and seems robust
  if(typeof window.pickCandidatesForChoices === 'function'){
    try {
      const raw = window.pickCandidatesForChoices(num);
      // validate and if any candidate missing label/desc/effectKey, replace via our function
      const repaired = [];
      let needsFix = false;
      for(const c of raw){
        if(c && c.label && c.effectKey) repaired.push(c);
        else {
          needsFix = true; break;
        }
      }
      if(!needsFix) return raw;
      // else fallthrough to our generation below
    } catch(e){
      p3log('existing pickCandidatesForChoices threw — fallback');
    }
  }

  // Build candidates using owned cards first (ensuring labels)
  const results = [];
  const owned = shuffle(save.ownedCards || []);
  for(let i=0;i<owned.length && results.length < num;i++){
    const c = owned[i];
    if(!c) continue;
    // ensure label & desc & effectKey exist; if not, try to repair with template
    let card = c;
    let repaired = false;
    if(!c.label || isPlaceholderLabel(c.label) || !c.effectKey){
      const templ = findTemplateByBaseId(c.baseId) || getRandomTemplate('N');
      card = Object.assign({}, templ, {
        id: c.id || templ.id,
        baseId: templ.id,
        rarity: templ.rarity,
        label: c.label && !isPlaceholderLabel(c.label) ? c.label : (templ.name || templ.id),
        desc: c.desc || templ.desc || '',
        effectKey: c.effectKey || templ.effectKey,
        params: c.params || templ.params
      });
      repaired = true;
    }
    results.push(card);
    if(repaired){
      // write back repaired instance to save (so future loads are correct)
      save.ownedCards[i] = {
        id: card.id,
        baseId: card.baseId,
        rarity: card.rarity,
        label: card.label,
        desc: card.desc,
        effectKey: card.effectKey,
        params: Object.assign({}, card.params || {})
      };
    }
  }

  // fill from templates if insufficient
  let attempts = 0;
  while(results.length < num && attempts < 200){
    attempts++;
    const templ = getRandomTemplate('N');
    if(!templ) break;
    if(!results.some(r => r.baseId === templ.id)) results.push(Object.assign({}, templ));
  }

  // final fallback safe items
  while(results.length < num){
    results.push({ id:`fallback_${Date.now()}`, baseId:'N_fallback_01', rarity:'N', name:'基礎攻撃+10%', desc:'仮効果: 攻撃+10%', effectKey:'atk_pct', params:{pct:0.10} });
  }

  // persist repairs if any
  persistSave();
  return results;
}

/* -------------------------
   openLevelUpChoices の安全上書き（存在する実装を無理に壊さない形で補強）
   - もし既に openLevelUpChoices が定義されていれば、それをラップして safePickCandidatesForChoices を使うようにする
   - 存在しない場合は新規に定義
   ------------------------- */
(function installSafeOpenLevelUpChoices(){

  window.openLevelUpChoices = function(num, opts = {}){
    // Use safe pick for candidate generation
    const displayCount = (save && save.choiceSlots) ? save.choiceSlots : (num || 3);
    const candidates = safePickCandidatesForChoices(displayCount);

    // Many earlier implementations built their own UI — here we prefer to use our deterministic UI to ensure labels visible.
    // Pause game
    state.running = false;

      panel.appendChild(title);

        el.addEventListener('click', ()=>{

})();

/* -------------------------
   saveロード時に自動修復を行うエントリポイント
   - ゲーム起動時（Part1 の boot に続けて）呼ぶことを想定
   - 実施項目:
     1) save.ownedCards 配列を検査→ fixOwnedCards()
     2) 所持数が少ない場合 → ensureInitialOwnedCards(10)
     3) 修復ログを overlay またはコンソールに出す（ユーザーがわかるように）
     4) persistSave() を行う（修復があった場合のみ）
   ------------------------- */
function repairSaveOwnedCardsIfNeeded(){
  if(!save) { p3log('save undefined in repairSaveOwnedCardsIfNeeded'); return; }
  let anyChanges = false;
  const repairs = [];

  // 1) 修復
  const fixResult = fixOwnedCards();
  if(fixResult.changed){
    anyChanges = true;
    repairs.push(...fixResult.repairs);
  }

  // 2) 初期所持補填（10枚）
  if(!Array.isArray(save.ownedCards) || save.ownedCards.length < 10){
    const ensure = ensureInitialOwnedCards(10);
    if(ensure && ensure.changed){
      anyChanges = true;
      repairs.push({ addedCount: ensure.added, addedCards: ensure.addedCards, reason: '初期所持カードを10枚に補填' });
    }
  } else {
    p3log('ownedCards count ok:', save.ownedCards.length);
  }

  // 3) ラベルが placeholder の場合は補填・上書きして persist
  let placeholderFixes = 0;
  for(let i=0;i<save.ownedCards.length;i++){
    const c = save.ownedCards[i];
    if(!c) continue;
    if(isPlaceholderLabel(c.label) || !c.label){
      const templ = findTemplateByBaseId(c.baseId) || getRandomTemplate('N');
      const newLabel = templ ? (templ.name || templ.id) : `初期N-${i+1}`;
      save.ownedCards[i].label = newLabel;
      if(!save.ownedCards[i].desc) save.ownedCards[i].desc = (templ && templ.desc) || '説明なし';
      placeholderFixes++;
    }
    if(!save.ownedCards[i].effectKey){
      const templ = findTemplateByBaseId(c.baseId) || getRandomTemplate('N');
      save.ownedCards[i].effectKey = templ ? templ.effectKey : 'atk_pct';
      save.ownedCards[i].params = save.ownedCards[i].params || (templ ? Object.assign({}, templ.params || {}) : {pct:0.1});
      placeholderFixes++;
    }
  }
  if(placeholderFixes > 0) anyChanges = true;

  // 4) persist if changed
  if(anyChanges){
    try {
      persistSave();
      p3log('save repaired and persisted. repairs:', repairs);
      // show summary overlay so user knows that repair happened (non-blocking)
      openOverlay('repairSummary', (panel) => {
        const title = document.createElement('div'); title.style.fontWeight='900'; title.textContent = '所持カードの補修を行いました';
        panel.appendChild(title);
        const body = document.createElement('div'); body.className='small'; body.style.marginTop='8px';
        let msg = `補修箇所: ${repairs.length} 件。所持カード数: ${save.ownedCards.length}。`;
        body.textContent = msg;
        panel.appendChild(body);
        const list = document.createElement('div'); list.className='cardList'; list.style.marginTop='8px';
        // show first up to 8 added/fixed cards for user visibility
        let shown = 0;
        for(const r of repairs){
          if(shown >= 8) break;
          const el = document.createElement('div'); el.className='card';
          if(r.addedCards && r.addedCards.length){
            el.innerHTML = `<div style="font-weight:800">追加: ${r.addedCards.length} 枚</div><div class="small">${(r.addedCards[0] && r.addedCards[0].label) || ''} ...</div>`;
          } else if(r.new && r.old){
            const newLabel = r.new.label || r.new.name || r.new.id;
            el.innerHTML = `<div style="font-weight:800">修復: index ${r.index}</div><div class="small">${newLabel}<br><span style="opacity:0.8">${r.reason}</span></div>`;
          } else {
            el.innerHTML = `<div style="font-weight:800">補修情報</div><div class="small">${r.reason || JSON.stringify(r).slice(0,60)}</div>`;
          }
          list.appendChild(el);
          shown++;
        }
        panel.appendChild(list);
        const ok = document.createElement('div'); ok.className='btn'; ok.style.marginTop='10px'; ok.textContent='閉じる';
        ok.onclick = () => { closeOverlay(); };
        panel.appendChild(ok);
      });
    } catch(e){
      console.error('persistSave failed after repair', e);
    }
  } else {
    p3log('no repairs necessary for ownedCards');
  }
}

/* -------------------------
   pickCandidatesForChoices を安全実装に置き換える（存在する場合は参照整備のみ）
   - 既に Part2 等で pickCandidatesForChoices が定義されている場合は、そこにラベル/desc補填を行うラッパーを当てる
   ------------------------- */
(function patchPickCandidates(){
  const orig = window.pickCandidatesForChoices;
  window.pickCandidatesForChoices = function(num){
    // Call orig if exists
    if(typeof orig === 'function'){
      try {
        const out = orig(num);
        // ensure all items have label/desc/effectKey and fix in save if needed
        let modified = false;
        for(let i=0;i<out.length;i++){
          const c = out[i];
          if(!c) continue;
          if(!c.label || isPlaceholderLabel(c.label) || !c.effectKey){
            // try to repair via baseId/template
            const templ = findTemplateByBaseId(c.baseId) || getRandomTemplate('N');
            const fixed = Object.assign({}, templ, { id: c.id || templ.id, baseId: templ.id, label: c.label && !isPlaceholderLabel(c.label) ? c.label : (templ.name||templ.id), desc: c.desc || templ.desc || '', effectKey: c.effectKey || templ.effectKey, params: c.params || templ.params });
            out[i] = fixed;
            modified = true;
          }
        }
        if(modified) persistSave();
        return out;
      } catch(e){
        p3log('orig pickCandidatesForChoices threw — fallback to safePickCandidatesForChoices', e);
        return safePickCandidatesForChoices(num);
      }
    }
    // else fallback
    return safePickCandidatesForChoices(num);
  };
})();

/* -------------------------
   起動直後に修復処理を実行する（ただし既に一度実行済みの場合は無視）
   - 二重実行防止フラグを window._part3_repaired_flag に置く
   ------------------------- */
if(!window._part3_repaired_flag){
  window._part3_repaired_flag = true;
  try {
    repairSaveOwnedCardsIfNeeded();
  } catch(e){
    console.error('Part3: repair failed', e);
  }
} else {
  p3log('Part3: repair already performed previously in this session');
}

/* -------------------------
   デバッグ/検証用公開関数

   ------------------------- */
window.part3Revalidate = function(){

    showMessage('所持カードリストを補修しました（Manual）', ()=>{});
  } else {
    p3log('revalidation no changes');
    showMessage('所持カードは問題ありません（Manual）', ()=>{});
  }
};

     * save.ownedCards の各要素は必須フィールド (id, baseId, rarity, label, desc, effectKey, params) を持つ
     * 不足分は CARD_LIBRARY から補填し、ユーザーに補填のサマリを表示

     * pickCandidatesForChoices / openLevelUpChoices を使う箇所は label/desc を必ず表示できる
   - 想定される次の手順:
     1) この Part3 を Part1+Part2 の後に挿入して動作確認
     2) プレイヤーが初回起動時にどのカードを得たかを確認（修復サマリが出る）
     3) その後のガチャ動作、レベルアップ選択（表示・適用）が正しいことを確認
   - 何か追加で「このラベルは特定の言葉にしてほしい」「初期10枚は固定配布（ランダムではない）にしてほしい」等の要望があれば
     次の修正版で反映します。
*/
</script>
<script>
/*
  Part4 — 戦闘挙動安定化パッチ
  - 目的:
    1. シールドを「プレイヤー上方ドーム（青いバリア）」として可視化＆当たり判定を導入
    2. プレイヤーの上下移動を完全に無効化（左右のみ）
    3. ウェーブ管理を修正して Wave1→Wave2→...→Wave5（最終ボス）へ確実に遷移
    4. シールドヒット時のエフェクトを追加
    5. 既存コード（Part1〜3）を壊さないように、関数を上書き/補強する
  - 使い方:
    この <script> ブロックを Part1〜3 の後に貼り付けてください。
    既に定義済みの変数（player, session, enemies, bullets, enemyBullets, effects, spawnBullet, spawnEnemy, spawnBoss,
    persistSave, openOverlay, closeOverlay, giveXP, onGameEnd, updateUI, roundRect, randRange 等）を拡張して使います。
  - 注意:
    大幅な上書きを行うので、念のためブラウザのコンソールでエラーが出たら教えてください。
*/

/* -----------------------------
   IIFE で隔離してパッチを適用
   ----------------------------- */
(function(){
  // safety: ensure required globals exist
  if(typeof window.player === 'undefined') {
    console.warn('Part4: player undefined — ensure Part1 loaded first.');
  }
  if(typeof window.session === 'undefined') {

  }

  // --- 新規/上書き設定値 ---
  session.maxWave = 5; // 明示的に5ウェーブ構成

  session.spawnTimer = session.spawnTimer || 0;
  session.spawnedCount = session.spawnedCount || 0;
  session.nextWaveTimer = session.nextWaveTimer || 0;

  // shield dome settings (tweakable)
  const SHIELD = {
    enabled: true,          // whether the concept exists
    colorFill: 'rgba(100,180,255,0.22)',
    colorStroke: 'rgba(80,150,220,0.9)',
    radiusFactor: 2.1,      // multiply player.r to get dome radius (player.r * radiusFactor)
    hitParticleCount: 12,   // particle count on hit
    hitFlashTtl: 220       // flash duration ms
  };

  // wave configurations (waves 1..4 normal, wave5 = boss)
  const NEW_WAVES = {

  };

  // transition delay between waves (ms)

  // fixed Y for player (no vertical movement allowed)
  const PLAYER_FIXED_Y = Math.floor((ui && ui.canvas ? ui.canvas.height : 640) - 80);

  /* -----------------------------
     Helper: compute shield radius
     ----------------------------- */
  function getShieldRadius(){
    if(!player) return 0;
    return Math.max(48, Math.floor(player.r * (SHIELD.radiusFactor || 2.1)));
  }

  /* -----------------------------
     Shield effect: push a blue flash & particles
     - pos: {x,y}

     ----------------------------- */
  function pushShieldHitEffect(pos, amt){

      type: 'shieldFlash',
