      }
    } catch(e){ console.warn('[Part3] orig performGacha threw', e); }
    // fallback robust implementation
    try {
      // sample rarity respecting pools
      const probs = [{key:'SSR',prob:0.02},{key:'SR',prob:0.08},{key:'R',prob:0.20},{key:'N',prob:0.70}];
      const available = probs.filter(p => (save.cardPools[p.key] || 0) > 0);
      if(available.length === 0) available.push({key:'N', prob:1});
      const total = available.reduce((s,a)=>s+a.prob,0);
      let r = Math.random() * total;
      let chosen = available[available.length-1].key;
      for(const a of available){
        if(r < a.prob){ chosen = a.key; break; }
        r -= a.prob;
      }
      const lib = (w.CARD_LIBRARY && CARD_LIBRARY[chosen]) ? CARD_LIBRARY[chosen] : (w.CARD_LIBRARY && CARD_LIBRARY.N ? CARD_LIBRARY.N : []);

  /*** ---- XP & Kill reward trustworthiness ---- ***/

  const origGiveXP = typeof giveXP === 'function' ? giveXP : null;

      // call original if present (preferred)

      // fallback simple XP awarding

  // Wrap onEnemyDefeated to call giveXP (idempotent)

  /*** ---- Joystick Anywhere improvement (robust) ----***/
  (function installGlobalJoystick(){

      // create synthetic pointerdown event targeted at base to reuse existing stick handlers

      try { base.dispatchEvent(evt); active.pointerId = e.pointerId || 9999; } catch(err){ console.warn('[Part3] dispatch to base failed', err); }

      const mults = [1,2,4,8,16,32,64,128,256,512,1024,2048,4096,8196,16392,39000];

  /*** ---- UI: rarity colorization for lists and detail view ----***/
  // Patch openCardDetailPanel to inject colored badge if exists, otherwise create
  if(typeof openCardDetailPanel === 'function'){

<!-- Part4 — 大幅安定化 & 波進行 / オーバーレイ改善パッチ（詳細版）
  目的（要点）
   - ウェーブ進行が途中で止まる問題を根本解決する（Wave clear -> 次Wave へ確実に遷移）
   - ウェーブクリア報酬（レベルアップ選択）の表示と「スキップ」動作が確実に動くようにする
     （以前の実装では overlay がゲームの update を止め、タイマーが進まず進行不能になるケースがあった）
   - オーバーレイは「表示中でもゲームループは動き続ける」設計に変更して、進行管理を UI に依存させない
   - シールド／ドームの衝突や演出を堅牢化（複数のエッジケース対応）
   - 既存の関数（startWave, handleSpawn, startPlay, openLevelUpChoices 等）を潰さない形でラップ／補強
   - きめ細かなエラーハンドリングとログを追加（デバッグ時に役立つ）
  使い方
   - Part1〜Part3 を読み込んだ後、このスクリプトを貼り付けてください。
   - 既存の関数がある場合は「上書き」ではなく「ラップ」して拡張しているため、後続パッチとも互換性を保ちます。
  注意
   - 既存グローバル（player, enemies, bullets, enemyBullets, effects, session, state, ui, save 等）を参照します。
   - 万が一エラーが出たらコンソールのログを教えてください。
*/

<script>
(function Part4Patch(){
  'use strict';

  const debug = !!(window.state && window.state.debug);
  const log = (...args) => { if(debug) console.log('[Part4]', ...args); };

  // Safety: ensure minimal globals exist
  window.session = window.session || {};
  window.state = window.state || { screen:'stage', running:false, overlayMode:null, overlayBusy:false, debug: false };

  ui.overlay = ui.overlay || document.getElementById('overlay');
  ui.overlayPanel = ui.overlayPanel || document.getElementById('overlayPanel');

  const SHIELD_DOME = {
    enabled: true,
    radiusFactor: 2.1,
    colorFill: 'rgba(100,180,255,0.20)',
    colorStroke: 'rgba(80,150,220,0.9)',
    hitParticles: 12,
    hitFlashTtl: 220
  };

  // new waves table (keeps compatibility with earlier NEW_WAVES, but extendable)
  const NEW_WAVES = (function buildWaves(){
    // default waves 1..5 (5th wave boss). Upstream code may have stage multipliers for stage selection
    return {
      1: { count:6, hp:100, speed:22, spawnInterval:900 },
      2: { count:8, hp:150, speed:26, spawnInterval:820 },
      3: { count:10, hp:220, speed:30, spawnInterval:780 },
      4: { count:12, hp:320, speed:34, spawnInterval:740 },

  // Spawn handler (robust)

    // prefer patched NEW_WAVES based behavior

          session.waveState = 'active';
        }
        return;
      }
      // Normal waves: spawn based on interval
      session.spawnTimer = (session.spawnTimer || 0) + dt;

        session.spawnedCount = (session.spawnedCount || 0) + 1;

      console.error('[Part4] handleSpawn error', e);
      try { if(origHandleSpawn) origHandleSpawn(dt); } catch(_){}

  // --------------------
  // Wave lifecycle: startWave, startPlay wrappers

  window.startWave = function(w){

      try { origStartWave(session.wave); } catch(e){ log('origStartWave threw', e); }

  if(typeof window.startPlay === 'function'){

      state.running = true;

    };
  }

  // --------------------
  // Wave transition handler (works even if overlay is open)
  // --------------------
  function handleWaveTransitions(dt){
    try {
      if(session.waveState !== 'cleared') return;
      session.nextWaveTimer = session.nextWaveTimer || WAVE_TRANSITION_DELAY;
      session.nextWaveTimer -= dt;
      if(session.nextWaveTimer <= 0){
        // if there are more waves, proceed; otherwise finish run
        const maxW = session.maxWave || DEFAULT_MAX_WAVE;
        if(session.wave < maxW){
          session.wave = session.wave + 1;
          startWave(session.wave);
          state.running = true; // ensure loop continues
        } else {
          // final cleared -> end
          try { onGameEnd && onGameEnd(true); } catch(e){ log('onGameEnd failed', e); }
        }
      }
    } catch(e){
      console.error('[Part4] handleWaveTransitions error', e);
    }
  }

  // --------------------
  // Overlay / Level-up improvement
  // --------------------
  // Problems fixed:
  //  - previously overlay opened and set state.running=false => update stopped and nextWaveTimer did not progress
  //  - skip button sometimes unresponsive because overlayBusy or reentrancy issues
  // Design:

  //  - overlayBusy is used only to prevent concurrent overlay opens; skip button will reliably close overlay and resume inputs.
  //  - All overlay builders use openOverlaySafe which ensures consistent behavior and non-blocking UX.
  const origOpenOverlay = typeof openOverlay === 'function' ? openOverlay : null;
  function openOverlaySafe(mode, builder){

    if(state.overlayBusy) {
      log('openOverlaySafe: overlayBusy, ignoring open for', mode);
      return;
    }

    state.overlayMode = mode;

      if(typeof origOpenOverlay === 'function'){
        // But intercept builder to guarantee close behavior and ensure overlayBusy toggling
        origOpenOverlay(mode, (panel) => {
          try {
            builder(panel);
          } catch(e){
            console.error('[Part4] openOverlaySafe builder error', e);
            panel.innerHTML = `<div style="font-weight:900">エラー</div><div class="small">${String(e)}</div><div style="margin-top:8px" class="btn" id="overlayCloseBtn">閉じる</div>`;
            const btn = document.getElementById('overlayCloseBtn');
            if(btn) btn.onclick = () => closeOverlaySafe();
          } finally {
            state.overlayBusy = false; // allow subsequent overlays
          }
        });
        return;
      }
      // Fallback: build overlay DOM manually
      if(!ui.overlay || !ui.overlayPanel) { console.warn('[Part4] openOverlaySafe fallback: overlay DOM not found'); state.overlayBusy = false; return; }
      ui.overlay.style.display = 'flex';
      ui.overlay.setAttribute('aria-hidden','false');
      ui.overlayPanel.innerHTML = '';
      try { builder(ui.overlayPanel); } catch(e){
        ui.overlayPanel.innerHTML = `<div style="font-weight:900">エラー</div><div class="small">${String(e)}</div><div style="margin-top:8px" class="btn" id="overlayCloseBtn">閉じる</div>`;
        const btn = document.getElementById('overlayCloseBtn');
        if(btn) btn.onclick = () => closeOverlaySafe();
      }
    } catch(e){
      console.error('[Part4] openOverlaySafe error', e);
    } finally {
      // overlayBusy will be cleared by closeOverlaySafe; keep true for now to prevent races
    }
  }
  function closeOverlaySafe(){
    try {
      if(ui.overlay){
        ui.overlay.style.display = 'none';
        ui.overlay.setAttribute('aria-hidden','true');
      }
    } catch(e){ console.warn('[Part4] closeOverlaySafe dom error', e); }
    state.overlayMode = null;
    state.overlayBusy = false;
  }

  // Replace openLevelUpChoices with robust non-blocking implementation
  window.openLevelUpChoices = function(num, opts = {}){
    num = Math.max(1, Math.min(6, (save && save.choiceSlots) ? save.choiceSlots : (num || 3)));
    // Build candidates via pickCandidatesForChoices if available, else fallback
    let candidates = [];
    try {
      if(typeof pickCandidatesForChoices === 'function'){
        candidates = pickCandidatesForChoices(num);
      }
    } catch(e){
      console.warn('[Part4] pickCandidatesForChoices threw', e);
    }
    if(!Array.isArray(candidates) || candidates.length < num){
      // fallback: use save.ownedCards and CARD_LIBRARY for fill
      candidates = candidates || [];
      const owned = Array.isArray(save.ownedCards) ? save.ownedCards.slice() : [];
      while(candidates.length < num && owned.length){
        const c = owned.shift();
        candidates.push(Object.assign({}, c));
      }
      // fill from CARD_LIBRARY if still insufficient
      const libs = (window.CARD_LIBRARY && CARD_LIBRARY.N) ? CARD_LIBRARY.N : [];
      let idx = 0;
      while(candidates.length < num && libs && libs.length){
        const templ = libs[idx++ % libs.length];
        candidates.push(Object.assign({}, templ));
      }
      // final fallback dummy
      while(candidates.length < num){
        candidates.push({ id:`fallback_${Date.now()}`, rarity:'N', label:'基礎攻撃+10%', desc:'仮効果: 攻撃+10%', effectKey:'atk_pct', params:{ pct:0.10 } });
      }
    }

    // show overlay via openOverlaySafe (non-blocking)
    openOverlaySafe('levelUp', (panel) => {
      panel.innerHTML = '';
      const title = document.createElement('div'); title.style.fontWeight='900'; title.style.fontSize='18px';
      title.textContent = (opts.origin === 'kill') ? '撃破ボーナス — 効果を選択' : (opts.origin === 'waveClear') ? 'Waveクリア報酬 — 効果を選択' : 'レベルアップ — 効果を選択';
      panel.appendChild(title);
      const sub = document.createElement('div'); sub.className='small'; sub.style.marginTop='8px';
      sub.textContent = `選択肢 ${num} 個。クリックで即座にセッション効果が適用されます。スキップ可。`;
      panel.appendChild(sub);

      const listDiv = document.createElement('div'); listDiv.className='choices'; listDiv.style.marginTop='12px';
      panel.appendChild(listDiv);

      // render each candidate
      candidates.forEach((card, idx) => {
        const el = document.createElement('div'); el.className='choice';
        const rarity = card.rarity || card.R || 'N';
        const color = (window.part3 && part3 && part3.debug && part3.debug.rarityColors && part3.debug.rarityColors[rarity]) ? part3.debug.rarityColors[rarity] : (window.RARITY_COLORS ? RARITY_COLORS[rarity] || '#9aa' : '#9aa');
        const label = card.label || card.name || card.id || '(不明)';
        el.innerHTML = `<div style="flex:1"><strong style="display:inline-block;margin-right:8px"><span style="display:inline-block;width:12px;height:12px;background:${color};border-radius:3px;vertical-align:middle;margin-right:6px"></span>[${rarity}] ${label}</strong><div class="small">${card.desc || ''}</div></div><div style="width:68px;text-align:center" class="small">選択</div>`;
        el.addEventListener('click', ()=>{
          // apply immediately but non-persistent (session only)
          try {
            applyCardToPlayer(card, { persistent:false });
            // optionally push visual feedback
            try { effects.push({ type:'apply', x:(player.x||CANVAS_W/2), y:(player.y-24||CANVAS_H/2), ttl:700, maxTtl:700, desc:`${label}` }); } catch(_){}
          } catch(e){ console.error('[Part4] applyCardToPlayer failed', e); }
          // close overlay (safe)
          closeOverlaySafe();
        });
        listDiv.appendChild(el);
      });

      const row = document.createElement('div'); row.style.display='flex'; row.style.gap='8px'; row.style.marginTop='12px';
      const skipBtn = document.createElement('div'); skipBtn.className='btn'; skipBtn.textContent='スキップ'; skipBtn.onclick = () => { closeOverlaySafe(); };
      const closeBtn = document.createElement('div'); closeBtn.className='btn'; closeBtn.textContent='閉じる'; closeBtn.onclick = () => { closeOverlaySafe(); };
      row.appendChild(skipBtn); row.appendChild(closeBtn);
      panel.appendChild(row);

      // Important: do not pause state.running here. The game should continue so wave timers can progress.
      // However, to avoid the joystick being active while overlay is open, ensure overlay is visible and pointer events handled by overlay (CSS already does this).
      // Allow input handlers to check state.overlayMode if they wish to ignore input.
      state.overlayBusy = false; // allow other overlays later
    });
  }; // end openLevelUpChoices

  // --------------------
  // Hook wave-clear detection into update loop
  // --------------------
  // We wrap the existing update to ensure the sequence: spawn->update entities->shield collision->wave clear->giveXP->openLevelUpChoices is robust.
  const origUpdate = typeof window.update === 'function' ? window.update : null;
  window.update = function(dt){
    // call original update if exists to keep base logic (bullets/enemies etc).
    // But we need to ensure our additional checks run afterwards reliably.
    try {
      if(origUpdate) origUpdate(dt);
    } catch(e){
      console.error('[Part4] orig update threw', e);
      // proceed to our handling to keep state consistent
    }

    // Shield collisions: intercept enemy bullets & enemies that intersect dome
    try {
      if(player && SHIELD_DOME.enabled && player.shield > 0){
        const r = getShieldRadius();
        const cx = player.x || (CANVAS_W/2);
        const cy = (player.y || CANVAS_H - 80) - 8;
        // enemyBullets
        if(Array.isArray(enemyBullets)){
          for(let i = enemyBullets.length - 1; i >= 0; i--){
            const b = enemyBullets[i];
            if(!b) continue;
            // only bullets near dome
            const dx = b.x - cx; const dy = b.y - cy;
            if(dx*dx + dy*dy <= r*r){
              const dmg = b.damage || 10;
              player.shield = Math.max(0, (player.shield || 0) - dmg);
              pushShieldHitEffect({ x:b.x, y:b.y }, dmg);
              enemyBullets.splice(i,1);
              if(player.shield <= 0){ player.shield = 0; try{ onGameEnd && onGameEnd(false); } catch(e){}; return; }
            }
          }
        }
        // enemies
        if(Array.isArray(enemies)){
          for(let i = enemies.length - 1; i >= 0; i--){
            const e = enemies[i];
            if(!e) continue;
            const dx = e.x - cx; const dy = e.y - cy;
            if(dx*dx + dy*dy <= r*r){
              const dmg = e.damage || Math.max(10, Math.floor((e.maxHp || 100)/10));
              const absorbed = Math.min(dmg, player.shield || 0);
              player.shield = Math.max(0, (player.shield || 0) - absorbed);
              pushShieldHitEffect({ x:e.x, y:e.y }, absorbed);
              try { onEnemyDefeated(e); } catch(err){ giveXP && giveXP(50 * (session.stageDifficultyMultiplier || 1)); }
              enemies.splice(i,1);
              if(player.shield <= 0){ player.shield = 0; try{ onGameEnd && onGameEnd(false); } catch(e){}; return; }
            }
          }
        }
      }
    } catch(e){
      console.error('[Part4] shield collision handling error', e);
    }

    // wave clear detection: if active and both enemies and enemyBullets empty -> clear
    try {
      if(session.waveState === 'active'){
        const emptyEnemies = !(Array.isArray(enemies) && enemies.length > 0);
        const emptyEnemyBullets = !(Array.isArray(enemyBullets) && enemyBullets.length > 0);
        if(emptyEnemies && emptyEnemyBullets){
          // prevent double-clear
          if(session.waveState !== 'cleared'){
            session.waveState = 'cleared';
            session.nextWaveTimer = WAVE_TRANSITION_DELAY;
            session._waveClearedAt = now();
            // Give XP for wave clear
            giveXP && giveXP(100 * (session.stageDifficultyMultiplier || 1));
            // Show level-up choices non-blocking (we do not pause update)
            try { openLevelUpChoices(1, { origin:'waveClear' }); } catch(e){ console.warn('[Part4] openLevelUpChoices threw', e); }
          }
        }
      }
    } catch(e){
      console.error('[Part4] wave clear detection error', e);
    }

    // advance wave transition timers even if overlay open (update called only when state.running true in main loop)
    try {
      // If update runs (state.running true), call transition handler
      handleWaveTransitions(dt);
    } catch(e){
      console.error('[Part4] handleWaveTransitions error', e);
    }
  }; // end update wrapper

  // --------------------
  // draw enhancements (dome visuals, shield bar, particles)
  // --------------------
  const origDraw = typeof window.draw === 'function' ? window.draw : null;
  window.draw = function(){
    try {
      if(origDraw){
        // call orig draw to preserve base visuals, but we will overlay dome and shield indicators afterwards for clarity
        origDraw();
      } else {
        // fallback minimal draw if orig missing (avoid breaking)
        if(ctx && ui && ui.canvas){
          ctx.clearRect(0,0,ui.canvas.width, ui.canvas.height);
        }
      }
    } catch(e){
      console.warn('[Part4] orig draw threw', e);
    }

    // draw dome and shield UI elements after base draw so they are visible
    try {
      if(player && SHIELD_DOME.enabled && ctx){
        if(player.shield > 0){
          const r = getShieldRadius();
          const cx = player.x || (CANVAS_W/2);
          const cy = (player.y || CANVAS_H - 80) - 8;
          // semi-circle dome
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(cx - r, cy);
          ctx.arc(cx, cy, r, Math.PI, 0, false);
          ctx.lineTo(cx + r, cy + r*0.25);
          ctx.lineTo(cx - r, cy + r*0.25);
          ctx.closePath();
          ctx.fillStyle = SHIELD_DOME.colorFill;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(cx, cy, r, Math.PI, 0, false);
          ctx.strokeStyle = SHIELD_DOME.colorStroke;
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();

          // shield HP small bar above player
          const pct = Math.max(0, (player.shield || 0) / Math.max(1, player.shieldMax || 5000));
          ctx.save();
          const bw = 90;
          const bh = 8;
          roundRect(ctx, cx - bw/2, player.y - (player.r || 18) - 30, bw, bh, 6);
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.fill();
          ctx.fillStyle = 'rgba(120,200,255,0.95)';
          roundRect(ctx, cx - bw/2, player.y - (player.r || 18) - 30, Math.max(6, bw * pct), bh, 6);
          ctx.fill();
          ctx.restore();
        }
        // draw shield-related particles & flashes from effects list
        if(Array.isArray(effects)){
          for(const fx of effects.slice()){
            if(!fx) continue;
            if(fx.type === 'shieldFlash'){
              const alpha = Math.max(0, fx.ttl / fx.maxTtl);
              ctx.beginPath();
              ctx.fillStyle = `rgba(140,200,255,${0.45 * alpha})`;
              ctx.arc(fx.x, fx.y, 28 + (1-alpha)*18, 0, Math.PI*2);
              ctx.fill();
            } else if(fx.type === 'shieldParticle'){
              const alpha = Math.max(0.12, fx.ttl / fx.maxTtl);
              ctx.beginPath();
              ctx.fillStyle = `rgba(140,200,255,${0.9 * alpha})`;
              ctx.ellipse(fx.x, fx.y, fx.r || 3, fx.r || 3, 0, 0, Math.PI*2);
              ctx.fill();
            }
          }
        }
      }
    } catch(e){
      console.warn('[Part4] draw enhancements error', e);
    }
  }; // end draw wrapper

  // --------------------
  // UI robustness helpers: ensure skip works always by removing overlayBusy blocking when skip pressed
  // --------------------
  // We attach a delegated listener to overlayPanel to catch any element with class 'btn-skip' to ensure it properly closes overlay
  try {
    if(ui && ui.overlayPanel && !ui.overlayPanel._part4_skipBound){
      ui.overlayPanel.addEventListener('click', function(ev){
        const tgt = ev.target;
        if(tgt && tgt.classList && tgt.classList.contains('btn-skip')){
          // close overlay forcibly and clear busy flags
          try { closeOverlay && closeOverlay(); } catch(e){ closeOverlaySafe(); }
          state.overlayBusy = false;
          state.overlayMode = null;
          // resume game
          state.running = true;
        }
      });
      ui.overlayPanel._part4_skipBound = true;
    }
  } catch(e){
    log('overlay skip binding failed', e);
  }

  // --------------------
  // Final sanity checks & boot-time fixes
  // --------------------
  (function bootChecks(){
    // Ensure session initial wave if running
    if(typeof session.wave === 'undefined' || session.wave < 1) session.wave = 1;
    if(!session.waveState || session.waveState === 'idle'){
      session.waveState = 'spawning';
      session.spawnTimer = 0;
      session.spawnedCount = 0;
    }
    // ensure mainLoop running
    if(typeof requestAnimationFrame !== 'undefined' && !window._part4_mainLoopEnsured){
      // no changes to mainLoop here; just mark
      window._part4_mainLoopEnsured = true;
    }
    log('Part4 boot checks done', session.wave, session.waveState);
  })();

  // expose some helpers for debug/manual control
  window._part4 = window._part4 || {};
  Object.assign(window._part4, {
    openOverlaySafe,
    closeOverlaySafe,
    handleWaveTransitions,
    handleSpawn,
    startWave,
    repairShield: function(){ if(player){ player.shield = player.shieldMax; updateUI && updateUI(); } },
    setWave: function(w){ session.wave = w; startWave(w); }
  });

  log('Part4 patch applied: stable wave transitions, non-blocking level-up overlays, shield/dome rework.');

})(); 
</script>
