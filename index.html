      const ang = Math.PI * (i / (count/2));
      effects.push({
        type: 'shieldParticle',
        x: pos.x,
        y: pos.y,
        vx: Math.cos(ang) * randRange(40,260),
        vy: Math.sin(ang) * randRange(40,260) - 40,
        ttl: 600 + Math.random()*200,
        maxTtl: 600 + Math.random()*200,
        r: Math.max(2, Math.random()*4),
      });
    }
  }

  /* -----------------------------
     startWave override (ensures proper initialization)
     - This function replaces or augments any existing startWave to guarantee
       spawnTimer/spawnedCount/waveState/nextWaveTimer are set correctly.
     ----------------------------- */
  window.startWave = function(waveNum){
    session.wave = waveNum;
    session.spawnTimer = 0;
    session.spawnedCount = 0;
    session.waveState = 'spawning';
    session.nextWaveTimer = 0;
    ui.uiWaveLabel && (ui.uiWaveLabel.textContent = `Wave ${waveNum}`);
    // reset other session specifics if needed
    p4log && p4log('startWave', waveNum);
  };

  /* -----------------------------
     handleSpawn override: uses NEW_WAVES and works generically across waves
     - Called from update(dt)
     ----------------------------- */
  window.handleSpawn = function(dt){
    if(!session || session.waveState === 'idle') return;
    const wave = session.wave || 1;
    const cfg = NEW_WAVES[wave];
    if(!cfg) return;
    // boss wave special
    if(cfg.boss){
      if(session.waveState === 'spawning'){
        // spawn boss once
        const mul = session.stageDifficultyMultiplier || 1;
        const bossHp = Math.max(1, Math.floor(cfg.bossHP * mul));
        spawnBoss({ x: CANVAS_W/2, y: 60, hp: bossHp, vx: cfg.bossSpeedX || 16, shootInterval: cfg.bossBulletInterval || 900 });
        session.waveState = 'active';
      }
      return;
    }
    // normal spawning
    session.spawnTimer = (session.spawnTimer || 0) + dt;
    const spawnInterval = cfg.spawnInterval;
    while(session.spawnedCount < cfg.count && session.spawnTimer >= spawnInterval){
      session.spawnTimer -= spawnInterval;
      session.spawnedCount++;
      const mul = session.stageDifficultyMultiplier || 1;
      const ex = randRange(30, CANVAS_W - 30);
      const hp = Math.max(1, Math.floor(cfg.hp * mul));
      spawnEnemy({ x:ex, y:-40, hp, speed: cfg.speed });
      if(session.spawnedCount >= cfg.count){
        session.waveState = 'active';
      }
    }
  };

  /* -----------------------------
     Shield collision and absorption logic
     - Iterates enemies and enemyBullets and checks dome intersection.
     - If an entity collides with dome, shield absorbs damage; entity is destroyed/removed.
     - If shield falls <= 0 -> onGameEnd(false)
     ----------------------------- */
  function handleShieldCollisions(){
    if(!player || !SHIELD.enabled) return;
    if(!player.shield || player.shield <= 0) return;
    const r = getShieldRadius();
    const cx = player.x;
    const cy = player.y - 8; // dome center slightly above player center for nicer visuals

    // enemy bullets first
    for(let i = enemyBullets.length - 1; i >= 0; i--){
      const b = enemyBullets[i];
      if(!b) continue;
      // consider dome only for bullets from above (y <= player.y)
      if(b.y <= player.y){
        const dx = b.x - cx;
        const dy = b.y - cy;
        const dist2 = dx*dx + dy*dy;
        if(dist2 <= r*r){
          // shield absorbs
          const dmg = b.damage || 10;
          player.shield -= dmg;
          pushShieldHitEffect({ x:b.x, y:b.y }, dmg);
          enemyBullets.splice(i,1);
          if(player.shield <= 0){
            player.shield = 0;
            onGameEnd(false);
            return;
          }
          continue;
        }
      }
    }

    // enemies collision
    for(let i = enemies.length - 1; i >= 0; i--){
      const e = enemies[i];
      if(!e) continue;
      // only consider when enemy's center is above or near player (y <= player.y)
      if(e.y <= player.y + (e.h/2 || 0)){
        const dx = e.x - cx;
        const dy = e.y - cy;
        const dist2 = dx*dx + dy*dy;
        if(dist2 <= r*r){
          // shield absorbs enemy contact damage
          const dmg = e.damage || Math.max(10, Math.floor((e.maxHp || 100)/10));
          // reduce shield by dmg but you can scale to partial if desired
          const absorbed = Math.min(dmg, Math.max(1, Math.floor(dmg)));
          player.shield -= absorbed;
          // show effect at contact point (approx e.x,e.y)
          pushShieldHitEffect({ x:e.x, y:e.y }, absorbed);
          // destroy enemy (award XP)
          try {
            onEnemyDefeated(e); // awards XP / rewards
          } catch(err){
            // fallback: just add XP
            giveXP(50 * (session.stageDifficultyMultiplier || 1));
          }
          enemies.splice(i,1);
          if(player.shield <= 0){
            player.shield = 0;
            onGameEnd(false);
            return;
          }
        }
      }
    }
  }

  /* -----------------------------
     Wave transition handler:
     - When wave cleared, set session.nextWaveTimer = WAVE_TRANSITION_DELAY.
     - During update, when session.nextWaveTimer elapses, increment wave or end run.
     ----------------------------- */
  function handleWaveTransitions(dt){
    if(session.waveState === 'cleared'){
      session.nextWaveTimer = session.nextWaveTimer || WAVE_TRANSITION_DELAY;
      session.nextWaveTimer -= dt;
      if(session.nextWaveTimer <= 0){
        // move to next wave or finish
        if(session.wave < (session.maxWave || 5)){
          session.wave = session.wave + 1;
          startWave(session.wave);
          // ensure running resumes
          state.running = true;
        } else {
          // final wave cleared -> success
          onGameEnd(true);
        }
      }
    }
  }

  /* -----------------------------
     Big override: update(dt)
     - We replace the global update function to ensure:
       * vertical movement disabled
       * handleSpawn uses NEW_WAVES
       * shield collisions processed (before final wave-clear handling)
       * wave transitions occur
       * all other behaviors (bullets, enemies) remain consistent
     - Keep code defensive: if original update exists and we break things, you can revert.
     ----------------------------- */
  window._original_update_backup = window._original_update_backup || window.update || null;
  window.update = function(dt){
    // ensure stick vertical input is ignored: player can not move vertically
    if(stickInput) stickInput.y = 0;

    // spawn logic
    try { handleSpawn(dt); } catch(e){ console.error('handleSpawn error', e); }

    // player movement: X only, Y fixed
    if(player){
      const nx = (stickInput && stickInput.x) ? stickInput.x : 0;
      const speed = player.speedBase || 200;
      player.x += nx * speed * (dt/1000);
      player.x = clamp(player.x, player.r, CANVAS_W - player.r);
      // lock Y
      player.y = PLAYER_FIXED_Y;
    }

    // auto fire
    const now = performance.now();
    if(player && (now - player.lastShot >= player.fireCooldown) && state.running){
      player.lastShot = now;
      const count = player.spread || 1;
      const arc = (count > 1) ? Math.PI/12 : 0;
      for(let i=0;i<count;i++){
        const angle = -Math.PI/2 + (count>1 ? (i - (count-1)/2) * arc : 0);
        const speedBullet = 700 * (player.passives && player.passives.bulletSpeed || 1);
        const vx = Math.cos(angle) * 0;
        const vy = Math.sin(angle) * speedBullet;
        const allowSplit = !!(player.passives && player.passives.splitOnHit);
        const splitChance = (player.passives && player.passives.splitChance) ? player.passives.splitChance : 0.35;
        spawnBullet({ x:player.x, y:player.y - player.r - 6, vx, vy, damage:player.damagePerShot, pierce:player.pierce, gen:0, radius:4, meta:{ allowSplit, splitChance } });
      }
    }

    // bullets movement & collision with enemies
    for(let i = bullets.length - 1; i >= 0; i--){
      const b = bullets[i];
      b.x += (b.vx || 0) * (dt/1000);
      b.y += (b.vy || -500) * (dt/1000);
      if(b.y < -40 || b.y > CANVAS_H + 40 || b.x < -80 || b.x > CANVAS_W + 80){
        bullets.splice(i,1); continue;
      }
      for(let j = enemies.length - 1; j >= 0; j--){
        const e = enemies[j];
        if(pointInRect(b.x, b.y, e.x, e.y, e.w, e.h)){
          e.hp -= b.damage;
          // splitting safety (only gen 0 splits)
          if(b.gen === 0 && b.meta && b.meta.allowSplit && Math.random() < (b.meta.splitChance || 0.35)){
            const shards = Math.min(6, Math.max(1, Math.floor((b.damage||1)/2)));
            if(bullets.length + enemyBullets.length + shards <= SPLIT_GLOBAL_LIMIT){
              for(let s=0;s<shards;s++){
                const ang = randRange(-Math.PI*0.8, -Math.PI*0.2);
                spawnBullet({ x:e.x, y:e.y, vx: Math.cos(ang)*randRange(40,180), vy: Math.sin(ang)*randRange(260,520), damage: Math.max(1, Math.floor((b.damage||1) * 0.45)), pierce:0, gen:1, radius:3 });
              }
            }
          }
          b.pierce--;
          if(b.pierce < 0){ bullets.splice(i,1); }
          if(e.hp <= 0){ onEnemyDefeated(e); enemies.splice(j,1); }
          break;
        }
      }
    }

    // enemies update & bottom collision handling modified to account for dome
    for(let i = enemies.length - 1; i >= 0; i--){
      const e = enemies[i];
      if(e.status && e.status.length){
        for(let sIdx = e.status.length - 1; sIdx >= 0; sIdx--){
          const s = e.status[sIdx];
          if(s.type === 'poison'){ e.hp -= s.dps * (dt/1000); s.remain -= dt; if(s.remain <= 0) e.status.splice(sIdx,1); }
          if(s.type === 'slow'){ s.remain -= dt; if(s.remain <= 0) e.status.splice(sIdx,1); }
        }
      }
      if(e.id === 'mob'){
        let slowFactor = 1;
        if(e.status) for(const st of e.status) if(st.type === 'slow') slowFactor = 0.5;
        e.y += e.speed * (dt/1000) * slowFactor;
        // If enemy reaches bottom beyond canvas, subtract shield if no dome? We keep original behavior BUT allow dome to intercept earlier
        if(e.y - e.h/2 > CANVAS_H + 12){
          // enemy passes through screen - counts as shield contact if shield still exists (but unlikely since dome intercepts earlier)
          player.shield -= e.damage;
          enemies.splice(i,1);
          if(player.shield <= 0){
            player.shield = 0;
            onGameEnd(false);
            return;
          }
        }
      } else if(e.id === 'boss'){
        e.x += e.vx * (dt/1000);
        if(e.x < e.w/2){ e.x = e.w/2; e.vx *= -1; }
        if(e.x > CANVAS_W - e.w/2){ e.x = CANVAS_W - e.w/2; e.vx *= -1; }
        e.shootTimer = (e.shootTimer || 0) + dt;
        if(e.shootTimer > (e.shootInterval || 900)){
          e.shootTimer = 0;
          // boss shoots fan
          const shots = 9;
          for(let s=0;s<shots;s++){
            const ang = Math.PI/2 + (s - (shots-1)/2) * 0.16;
            enemyBullets.push({ x:e.x + randRange(-20,20), y:e.y + e.h/2, vx: Math.cos(ang)*140, vy: Math.sin(ang)*260, damage: Math.ceil(e.maxHp/220) });
          }
        }
        if(e.hp <= 0){ onEnemyDefeated(e); enemies.splice(i,1); }
      }
    }

    // enemy bullets movement & collision ; dome intercepts will be handled after movement but before player damage
    for(let i = enemyBullets.length - 1; i >= 0; i--){
      const b = enemyBullets[i];
      b.x += b.vx * (dt/1000);
      b.y += b.vy * (dt/1000);
      if(b.y > CANVAS_H + 40 || b.x < -80 || b.x > CANVAS_W + 80) {
        enemyBullets.splice(i,1); continue;
      }
      // If bullet hits player body (only if shield absent), apply damage
      if(player && player.shield <= 0 && pointInRect(b.x,b.y,player.x,player.y,player.r*2,player.r*2)){
        player.shield -= b.damage;
        enemyBullets.splice(i,1);
        if(player.shield <= 0){ player.shield = 0; onGameEnd(false); return; }
        continue;
      }
    }

    // effects update
    for(let i = effects.length - 1; i >= 0; i--){
      const fx = effects[i];
      fx.ttl -= dt;
      if(fx.ttl <= 0){ effects.splice(i,1); continue; }
      // update motion for particle types
      if(fx.type === 'shieldParticle'){
        fx.x += (fx.vx || 0) * (dt/1000);
        fx.y += (fx.vy || 0) * (dt/1000);
      }
    }

    // passive pulses, regen etc (kept same)
    if(player && player.passives && player.passives.areaPulse){
      for(const p of player.passives.areaPulse){
        p.timer = (p.timer || 0) + dt;
        if(p.timer >= p.interval){
          p.timer -= p.interval;
          const dmg = p.dmg || 40;
          for(let i=enemies.length-1;i>=0;i--){
            const e = enemies[i];
            if(Math.hypot(e.x-player.x, e.y-(player.y-60)) <= 72){ e.hp -= dmg; if(e.hp <= 0){ onEnemyDefeated(e); enemies.splice(i,1); } }
          }
          effects.push({ type:'pulse', x:player.x, y:player.y-60, ttl:600, maxTtl:600, r:72 });
        }
      }
    }
    if(player && player.regen > 0) player.shield = Math.min(player.shieldMax, player.shield + player.regen * (dt/1000));

    // *** NEW: shield collision handling (before wave clear check) ***
    try { handleShieldCollisions(); } catch(e){ console.error('shield collision error', e); }

    // wave clear detection
    if(session.waveState === 'active' && enemies.length === 0 && enemyBullets.length === 0){
      session.waveState = 'cleared';
      session.nextWaveTimer = WAVE_TRANSITION_DELAY;
      state.running = false; // pause briefly; transition handler will resume
      // give small XP and open upgrade prompt
      giveXP(100 * (session.stageDifficultyMultiplier || 1)); // a bit more for wave clear
      // Use level-up choices (single small one)
      openLevelUpChoices(1, { origin:'waveClear' });
    }

    // wave transition handler (if in cleared)
    try { handleWaveTransitions(dt); } catch(e){ console.error('waveTransition error', e); }

    // update UI at end
    updateUI();
  }; // end update override

  /* -----------------------------
     draw override: draws dome shield above player and shield effects
     - We wrap or replace the existing draw function to ensure dome is drawn in front of background but behind player highlight.
     ----------------------------- */
  window._original_draw_backup = window._original_draw_backup || window.draw || null;
  window.draw = function(){
    // base clear & starry background (kept if original draw absent)
    if(!ctx) return;
    ctx.clearRect(0,0,ui.canvas.width, ui.canvas.height);
    for(let i=0;i<40;i++){
      ctx.fillStyle = 'rgba(255,255,255,0.02)';
      ctx.fillRect(((i*47) + (Date.now()/30|0)) % CANVAS_W, (i*31) % CANVAS_H, 1,1);
    }

    // enemies
    for(const e of enemies){
      ctx.save(); ctx.translate(e.x,e.y);
      if(e.id === 'mob'){
        ctx.fillStyle = '#ffb366'; roundRect(ctx, -e.w/2, -e.h/2, e.w, e.h, 8); ctx.fill();
        ctx.fillStyle = '#333'; ctx.fillRect(-e.w/2, e.h/2 + 6, e.w, 8);
        ctx.fillStyle = '#ff6666'; ctx.fillRect(-e.w/2, e.h/2 + 6, e.w * Math.max(0,e.hp) / e.maxHp, 8);
      } else {
        ctx.fillStyle = '#a84d4d'; roundRect(ctx, -e.w/2, -e.h/2, e.w, e.h, 12); ctx.fill();
        ctx.fillStyle = '#222'; ctx.fillRect(-e.w/2, e.h/2 + 10, e.w, 12);
        ctx.fillStyle = '#ff8a8a'; ctx.fillRect(-e.w/2, e.h/2 + 10, e.w * Math.max(0,e.hp) / e.maxHp, 12);
        ctx.fillStyle = '#fff'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText(`BOSS ${Math.floor(e.hp)}/${e.maxHp}`, 0, -e.h/2 - 8);
      }
      ctx.restore();
    }

    // bullets
    for(const b of bullets){ ctx.beginPath(); ctx.fillStyle = '#c6f9ff'; ctx.ellipse(b.x,b.y,b.radius,b.radius,0,0,Math.PI*2); ctx.fill(); }
    for(const eb of enemyBullets){ ctx.beginPath(); ctx.fillStyle = '#ffcccb'; ctx.arc(eb.x,eb.y,5,0,Math.PI*2); ctx.fill(); }

    // shield visualization (draw dome under player overlay)
    if(player && player.shield > 0){
      const r = getShieldRadius();
      const cx = player.x;
      const cy = player.y - 8;
      // dome fill (semi-circle)
      ctx.save();
      // draw semi-circle (top half)
      ctx.beginPath();
      ctx.moveTo(cx - r, cy);
      ctx.arc(cx, cy, r, Math.PI, 0, false);
      ctx.lineTo(cx + r, cy + r*0.25);
      ctx.lineTo(cx - r, cy + r*0.25);
      ctx.closePath();
      ctx.fillStyle = SHIELD.colorFill;
      ctx.fill();
      // stroke
      ctx.beginPath();
      ctx.arc(cx, cy, r, Math.PI, 0, false);
      ctx.strokeStyle = SHIELD.colorStroke;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      // shield HP bar on player (small)
      const pct = Math.max(0, player.shield / player.shieldMax);
      ctx.save();
      const barW = 80, barH = 8;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      roundRect(ctx, cx - barW/2, player.y - player.r - 28, barW, barH, 6); ctx.fill();
      ctx.fillStyle = 'rgba(120,200,255,0.9)';
      roundRect(ctx, cx - barW/2, player.y - player.r - 28, Math.max(2, barW * pct), barH, 6); ctx.fill();
      ctx.restore();
    }

    // effects (shield particles & flashes)
    for(const fx of effects){
      if(fx.type === 'shieldFlash'){
        const alpha = Math.max(0, fx.ttl / fx.maxTtl);
        ctx.beginPath();
        ctx.fillStyle = `rgba(140,200,255,${0.45 * alpha})`;
        ctx.arc(fx.x, fx.y, 28 + (1-alpha)*18, 0, Math.PI*2);
        ctx.fill();
      } else if(fx.type === 'shieldParticle'){
        const alpha = Math.max(0.12, fx.ttl / fx.maxTtl);
        ctx.beginPath();
        ctx.fillStyle = `rgba(140,200,255,${0.9 * alpha})`;
        ctx.ellipse(fx.x, fx.y, fx.r || 3, fx.r || 3, 0, 0, Math.PI*2);
        ctx.fill();
      } else if(fx.type === 'apply'){
        ctx.fillStyle='#fff'; ctx.font='12px sans-serif'; ctx.textAlign='center'; ctx.fillText(fx.desc || '', fx.x, fx.y);
      } else if(fx.type === 'pulse'){
        ctx.beginPath(); ctx.fillStyle = 'rgba(120,200,255,0.08)'; ctx.arc(fx.x,fx.y,fx.r*(fx.ttl/fx.maxTtl),0,Math.PI*2); ctx.fill();
      } else if(fx.type === 'explosion'){
        ctx.beginPath(); ctx.fillStyle = 'rgba(255,140,60,0.12)'; ctx.arc(fx.x,fx.y,fx.r*(fx.ttl/fx.maxTtl),0,Math.PI*2); ctx.fill();
      }
    }

    // player drawn on top of dome for clear silhouette
    if(player){
      ctx.save(); ctx.translate(player.x,player.y); ctx.fillStyle='#66c0ff'; roundRect(ctx,-player.r,-player.r,player.r*2,player.r*2,8); ctx.fill();
      ctx.fillStyle='#032'; ctx.fillRect(-8,-6,16,12); ctx.restore();
    }

    // HUD overlay (score etc) is handled separately by DOM; no need to draw here
  }; // end draw override

  /* -----------------------------
     Utility: logging for part4
     ----------------------------- */
  function p4log(...args){ if(window.state && window.state.debug) console.log('[Part4]', ...args); }

  p4log('Part4 patch applied: dome shield, no vertical movement, wave5 configured.');

  /* -----------------------------
     Ensure initial conditions: if session was idle, start at wave 1 on play
     ----------------------------- */
  if(session && !session.waveState) {
    session.wave = session.wave || 1;
    session.waveState = 'idle';
  }

  /* -----------------------------
     Guarantee startPlay uses our startWave semantics (wrap if necessary)
     ----------------------------- */
  if(typeof window.startPlay === 'function'){
    // wrap existing startPlay to call our startWave after resetting
    const origStartPlay = window.startPlay;
    window.startPlay = function(stageNumber, challenge=false){
      origStartPlay(stageNumber, challenge); // original handles resetPlayer etc
      // ensure our session values are set and wave 1 started
      session.maxWave = session.maxWave || 5;
      session.wave = 1;
      startWave(1);
      p4log('startPlay wrapper invoked: startWave(1)');
    };
  }

  /* -----------------------------
     Done patch
     ----------------------------- */
})();
</script>
