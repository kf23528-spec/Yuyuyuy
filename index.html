      // We DO NOT set state.running = false permanently here.
      // But to preserve user reading UX, we pause user input effects (optional). The main timers (nextWaveTimer) will continue.
      // Call original if available
      if(typeof _orig_openLevelUpChoices === 'function'){
        try {
          // call original implementation — but guard it with timeout fallback
          let called = false;
          // if original blocks or throws, fallback to safe UI
          try {
            _orig_openLevelUpChoices(num || (save && save.choiceSlots) || 1, opts || {});
            called = true;
          } catch(origErr){
            warn('orig openLevelUpChoices threw, falling back', origErr);
            called = false;
          }
          if(called) {
            // schedule a watchdog to ensure overlay didn't pause everything
            setTimeout(()=> {
              if(typeof session.nextWaveTimer !== 'number' && session.waveState === 'cleared'){
                ensureNextWaveTimer(DEFAULT_NEXT_WAVE_DELAY);
              }
            }, 120);
            return;
          }
        } catch(e){ warn('call orig openLevelUpChoices failed', e); }
      }
      // Fallback safe UI (non-blocking)
      safeOpenLevelUpChoicesFallback(num || (save && save.choiceSlots) || 1, opts || {});
    } catch(e){
      err('openLevelUpChoices wrapper failed', e);
      // ensure game not stuck
      state.running = true;
    }
  };

  function safeOpenLevelUpChoicesFallback(num, opts){
    try {
      // don't block nextWaveTimer progression — DO NOT change state.running
      // ensure overlay opens in a safe way
      const builder = function(panel){
        panel.innerHTML = '';
        const title = document.createElement('div'); title.style.fontWeight='900'; title.style.fontSize='18px';
        title.textContent = (opts && opts.origin === 'waveClear') ? 'Waveクリア報酬 — 選択' : 'レベルアップ — 効果を選択';
        panel.appendChild(title);
        const sub = document.createElement('div'); sub.className='small'; sub.style.marginTop='8px';
        sub.textContent = `選択肢 ${num} 個。選ぶかスキップしてください。`;
        panel.appendChild(sub);
        const listDiv = document.createElement('div'); listDiv.className='choices'; listDiv.style.marginTop='12px';
        panel.appendChild(listDiv);
        // gather candidates safely
        let candidates = [];
        try { candidates = (typeof pickCandidatesForChoices === 'function') ? pickCandidatesForChoices(num) : []; } catch(e){ warn('pickCandidatesForChoices threw', e); }
        if(!Array.isArray(candidates) || candidates.length === 0){
          for(let i=0;i<num;i++) candidates.push({ id:`fallback_${i}`, rarity:'N', label:'基礎攻撃+10%', desc:'仮効果', effectKey:'atk_pct', params:{pct:0.10} });
        }
        candidates.forEach(c => {
          const el = document.createElement('div'); el.className='choice';
          el.innerHTML = `<div style="flex:1"><strong>${c.label||c.name||c.id}</strong><div class="small">${c.desc||''}</div></div><div style="width:70px;text-align:center" class="small">選択</div>`;
          el.addEventListener('click', () => {
            try { applyCardToPlayer(c, { persistent:false }); } catch(e){ warn('applyCardToPlayer in fallback failed', e); }
            // close overlay robustly
            try { if(typeof _orig_closeOverlay === 'function'){ _orig_closeOverlay(); } else { closeOverlay(); } } catch(_){}
            // ensure state.running remains true so next wave timers tick (do not force pause)
            state.running = state.running || true;
            state.overlayMode = null;
          });
          listDiv.appendChild(el);
        });
        const skip = document.createElement('div'); skip.className='btn'; skip.style.marginTop='10px'; skip.textContent='スキップ';
        skip.onclick = () => {
          try { if(typeof _orig_closeOverlay === 'function'){ _orig_closeOverlay(); } else { closeOverlay(); } } catch(_){}
          state.overlayMode = null;
          state.running = state.running || true;
        };
        panel.appendChild(skip);
      }; // builder

      // open overlay via original openOverlay if available, else fallback to simple DOM changes
      if(typeof _orig_openOverlay === 'function'){
        try { _orig_openOverlay('levelUp', builder); } catch(e){ warn('orig openOverlay threw, using direct fallback', e); directOpenOverlayFallback('levelUp', builder); }
      } else {
        directOpenOverlayFallback('levelUp', builder);
      }
      // set overlayBusy watchdog timestamp
      window._part25_overlayBusySince = Date.now();
    } catch(e){
      err('safeOpenLevelUpChoicesFallback failed', e);
      state.running = true;
      state.overlayMode = null;
    }
  }

  // simple direct openOverlay fallback
  function directOpenOverlayFallback(mode, builder){
    try {
      if(!ui || !ui.overlay || !ui.overlayPanel) {
        warn('overlay DOM not found for fallback openOverlay');
        return;
      }
      ui.overlay.style.display = 'flex';
      ui.overlay.setAttribute('aria-hidden', 'false');
      ui.overlayPanel.innerHTML = '';
      try { builder(ui.overlayPanel); } catch(e){ ui.overlayPanel.innerHTML = `<div style="font-weight:900">エラー</div><div class="small">${String(e)}</div>`; }
      state.overlayBusy = false;
      state.overlayMode = mode;
    } catch(e){ warn('directOpenOverlayFallback error', e); }
  }

  /* -----------------------------
     update wrapper: post-checks for wave clear and timer tick
     - _orig_update を呼んだ後に強力な post-check を実行
     - ここで wave clear -> set waveState cleared -> ensureNextWaveTimer を行う
     - また session.nextWaveTimer を減算して自動遷移を行う（overlay 有無にかかわらず）
  */
  window.update = function(dt){
    // call original safely
    try {
      if(typeof _orig_update === 'function'){
        _orig_update(dt);
      } else {
        // minimal fallback: try to call handleSpawn
        try { if(typeof handleSpawn === 'function') handleSpawn(dt); } catch(e){}
      }
    } catch(e){
      err('orig update threw', e);
      // do not stop: continue to post-checks
    }

    // Post-update: shield checks, passive ticks may be elsewhere. We concentrate on wave progression.
    try {
      // Detect wave-clear robustly: if waveState active but no enemies and no enemyBullets -> cleared
      const enemiesEmpty = !(Array.isArray(enemies) && enemies.length > 0);
      const enemyBulletsEmpty = !(Array.isArray(enemyBullets) && enemyBullets.length > 0);
      if(session.waveState === 'active' && enemiesEmpty && enemyBulletsEmpty){
        // Avoid double-processing
        if(session.waveState !== 'cleared'){
          session.waveState = 'cleared';
          session._waveClearedAt = Date.now();
          log('Wave cleared detected by Part2.5 post-check (session.wave =', session.wave, ')');
          // immediate XP award for wave clear (safe call)
          try { giveXP && giveXP(50 * (session.stageDifficultyMultiplier || 1)); } catch(e){ warn('giveXP on waveClear threw', e); }
          // queue reward display but use openLevelUpChoices wrapper (safe)
          try { openLevelUpChoices(1, { origin:'waveClear' }); } catch(e){ warn('openLevelUpChoices call on waveClear failed', e); }
          // ensure nextWaveTimer is set
          ensureNextWaveTimer(DEFAULT_NEXT_WAVE_DELAY);
        }
      }

      // If waveState is 'cleared' and nextWaveTimer is numeric, count it down regardless overlay
      if(session.waveState === 'cleared' && typeof session.nextWaveTimer === 'number'){
        session.nextWaveTimer -= dt;
        // defensive minimum floor
        if(session.nextWaveTimer < -99999) session.nextWaveTimer = 0;
        if(session.nextWaveTimer <= 0){
          // advance to next wave or end
          session.nextWaveTimer = null;
          const nextWave = (typeof session.wave === 'number') ? session.wave + 1 : 2;
          const maxWave = (typeof session.maxWave === 'number') ? session.maxWave : (typeof MAX_STAGE === 'number' ? MAX_STAGE : 9999);
          if(nextWave <= maxWave){
            log('Auto-advancing to next wave:', nextWave);
            try {
              // prefer original startWave if exists
              if(typeof _orig_startWave === 'function'){
                _orig_startWave(nextWave);
              } else if(typeof startWave === 'function'){
                // if startWave has been wrapped previously, call current startWave
                startWave(nextWave);
              } else {
                // fallback minimal assignment
                session.wave = nextWave;
                session.waveState = 'spawning';
                session.spawnedCount = 0;
                session.spawnTimer = 0;
                if(ui && ui.uiWaveLabel) ui.uiWaveLabel.textContent = `Wave ${session.wave}`;
              }
            } catch(e){
              warn('startWave call during auto-advance failed', e);
              // fallback: set session values manually to recover loop
              session.wave = nextWave;
              session.waveState = 'spawning';
              session.spawnedCount = 0;
              session.spawnTimer = 0;
              if(ui && ui.uiWaveLabel) ui.uiWaveLabel.textContent = `Wave ${session.wave}`;
            } finally {
              // ensure running state true so update continues
              state.running = true;
            }
          } else {
            // reached max wave -> finalize
            log('Reached maxWave: triggering onGameEnd(true)');
            try { if(typeof onGameEnd === 'function') onGameEnd(true); } catch(e){ warn('onGameEnd threw', e); }
          }
        }
      }

    } catch(e){
      err('Part2.5: update post-checks threw', e);
      // ensure game not stuck
      state.running = true;
    }
  };

  /* -----------------------------
     startWave wrapper: ensure session.nextWaveTimer reset and session.waveState correctly set
     - wraps original startWave if present, otherwise provides safe startWave
  */
  if(typeof _orig_startWave === 'function'){
    window.startWave = function(w){
      try {
        _orig_startWave(w);
      } catch(e){ warn('orig startWave threw, using fallback', e); 
        // fallback assignments
        session.wave = w;
        session.spawnTimer = 0;
        session.spawnedCount = 0;
        session.waveState = 'spawning';
        if(ui && ui.uiWaveLabel) ui.uiWaveLabel.textContent = `Wave ${session.wave}`;
      } finally {
        // always clear nextWaveTimer when a wave starts
        session.nextWaveTimer = null;
        session._waveClearedAt = null;
        state.running = true;
      }
    };
  } else {
    // no original: ensure robust startWave
    window.startWave = function(w){
      session.wave = w || 1;
      session.spawnTimer = 0;
      session.spawnedCount = 0;
      session.waveState = 'spawning';
      session.nextWaveTimer = null;
      session._waveClearedAt = null;
      if(ui && ui.uiWaveLabel) ui.uiWaveLabel.textContent = `Wave ${session.wave}`;
      state.running = true;
    };
  }

  /* -----------------------------
     handleSpawn wrapper: some Part2 changes may have replaced handleSpawn.
     Keep original but ensure spawn->active transitions are maintained and don't block
  */
  if(typeof _orig_handleSpawn === 'function'){
    window.handleSpawn = function(dt){
      try {
        _orig_handleSpawn(dt);
      } catch(e){
        warn('orig handleSpawn threw', e);
        // fallback minimal: attempt to spawn at least one enemy if in spawning
        try {
          if(session.waveState === 'spawning'){
            const cfg = (typeof baseWaveTemplate === 'function') ? baseWaveTemplate(session.currentStage || 1, session.wave || 1) : { count:4, hp:80, speed:22, spawnInterval:900 };
            // spawn a single enemy as a recovery
            if(typeof spawnEnemy === 'function'){
              spawnEnemy({ x: randRange(40, CANVAS_W-40)|0, y: -40, hp: Math.max(1, (cfg.hp||80) * (session.stageDifficultyMultiplier||1)), speed: cfg.speed || 22 });
              session.spawnedCount = (session.spawnedCount || 0) + 1;
              if(session.spawnedCount >= (cfg.count || 4)) session.waveState = 'active';
            }
          }
        } catch(e2){ warn('fallback handleSpawn spawn failed', e2); }
      }
    };
  } else {
    // no original: provide safe handleSpawn (non-invasive)
    window.handleSpawn = function(dt){
      try {
        // basic spawn logic if not present
        if(session.waveState !== 'spawning') return;
        const cfg = (typeof baseWaveTemplate === 'function') ? baseWaveTemplate(session.currentStage || 1, session.wave || 1) : { count:4, hp:80, speed:22, spawnInterval:900 };
        session.spawnTimer = (session.spawnTimer || 0) + dt;
        if(session.spawnTimer >= cfg.spawnInterval){
          session.spawnTimer -= cfg.spawnInterval;
          if(typeof spawnEnemy === 'function'){
            const ex = randRange(40, CANVAS_W-40)|0;
            const hp = Math.max(1, Math.floor(cfg.hp * (session.stageDifficultyMultiplier || 1)));
            spawnEnemy({ x: ex, y: -40, hp, speed: cfg.speed });
            session.spawnedCount = (session.spawnedCount || 0) + 1;
            if(session.spawnedCount >= cfg.count) session.waveState = 'active';
          }
        }
      } catch(e){ warn('fallback handleSpawn threw', e); }
    };
  }

  /* -----------------------------
     Overlay watchdog: overlayBusy が長時間 true の場合 recover
     - overlayBusy が 3秒超であれば最終手段で閉じるかフラグを解除
  */
  (function installOverlayWatchdog(){
    const WATCHDOG_INTERVAL = 800;
    const MAX_BUSY_MS = 5000;
    setInterval(() => {
      try {
        if(state && state.overlayBusy){
          if(!window._part25_overlayBusySince) window._part25_overlayBusySince = Date.now();
          else {
            const elapsed = Date.now() - window._part25_overlayBusySince;
            if(elapsed > MAX_BUSY_MS){
              warn('overlayBusy watchdog: forcing clear after', elapsed, 'ms');
              // attempt to close overlay gracefully
              try { if(typeof _orig_closeOverlay === 'function'){ _orig_closeOverlay(); } else { closeOverlay(); } } catch(e){}
              state.overlayBusy = false;
              state.overlayMode = null;
              // ensure running is true so update continues
              state.running = true;
              window._part25_overlayBusySince = null;
            }
          }
        } else {
          window._part25_overlayBusySince = null;
        }
      } catch(e){ warn('overlay watchdog error', e); }
    }, WATCHDOG_INTERVAL);
  })();

  /* -----------------------------
     Reward queue drainer: reward UI が複数で詰まっているケースでも queue を順次処理
     - Part1.5 のアプローチを踏襲（キュー実装）
  */
  window._part25_rewardQueue = window._part25_rewardQueue || [];
  function processPart25RewardQueueOnce(){
    try {
      if(!window._part25_rewardQueue || window._part25_rewardQueue.length === 0) return false;
      const item = window._part25_rewardQueue.shift();
      try {
        openLevelUpChoices(item.num || 1, item.opts || {});
        return true;
      } catch(e){
        warn('processPart25RewardQueueOnce: openLevelUpChoices failed', e);
        return false;
      }
    } catch(e){ warn('processPart25RewardQueueOnce threw', e); return false; }
  }
  // periodic drainer that is conservative: only triggers when appropriate
  setInterval(() => {
    try {
      if(window._part25_rewardQueue && window._part25_rewardQueue.length > 0){
        // If game paused, process; if running, process only one item to avoid repeated pauses
        if(!state.running || !state.overlayMode) processPart25RewardQueueOnce();
      }
    } catch(e){ /* ignore */ }
  }, 300);

  /* -----------------------------
     Small diagnostic exposure for debugging
  */
  window._part25 = window._part25 || {};
  Object.assign(window._part25, {
    ensureNextWaveTimer,
    processPart25RewardQueueOnce,
    inspectSession: function(){ console.log('session', JSON.parse(JSON.stringify(session || {}))); },
    inspectState: function(){ console.log('state', JSON.parse(JSON.stringify(state || {}))); },
    forceAdvanceWave: function(){
      try {
        const next = (typeof session.wave === 'number') ? session.wave + 1 : 2;
        if(typeof _orig_startWave === 'function'){ _orig_startWave(next); } else { startWave(next); }
        state.running = true;
      } catch(e){ warn('forceAdvanceWave failed', e); }
    }
  });

  info('Part2.5 applied: update/startWave/handleSpawn/openLevelUpChoices wrapped; watchdogs & reward-queue installed.');
})();
</script>
<script>
/*
  Part3 修正版 — ガチャ／覚醒／一括売却／高レア強化／超指数チャレンジ対応パッチ
  - 互換性最優先で既存関数をラップします
  - 要求された仕様を可能な限り忠実に実装します
  - 既存saveやUIが無ければ安全にフォールバックします
*/

(function Part3Patch(){
  'use strict';
  if(typeof window === 'undefined') return;
  // shorthand
  const w = window;

  // safety defaults (won't overwrite existing objects)
  w.save = w.save || {};
  w.session = w.session || {};
  w.state = w.state || { screen:'stage', running:false, overlayMode:null, overlayBusy:false, debug:false };
  w.ui = w.ui || {};
  // convenience refs (if Part1 provided these, use them)
  const ui = {
    overlay: (document.getElementById && document.getElementById('overlay')) || w.ui.overlay,
    overlayPanel: (document.getElementById && document.getElementById('overlayPanel')) || w.ui.overlayPanel,
    gachaOverlay: (document.getElementById && document.getElementById('gachaOverlay')) || w.ui.gachaOverlay,
    gachaAnimContainer: (document.getElementById && document.getElementById('gachaAnimContainer')) || (w.ui.gachaAnimContainer || null),
    uiWaveLabel: (document.getElementById && document.getElementById('uiWaveLabel')) || (w.ui.uiWaveLabel || null)
  };

  // small logging helpers
  function log(...a){ if(w.state && w.state.debug) console.log('[Part3]', ...a); }
  function info(...a){ console.info('[Part3]', ...a); }
  function warn(...a){ console.warn('[Part3]', ...a); }
  function error(...a){ console.error('[Part3]', ...a); }

  /* ========================================
     1) Ensure save defaults for new features
     ======================================== */
  function ensureSaveDefaults(){
    try {
      save.version = save.version || '5.x';
      save.totalXP = typeof save.totalXP === 'number' ? save.totalXP : 0;
      save.totalMoney = typeof save.totalMoney === 'number' ? save.totalMoney : 0;
      save.baseUpgrades = save.baseUpgrades || { atk:0, shield:0, speed:0 };
      save.ownedCards = Array.isArray(save.ownedCards) ? save.ownedCards : [];
      // requested pool sizes
      save.cardPools = save.cardPools || { N:100, R:70, SR:50, SSR:50, XXX:5 };
      // ensure equip/active lists exist
      save.equipped = Array.isArray(save.equipped) ? save.equipped : [];
      save.activeDeck = Array.isArray(save.activeDeck) ? save.activeDeck : [];
      save.equipCapacity = typeof save.equipCapacity === 'number' ? save.equipCapacity : 10;
      // awaken state counts per effectKey/baseId
      save.awakenCounts = save.awakenCounts || {}; // { '<key>': count }
      // map of awakened templates (keeps unique upgraded templates)
      save.awakenedTemplates = save.awakenedTemplates || [];
      // bulk sell history
      save.lastBulkSellAt = save.lastBulkSellAt || 0;
      // choice awakening bookkeeping
      save.choiceAwakenLevels = save.choiceAwakenLevels || {}; // key -> awakenLevel (0,1,2...)
      // challenge multiplier label stored already in Part1: save.settings.challengeMultiplierLabel
      // ensure max wave >= 10
      session.maxWave = Math.max(10, session.maxWave || 10);
      // ensure unit formatting helper exists (we'll not override if one exists)
      if(typeof formatLargeNumber !== 'function'){
        w.formatLargeNumber = function(n){
          if(n === null || typeof n === 'undefined') return '0';
          if(typeof n === 'number'){
            if(!isFinite(n)) return '∞';
            if(Math.abs(n) < 1000) return String(Math.round(n*100)/100);
            if(Math.abs(n) < 1e6) return (Math.round(n)/1000).toFixed(2) + 'k';
            if(Math.abs(n) < 1e8) return Math.round(n/10000) + '万';
            if(Math.abs(n) < 1e12) return Math.round(n/1e8)/10 + '億';
            if(Math.abs(n) < 1e16) return Math.round(n/1e12) + '兆';
            return n.toExponential(3);
          }
          if(typeof n === 'object' && n.m && n.e) return `${n.m}e${n.e}`;
          return String(n);
        };
      }
    } catch(e){ warn('ensureSaveDefaults failed', e); }
  }
  ensureSaveDefaults();

  /* ========================================
     2) Centralize Gacha Cost & Probabilities
     - single cost: max(最低100, floor(totalXP * 0.02))
     - ten cost: max(最低1000, floor(totalXP * 0.20))
     - probabilities: N 90%, R 7%, SR 2.5%, SSR 0.49%, XXX 0.01%
     - pool sizes: ensure in save.cardPools (N100,R70,SR50,SSR50,XXX5)
     - 10連: guarantee at least one SR以上を含める（利便性向上）
  ======================================== */
  const GACHA = {
    minSingleCost: 100,
    minTenCost: 1000,
    singleRate: 0.02,
    tenRate: 0.20,
    probs: [
      { key:'XXX', prob:0.0001 },
      { key:'SSR', prob:0.0049 },
      { key:'SR', prob:0.025 },
      { key:'R', prob:0.07 },
      { key:'N', prob:0.90 }
    ],
    // human-readable order for display
    displayOrder: ['N','R','SR','SSR','XXX']
  };

  function getGachaSingleCost(){
    return Math.max(GACHA.minSingleCost, Math.floor((save.totalXP || 0) * GACHA.singleRate));
  }
  function getGachaTenCost(){
    return Math.max(GACHA.minTenCost, Math.floor((save.totalXP || 0) * GACHA.tenRate));
  }

  // Weighted sample respecting pool counts (and probabilities)
  function weightedRaritySampleByProbAndPool(){
    save.cardPools = save.cardPools || { N:100, R:70, SR:50, SSR:50, XXX:5 };
    // build available list where pool count > 0
    const avail = GACHA.probs.filter(p => (save.cardPools[p.key] || 0) > 0);
    if(avail.length === 0){
      // fallback: refill pools (defensive) - do not auto refill permanently, just for sampling fallback
      warn('gacha pools empty - fallback to N');
      return 'N';
    }
    const total = avail.reduce((s,a)=>s+a.prob, 0);
    let r = Math.random() * total;
    for(const a of avail){
      if(r < a.prob) return a.key;
      r -= a.prob;
    }
    return avail[avail.length-1].key;
  }

  // perform single draw: returns instance or null
  function performGachaSingleInstance(){
    try {
      save.cardPools = save.cardPools || { N:100, R:70, SR:50, SSR:50, XXX:5 };
      const chosen = weightedRaritySampleByProbAndPool();
      const lib = (w.CARD_LIBRARY && CARD_LIBRARY[chosen]) ? CARD_LIBRARY[chosen] : (w.CARD_LIBRARY && CARD_LIBRARY.N ? CARD_LIBRARY.N : null);
      if(!lib || lib.length === 0){
        warn('performGachaSingleInstance: library empty for', chosen);
        return null;
      }
      const templ = lib[Math.floor(Math.random() * lib.length)];
      const inst = { id: `${templ.id}_${Date.now()}`, baseId: templ.id, rarity: templ.rarity || chosen, label: templ.name, desc: templ.desc, effectKey: templ.effectKey, params: Object.assign({}, templ.params || {}), _awakenLevel: templ._awakenLevel || 0 };
      // update save
      save.ownedCards = save.ownedCards || [];
      save.ownedCards.push(inst);
      // decrement pool count (respect chosen)
      save.cardPools[chosen] = Math.max(0, (save.cardPools[chosen] || 0) - 1);
      persistSaveLocal && persistSaveLocal();
      return inst;
    } catch(e){
      error('performGachaSingleInstance failed', e);
      return null;
    }
  }

  // 10連 draw with guarantee: at least one SR or above
  function performGachaMultipleInstances(count){
    const results = [];
    try {
      for(let i=0;i<count;i++){
        results.push(performGachaSingleInstance());
      }
      // guarantee: if count>=10 ensure at least one SR/SSR/XXX
      if(count >= 10){
        const hasHigh = results.some(r => r && (r.rarity === 'SR' || r.rarity === 'SSR' || r.rarity === 'XXX'));
        if(!hasHigh){
          // replace last with forced sample from SR/SSR/XXX pools if available
          const highCandidates = ['SR','SSR','XXX'].filter(k => (save.cardPools[k] || 0) > 0);
          if(highCandidates.length > 0){
            const forcedR = highCandidates[Math.floor(Math.random() * highCandidates.length)];
            // pick template from CARD_LIBRARY[forcedR]
            const lib = (w.CARD_LIBRARY && CARD_LIBRARY[forcedR]) ? CARD_LIBRARY[forcedR] : null;
            if(lib && lib.length){
              const templ = lib[Math.floor(Math.random() * lib.length)];
              const inst = { id: `${templ.id}_${Date.now()}_${Math.floor(Math.random()*1000)}`, baseId: templ.id, rarity: templ.rarity || forcedR, label: templ.name, desc: templ.desc, effectKey: templ.effectKey, params: Object.assign({}, templ.params || {}), _awakenLevel: templ._awakenLevel || 0 };
              // push and decrement pool
              results[results.length-1] = inst;
              save.ownedCards.push(inst);
              save.cardPools[forcedR] = Math.max(0, (save.cardPools[forcedR] || 0) - 1);

          }

  ======================================== */
  function openBulkSellConfirm(){

      panel.appendChild(priceInfo);

      // compute preview
      const sellList = computeBulkSellList();
      preview.innerHTML = `売却予定数: ${sellList.length} 個 / 予想獲得金額: ${formatLargeNumber(sellList.length * pricePer)}`;
      panel.appendChild(preview);

      const doBtn = document.createElement('div'); doBtn.className='btn'; doBtn.style.marginTop='10px'; doBtn.textContent = '実行する';
      doBtn.onclick = () => {

      };

      panel.appendChild(doBtn); panel.appendChild(cancel);
    });

  // compute list of cards to sell (low->high), excluding equipped and SSR/XXX
  function computeBulkSellList(){
    const owned = Array.isArray(save.ownedCards) ? save.ownedCards.slice() : [];
    // filter out equipped ids
    const equippedBaseIds = new Set((save.equipped || []).map(x => x.baseId || x.id));
    // filter targetable
    const candidates = owned.filter(c => {
      if(!c) return false;
      if(equippedBaseIds.has(c.baseId || c.id)) return false;
      if(c.rarity === 'SSR' || c.rarity === 'XXX') return false;
      return true;
    });
    // sort by rarity ascending: N, R, SR
    const rarOrder = { N:0, R:1, SR:2 };
    candidates.sort((a,b) => (rarOrder[a.rarity]||9) - (rarOrder[b.rarity]||9));
    // limit 100
    return candidates.slice(0,100);
  }

  function executeBulkSell(){
    try {
      const list = computeBulkSellList();
      const pricePer = Math.max(1, Math.floor((save.totalMoney || 0) * 0.005));
      // remove these from save.ownedCards (remove first matched instances)
      let removedCount = 0;
      for(const c of list){
        const idx = save.ownedCards.findIndex(x => x.id === c.id);
        if(idx >= 0){
          save.ownedCards.splice(idx,1);
          removedCount++;
        }
      }
      // increase money
      save.totalMoney = (save.totalMoney || 0) + removedCount * pricePer;
      save.lastBulkSellAt = Date.now();
      persistSaveLocal && persistSaveLocal();
      renderDeckBar && renderDeckBar();
      return removedCount;
    } catch(e){ warn('executeBulkSell failed', e); return 0; }
  }

  /* ========================================
     6) 一括覚醒 / 成長選択肢覚醒の実装
     - ルール:
       ・同じ成長選択肢（effectKey + baseId）が 3つ 集まると覚醒できる（消費）
       ・覚醒するとその効果（params）の性能が2倍になる（_awakenLevel++）
       ・覚醒コスト（XP）は基礎100XP、覚醒ごとに 2^level 倍（save.choiceAwakenLevels に記録）
       ・一括覚醒ボタンは "ガチャの下" に設置済み（injectUpgradePanelEnhancements）
  ======================================== */
  function openBulkAwakenPanel(){
    openOverlay('bulkAwaken', (panel) => {
      panel.innerHTML = '';
      const title = document.createElement('div'); title.style.fontWeight='900'; title.textContent = '一括覚醒（成長選択肢）';
      panel.appendChild(title);
      const info = document.createElement('div'); info.className='small'; info.style.marginTop='8px';
      info.textContent = '同一の成長選択肢（effectKey + baseId）が3つあると覚醒できます。覚醒により性能が2倍になります。覚醒コストは基礎100XPで、覚醒回数ごとに2倍になります。';
      panel.appendChild(info);

      // compute groups
      const groups = {};
      for(const c of (save.ownedCards || [])){
        if(!c || !c.effectKey) continue;
        const key = `${c.effectKey}::${c.baseId||c.id}`;
        groups[key] = groups[key] || [];
        groups[key].push(c);
      }

      const listWrap = document.createElement('div'); listWrap.style.marginTop='12px';
      let any = false;
      Object.keys(groups).forEach(k => {
        const arr = groups[k];
        if(arr.length >= 3){
          any = true;
          const sample = arr[0];
          const label = sample.label || sample.name || sample.baseId || sample.id;
          const row = document.createElement('div'); row.className='card'; row.style.marginBottom='8px';
          const level = save.choiceAwakenLevels[k] || 0;
          const cost = Math.ceil(100 * Math.pow(2, level));
          row.innerHTML = `<div style="font-weight:800">${label}（効果: ${sample.effectKey}）</div><div class="small">所持数: ${arr.length} / 覚醒済み: Lv${level} / 覚醒コスト: ${formatLargeNumber(cost)} XP</div>`;
          const btnRow = document.createElement('div'); btnRow.style.display='flex'; btnRow.style.gap='8px'; btnRow.style.marginTop='8px';
          const awakenBtn = document.createElement('div'); awakenBtn.className='btn'; awakenBtn.textContent='覚醒する（3枚消費）';
          awakenBtn.onclick = () => {
            if((save.totalXP || 0) < cost){ showMessage('累計XPが足りません'); return; }
            // consume 3 cards of this group (prefer lower upgraded ones)
            let removed = 0;
            for(let i=save.ownedCards.length-1;i>=0 && removed<3;i--){
              const c = save.ownedCards[i];
              if((c.effectKey + '::' + (c.baseId||c.id)) === k){
                save.ownedCards.splice(i,1);
                removed++;
              }
            }
            // create awakened template/instance: double params of sample and register awakened level
            const newInst = JSON.parse(JSON.stringify(sample));
            newInst._awakenLevel = (newInst._awakenLevel||0) + 1;
            // double numeric params (pct/amt)
            if(newInst.params){
              if(typeof newInst.params.pct === 'number') newInst.params.pct = newInst.params.pct * Math.pow(2,1);
              if(typeof newInst.params.amt === 'number') newInst.params.amt = Math.ceil(newInst.params.amt * Math.pow(2,1));
            }
            // name it as awakened
            newInst.label = `${newInst.label || newInst.name || newInst.id} (+覚醒Lv${newInst._awakenLevel})`;
            newInst.id = `${newInst.baseId||newInst.id}_awaken_${Date.now()}`;
            // push awakened instance into ownedCards
            save.ownedCards.push(newInst);
            // pay cost
            save.totalXP -= cost;
            // increment choiceAwakenLevels
            save.choiceAwakenLevels[k] = (save.choiceAwakenLevels[k] || 0) + 1;
            persistSaveLocal && persistSaveLocal();
            showMessage('覚醒しました', ()=>{ openBulkAwakenPanel(); });
          };
          btnRow.appendChild(awakenBtn);
          row.appendChild(btnRow);
          listWrap.appendChild(row);
        }
      });

      if(!any){
        const none = document.createElement('div'); none.className='small'; none.style.marginTop='12px'; none.textContent = '覚醒可能な組合せが見つかりません（同一効果が3枚必要）';
        listWrap.appendChild(none);
      }

      panel.appendChild(listWrap);
      const closeBtn = document.createElement('div'); closeBtn.className='btn'; closeBtn.style.marginTop='12px'; closeBtn.textContent='閉じる'; closeBtn.onclick = () => { closeOverlay(); };
      panel.appendChild(closeBtn);
    });
  }

  /* ========================================
     8) SR / SSR 強化ルール（テンポラリ強化）
     - 要求: SR, SSR を完全リニューアルして超強化する
     - 実装方針: CARD_LIBRARY の SR/SSR テンプレパラメータを拡張（安全なスケーリング）
     - 注意: 既に永続カードやセッションに影響するため、大きくやりすぎない（けれど強化する）
  ======================================== */
  function enhanceHighRarityTemplates(){
    try {
      if(!w.CARD_LIBRARY) return;

      const SR_PCT_SCALE = 1.8;
      const SR_AMT_SCALE = 2;
      const SSR_PCT_SCALE = 3.0;
      const SSR_AMT_SCALE = 4;

      // SR
      if(Array.isArray(CARD_LIBRARY.SR)){
        CARD_LIBRARY.SR.forEach(t => {
          if(t.params){
            if(typeof t.params.pct === 'number') t.params.pct = t.params.pct * SR_PCT_SCALE;
            if(typeof t.params.amt === 'number') t.params.amt = Math.ceil(t.params.amt * SR_AMT_SCALE);
            // add extra potency for special SR types
            if(t.effectKey === 'explode10'){ t.params.dmgMul = (t.params.dmgMul||1) * 1.6; t.params.chance = Math.min(1, (t.params.chance||0.3)*1.2); }
            if(t.effectKey === 'area_pulse'){ t.params.dmg = Math.ceil((t.params.dmg||60) * 1.9); t.params.interval = Math.max(800, (t.params.interval||4000) * 0.85); }
            if(t.effectKey === 'high_risk_high_reward'){ t.params.atkMul = (t.params.atkMul||1.6) * 1.6; t.params.shieldMul = Math.max(0.2, (t.params.shieldMul||0.7)*0.9); }
          }
        });
      }

      // SSR
      if(Array.isArray(CARD_LIBRARY.SSR)){
        CARD_LIBRARY.SSR.forEach(t => {
          if(t.params){
            if(typeof t.params.pct === 'number') t.params.pct = t.params.pct * SSR_PCT_SCALE;
            if(typeof t.params.amt === 'number') t.params.amt = Math.ceil(t.params.amt * SSR_AMT_SCALE);
            // SSR special boosts
            if(t.effectKey === 'all_dir_shot'){ t.params.burst = Math.min(48, (t.params.burst||12) * 2); t.params.dmgMul = (t.params.dmgMul||1) * 1.25; }
            if(t.effectKey === 'xp_gain_double'){ t.params.mul = Math.max(2, (t.params.mul||2) * 2); }
            if(t.effectKey === 'self_buff'){ t.params.atkMul = Math.max(2.5, (t.params.atkMul||2.5) * 1.8); t.params.dur = Math.max(4000, (t.params.dur||4000) * 1.2); }
            if(t.effectKey === 'wave_cannon'){ t.params.dmgMul = Math.max(4, (t.params.dmgMul||4) * 2.0); t.params.charge = Math.max(2, (t.params.charge||3)); }
          }
        });
      }
      // XXX (ultra) - leave templates as-is except they have monster effects already
      info('enhanceHighRarityTemplates applied');
    } catch(e){ warn('enhanceHighRarityTemplates failed', e); }
  }
  enhanceHighRarityTemplates();

  /* ========================================
     9) Small utilities / exposure
     ======================================== */
  function persistSaveLocalSafe(){
    try { persistSaveLocal && persistSaveLocal(); } catch(e){ try{ localStorage.setItem('grow_stg_save_v5', JSON.stringify(save)); } catch(_){ warn('persistSave fallback failed'); } }
  }
  // expose some helpers
  w._part3 = w._part3 || {};

  });

  info('Part3 patch loaded: gacha/pools/costs, bulk-sell, bulk-awaken, SR/SSR enhancement installed.');
})();

<script>

  適用方法:

*/

(function Part4Patch(){
  'use strict';

  // -----------------------
  // 安全確認 & shorthand
  // -----------------------
  if(typeof window === 'undefined') return;

  };

  const info = (...a) => { console.info('[Part4]', ...a); };
  const warn = (...a) => { console.warn('[Part4]', ...a); };
  const error = (...a) => { console.error('[Part4]', ...a); };

  // -----------------------
  // 設定（調整可）
  // -----------------------

  // -----------------------
  function safePersistSave(){
    try { if(typeof persistSaveLocal === 'function') persistSaveLocal(); else localStorage.setItem('grow_stg_save_v5', JSON.stringify(save)); } catch(e){ warn('persistSave failed', e); }
  }

  // -----------------------
  // ヘルパ: 現在のプレイヤ確保
  // -----------------------

  function pushShieldHitEffect(pos, amt){

      effects = effects || [];

        });

    } catch(e){ warn('pushShieldHitEffect failed', e); }
  }

  // -----------------------
  // 元の関数を破壊しないラップ（バックアップ）
  // -----------------------
  const orig_handleSpawn = (typeof handleSpawn === 'function') ? handleSpawn : null;
  const orig_startWave = (typeof startWave === 'function') ? startWave : null;
  const orig_startPlay = (typeof startPlay === 'function') ? startPlay : null;
  const orig_update = (typeof update === 'function') ? update : null;
  const orig_draw = (typeof draw === 'function') ? draw : null;
  const orig_openLevelUpChoices = (typeof openLevelUpChoices === 'function') ? openLevelUpChoices : null;
  const orig_openOverlay = (typeof openOverlay === 'function') ? openOverlay : null;
  const orig_closeOverlay = (typeof closeOverlay === 'function') ? closeOverlay : null;

  // -----------------------
  // 非ブロッキングオーバーレイ（openOverlaySafe / closeOverlaySafe）
  // - オーバーレイを開いても state.running を false にしない設計
  // - overlayBusy は競合防止に使うが、長時間停止した場合 watchdog が解除する
  // -----------------------
  function openOverlaySafe(mode, builder){
    try {
      // 競合を防止（だが overlayBusy=true が長時間続く場合は watchdog が解除する）
      if(state.overlayBusy){
        log('openOverlaySafe: overlayBusy true, queueing open for', mode);
        // queue minimal attempt later
        setTimeout(()=>{ openOverlaySafe(mode, builder); }, 80);
        return;
      }
      state.overlayBusy = true;
      state.overlayMode = mode;
      // prefer existing openOverlay to keep visual style, but ensure we don't let it pause game
      if(typeof orig_openOverlay === 'function'){
        try {
          orig_openOverlay(mode, (panel)=>{
            try {
              // builder should not set state.running=false; ensure overlay interacts safely
              builder(panel);
            } catch(e){ error('openOverlaySafe builder threw', e); panel.innerHTML = `<div style="font-weight:900">エラー</div><div class="small">${String(e)}</div><div style="margin-top:8px" class="btn" id="part4_overlay_close">閉じる</div>`; const btn = document.getElementById('part4_overlay_close'); if(btn) btn.onclick = () => closeOverlaySafe(); }
            finally {
              // keep state.running untouched (non-blocking). Clear busy to allow subsequent overlays.
              state.overlayBusy = false;
            }
          });
          return;
        } catch(e){ warn('orig_openOverlay threw, fallback to manual overlay', e); }
      }
      // fallback manual overlay DOM
      if(ui.overlay && ui.overlayPanel){
        ui.overlay.style.display = 'flex';
        ui.overlay.setAttribute('aria-hidden', 'false');
        ui.overlayPanel.innerHTML = '';
        try { builder(ui.overlayPanel); } catch(e){ ui.overlayPanel.innerHTML = `<div style="font-weight:900">エラー</div><div class="small">${String(e)}</div><div style="margin-top:8px" class="btn" id="part4_overlay_close2">閉じる</div>`; const btn = document.getElementById('part4_overlay_close2'); if(btn) btn.onclick = () => closeOverlaySafe(); }
      } else {
        warn('openOverlaySafe: no overlay DOM found');
      }
    } catch(e){ error('openOverlaySafe failed', e); state.overlayBusy = false; }
  }

  function closeOverlaySafe(){
    try {
      if(typeof orig_closeOverlay === 'function'){
        try { orig_closeOverlay(); } catch(e){ warn('orig_closeOverlay threw', e); }
      } else {
        if(ui.overlay){
          ui.overlay.style.display = 'none';
          ui.overlay.setAttribute('aria-hidden','true');
          if(ui.overlayPanel) ui.overlayPanel.innerHTML = '';
        }
      }
    } catch(e){ warn('closeOverlaySafe dom error', e); }
    state.overlayMode = null;
    state.overlayBusy = false;
    // Do NOT forcibly change state.running here; leave that decision to caller or overlay skip handler
  }

  // expose safe overlay
  w.openOverlaySafe = openOverlaySafe;
  w.closeOverlaySafe = closeOverlaySafe;

  // -----------------------
  // openLevelUpChoices を non-blocking でラップ（キュー方式）
  // - 既存の openLevelUpChoices がある場合はそれを使いつつ、失敗してもゲームが止まらないようフェイルセーフを用意
  // - 表示は行うが state.running を false にしない（ただし UI 上の操作時にプレイヤ入力を抑制したければ overlayMode を使う）
  // -----------------------
  w._part4_rewardQueue = w._part4_rewardQueue || [];
  let _processingRewardQueue = false;

  function processRewardQueueOnce(){
    if(_processingRewardQueue) return;
    if(!w._part4_rewardQueue || w._part4_rewardQueue.length === 0) return;
    _processingRewardQueue = true;
    const item = w._part4_rewardQueue.shift();
    try {
      // try to call original openLevelUpChoices if available
      if(typeof orig_openLevelUpChoices === 'function'){
        try {
          // call original but ensure it does not forcibly pause the game; if original does, fallback UI will be used

      // fallback safe UI (non-blocking): uses openOverlaySafe and ensures skip resumes gameplay
      safeLevelUpPanel(item.num || 1, item.opts || {});
    } catch(e){
      warn('processRewardQueueOnce failed', e);
    } finally {
      _processingRewardQueue = false;
    }
  }

  function safeLevelUpPanel(num=1, opts={}){

      openOverlaySafe('levelUp', (panel) => {
        panel.innerHTML = '';
        const title = document.createElement('div'); title.style.fontWeight='900'; title.style.fontSize='18px';
        title.textContent = (opts.origin === 'waveClear') ? 'Waveクリア報酬 — 効果を選択' : (opts.origin === 'kill') ? '撃破ボーナス — 効果を選択' : 'レベルアップ — 効果を選択';

        const btnRow = document.createElement('div'); btnRow.style.display='flex'; btnRow.style.gap='8px'; btnRow.style.marginTop='12px';

  // public wrapper: enqueue a reward panel request

  // -----------------------
  // startWave / startPlay のラップ

  // - startPlay は player reset 後に startWave(1) を確実に実行
  // -----------------------
  w.startWave = function(waveNum){

      try {
        session.currentStage = stageNumber || session.currentStage || 1;

        session.stageDifficultyMultiplier = session.stageDifficultyMultiplier || 1;

  }

  // -----------------------
  // handleSpawn のラップ（既存の spawn ロジック尊重しつつ補強）
  // - orig_handleSpawn がある場合はそれを優先。ただし waveState 管理や spawnTimer を堅牢化
  // -----------------------
  w.handleSpawn = function(dt){
    try {
      // if original exists, call it but protect against it throwing and leaving waveState inconsistent
      if(typeof orig_handleSpawn === 'function'){
        try {
          orig_handleSpawn(dt);
          return;
        } catch(e){ warn('orig_handleSpawn threw, falling back to patched spawn logic', e); }
      }
      // fallback spawn logic (safe minimal)
      if(session.waveState !== 'spawning' && session.waveState !== 'active') return;
      // boss waves logic if any: preserve behavior if wave % 5 === 0
      if(session.wave % 5 === 0){
        if(session.waveState === 'spawning' && session.spawnedCount === 0){
          const mul = session.stageDifficultyMultiplier || 1;
          const bossHp = Math.max(1, Math.floor((800 + (session.currentStage||1) * 120 + session.wave * 300) * mul));
          if(typeof spawnBoss === 'function') spawnBoss({ x:(w.CANVAS_W||540)/2, y:80, hp: bossHp, vx:28, shootInterval:900 });
          session.spawnedCount = 1;
          session.waveState = 'active';

      // normal wave
      session.spawnTimer = (session.spawnTimer || 0) + dt;
      // compute a safe template if baseWaveTemplate exists
      let cfg = null;
      try { if(typeof baseWaveTemplate === 'function') cfg = baseWaveTemplate(session.currentStage || 1, session.wave); } catch(e){ warn('baseWaveTemplate threw', e); }
      if(!cfg){
        // fallback values
        const stage = session.currentStage || 1;
        const wave = session.wave || 1;
        cfg = { count: 4 + Math.min(20, Math.floor(stage/2)) + (wave-1)*2, hp: Math.max(60, Math.floor(80 + stage*20 + wave*30)), speed: Math.min(80, 18 + Math.floor(stage/6) + wave*2), spawnInterval: Math.max(420, 1100 - wave*60) };
      }
      while((session.spawnedCount || 0) < (cfg.count || 1) && session.spawnTimer >= (cfg.spawnInterval || 900)){
        session.spawnTimer -= (cfg.spawnInterval || 900);
        session.spawnedCount = (session.spawnedCount || 0) + 1;
        const mul = session.stageDifficultyMultiplier || 1;
        const ex = (typeof randRange === 'function') ? Math.floor(randRange(30, (w.CANVAS_W || 540)-30)) : Math.floor(Math.random() * ((w.CANVAS_W || 540)-60)) + 30;
        const hp = Math.max(1, Math.floor((cfg.hp || 100) * mul));
        if(typeof spawnEnemy === 'function') spawnEnemy({ x:ex, y:-40, hp, speed: cfg.speed || 20 });
        if((session.spawnedCount || 0) >= (cfg.count || 1)) session.waveState = 'active';
      }
    } catch(e){ error('patched handleSpawn failed', e); }
  };

  // -----------------------
  // Wave transition handler
  // - session.waveState === 'cleared' になったら session.nextWaveTimer をカウントダウンして次 wave を開始
  // - overlay が開いていてもタイマーは動き続ける
  // -----------------------
  function handleWaveTransitions(dt){
    try {
      if(session.waveState !== 'cleared') return;
      session.nextWaveTimer = (typeof session.nextWaveTimer === 'number') ? session.nextWaveTimer - dt : (WAVE_TRANSITION_DELAY - dt);
      if(session.nextWaveTimer <= 0){
        session.nextWaveTimer = null;
        const next = (session.wave || 1) + 1;
        const maxW = session.maxWave || 10;
        if(next <= maxW){
          startWave(next);
          state.running = true;
        } else {
          // end-run
          try { if(typeof onGameEnd === 'function') onGameEnd(true); else state.running = false; } catch(e){ warn('onGameEnd threw', e); state.running = false; }
        }
      }
    } catch(e){ warn('handleWaveTransitions failed', e); }
  }

  // -----------------------
  // update のラップ：orig_update 後に追加チェック（シールド・wave clear 検出・遷移タイマ）
  // - 重要: この update は state.running が true の場合に呼ばれる設計を想定（mainLoop が制御）
  // -----------------------
  w.update = function(dt){
    // 1) call original update to keep base behavior
    try {
      if(typeof orig_update === 'function'){
        orig_update(dt);
      } else {
        // if no orig, call our patched handleSpawn & minimal movement/collisions
        try { handleSpawn(dt); } catch(e){ warn('fallback handleSpawn threw', e); }
      }
    } catch(e){ warn('orig update threw', e); /* continue with our protections */ }

    // 2) shield/dome collision interception (enemyBullets and enemies hitting dome)
    try {
      if(SHIELD_DOME.enabled && player && player.shield > 0){
        const r = getShieldRadius();
        const cx = player.x || ((w.CANVAS_W||540)/2);
        const cy = (player.y || (w.CANVAS_H||960) - 80) - 8;
        // enemy bullets
        if(Array.isArray(enemyBullets)){
          for(let i = enemyBullets.length - 1; i >= 0; i--){
            const b = enemyBullets[i];
            if(!b) continue;
            const dx = b.x - cx, dy = b.y - cy;
            if(dx*dx + dy*dy <= r*r){
              const dmg = b.damage || 10;
              player.shield = Math.max(0, (player.shield || 0) - dmg);
              pushShieldHitEffect({ x:b.x, y:b.y }, dmg);
              enemyBullets.splice(i,1);
              if(player.shield <= 0){ player.shield = 0; try{ onGameEnd(false); }catch(e){}; return; }
            }
          }
        }
        // enemies colliding with dome are destroyed (absorbed) and damage shield
        if(Array.isArray(enemies)){
          for(let i = enemies.length - 1; i >= 0; i--){
            const e = enemies[i];
            if(!e) continue;
            const dx = e.x - cx, dy = e.y - cy;
            if(dx*dx + dy*dy <= r*r){
              const dmg = e.damage || Math.max(10, Math.floor((e.maxHp||100)/10));
              const absorbed = Math.min(dmg, player.shield || 0);
              player.shield = Math.max(0, (player.shield || 0) - absorbed);
              pushShieldHitEffect({ x:e.x, y:e.y }, absorbed);
              // award small XP for auto-defeat if applicable
              try { if(typeof onEnemyDefeated === 'function') onEnemyDefeated(e); else giveXP && giveXP(10); } catch(e){ warn('onEnemyDefeated during dome collide failed', e); }
              enemies.splice(i,1);
              if(player.shield <= 0){ player.shield = 0; try{ onGameEnd(false); }catch(e){}; return; }
            }
          }
        }
      }
    } catch(e){ warn('shield/dome handling failed', e); }

    // 3) wave clear detection (robust)
    try {
      if(session.waveState === 'active'){
        const noEnemies = !(Array.isArray(enemies) && enemies.length > 0);
        const noEnemyBullets = !(Array.isArray(enemyBullets) && enemyBullets.length > 0);
        if(noEnemies && noEnemyBullets){
          // set cleared only once
          if(session.waveState !== 'cleared'){
            session.waveState = 'cleared';
            session.nextWaveTimer = WAVE_TRANSITION_DELAY;
            session._waveClearedAt = performance && performance.now ? performance.now() : Date.now();
            // give wave clear XP safely
            try { giveXP && giveXP(50 * (session.stageDifficultyMultiplier || 1)); } catch(e){ warn('giveXP failed', e); }
            // enqueue reward UI non-blocking
            w.openLevelUpChoicesSafe && w.openLevelUpChoicesSafe(1, { origin:'waveClear' });
          }
        }
      }
    } catch(e){ warn('wave clear detection failed', e); }

    // 4) advance wave transition timers even if overlay open
    try { handleWaveTransitions(dt); } catch(e){ warn('handleWaveTransitions threw', e); }

    // 5) ensure UI updates (in case original update didn't)
    try { if(typeof updateUI === 'function') updateUI(); } catch(e){ /* ignore */ }
  };

  // -----------------------
  // draw のラップ：既存の draw 呼び出し後にドーム/シールド描画・エフェクトを上書き描画
  // -----------------------
  w.draw = function(){
    try {
      if(typeof orig_draw === 'function'){
        orig_draw();
      } else {
        // minimal fallback clear
        if(ui.canvas && ui.canvas.getContext){
          const _ctx = ui.canvas.getContext('2d');
          if(_ctx) { _ctx.clearRect(0,0,ui.canvas.width, ui.canvas.height); }
        }
      }
    } catch(e){ warn('orig draw threw', e); }

    // overlay dome and shield indicators
    try {
      const ctx = (ui.canvas && ui.canvas.getContext) ? ui.canvas.getContext('2d') : (typeof window.ctx !== 'undefined' ? window.ctx : null);
      if(!ctx || !player) return;
      if(SHIELD_DOME.enabled && player.shield > 0){
        const r = getShieldRadius();
        const cx = player.x || ((w.CANVAS_W||540)/2);
        const cy = (player.y || (w.CANVAS_H||960)-80) - 8;
        // dome
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx - r, cy);
        ctx.arc(cx, cy, r, Math.PI, 0, false);
        ctx.lineTo(cx + r, cy + r*0.25);
        ctx.lineTo(cx - r, cy + r*0.25);
        ctx.closePath();
        ctx.fillStyle = SHIELD_DOME.colorFill;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.PI, 0, false);
        ctx.strokeStyle = SHIELD_DOME.colorStroke;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // shield bar above player
        const pct = Math.max(0, (player.shield || 0) / Math.max(1, player.shieldMax || 5000));
        ctx.save();
        const bw = 90;
        const bh = 8;
        const bx = cx - bw/2;
        const by = player.y - (player.r || 18) - 30;
        roundRect(ctx, bx, by, bw, bh, 6);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fill();
        ctx.fillStyle = 'rgba(120,200,255,0.95)';
        roundRect(ctx, bx, by, Math.max(6, bw * pct), bh, 6);
        ctx.fill();
        ctx.restore();
      }
      // render shield effects from effects list
      if(Array.isArray(effects)){
        for(const fx of effects.slice()){
          try {
            if(!fx) continue;
            if(fx.type === 'shieldFlash'){
              const alpha = Math.max(0, (fx.ttl||0) / (fx.maxTtl||1));
              ctx.beginPath();
              ctx.fillStyle = `rgba(140,200,255,${0.45 * alpha})`;
              ctx.arc(fx.x, fx.y, 28 + (1-alpha) * 18, 0, Math.PI*2);
              ctx.fill();
            } else if(fx.type === 'shieldParticle'){
              const alpha = Math.max(0.12, (fx.ttl||0) / (fx.maxTtl||1));
              ctx.beginPath();
              ctx.fillStyle = `rgba(140,200,255,${0.9 * alpha})`;
              ctx.ellipse(fx.x, fx.y, fx.r || 3, fx.r || 3, 0, 0, Math.PI*2);
              ctx.fill();
            }
          } catch(e){ /* ignore per-effect errors */ }
        }
      }
    } catch(e){ warn('draw enhancements failed', e); }
  };

  // -----------------------
  // 強化: openLevelUpChoices の既存実装がゲームを停止させる場合の対処
  // - 既に orig_openLevelUpChoices があり、それが state.running=false を行う場合は
  //   我々の openLevelUpChoicesSafe を優先的に使うよう外部から呼び出すことを推奨
  // -----------------------
  // (既に openLevelUpChoicesSafe が上で定義済み)

  // -----------------------
  // overlayBusy watchdog（長時間 overlayBusy が true の時に強制解除）
  // -----------------------
  (function installOverlayWatchdog(){
    let busySince = null;
    setInterval(()=> {
      try {
        if(state && state.overlayBusy){
          if(!busySince) busySince = Date.now();
          else {
            if(Date.now() - busySince > WATCHDOG_MAX_BUSY_MS){
              warn('overlayBusy watchdog triggered - forcing close');
              // try click close buttons inside overlayPanel first
              try {
                const panel = ui.overlayPanel || (document.getElementById && document.getElementById('overlayPanel'));
                if(panel){
                  const btns = panel.querySelectorAll('.btn,button');
                  for(const b of btns){
                    const txt = (b.textContent||'').trim();
                    if(txt === 'スキップ' || txt === '閉じる' || txt === 'OK' || txt === 'キャンセル'){
                      try{ b.click(); } catch(e){ /* ignore */ }
                    }
                  }
                }
              } catch(e){ /* ignore */ }
              // fallback: closeOverlaySafe and resume
              try { closeOverlaySafe(); } catch(e){ /* ignore */ }
              state.overlayBusy = false;
              state.overlayMode = null;
              state.running = true;
              busySince = null;
            }
          }
        } else {
          busySince = null;
        }
      } catch(e){ /* ignore watchdog errors */ }
    }, 800);
  })();

  // -----------------------
  // reward queue drainer: ゲームが実行中でもキューを慎重に処理する
  // -----------------------
  (function installRewardQueueDrainer(){
    setInterval(()=>{
      try {
        if(w._part4_rewardQueue && w._part4_rewardQueue.length > 0){
          // if overlay not shown or running true, process one
          if(!state.overlayMode || state.running){
            processRewardQueueOnce();
          }
        }
      } catch(e){ /* ignore */ }
    }, 300);
  })();

  // -----------------------
  // 最終ブート処理（セッション整合）
  // -----------------------
  (function bootChecks(){
    try {
      if(typeof session.wave === 'undefined' || session.wave < 1) session.wave = 1;
      if(!session.waveState || session.waveState === 'idle') { session.waveState = 'spawning'; session.spawnTimer = 0; session.spawnedCount = 0; }
      // ensure main loop exists (we don't override mainLoop; we assume Part1 provides one)
      log('Part4 bootChecks', 'wave', session.wave, 'waveState', session.waveState, 'maxWave', session.maxWave);
    } catch(e){ warn('Part4 boot checks failed', e); }
  })();

  // -----------------------
  // パッチ公開（デバッグ/手動制御用）
  // -----------------------
  w._part4 = w._part4 || {};
  Object.assign(w._part4, {
    openOverlaySafe, closeOverlaySafe, processRewardQueueOnce, safeLevelUpPanel, handleWaveTransitions,
    repairShield: function(){ ensurePlayer(); player.shield = player.shieldMax; if(typeof updateUI === 'function') updateUI(); },
    setWave: function(w){ session.wave = w; startWave(w); }
  });

  info('Part4 patch applied: wave stabilization, non-blocking overlays, shield dome protections installed.');

})();
</script>
<script>
/*
  Part5 — イースターエッグ通知パッチ（長く・丁寧）
  概要:
    - 条件を満たしたとき（チャレンジ倍率が "10^200" 系かつステージ30 をクリアし、
      実行日時が 2026-02-01 〜 2026-02-15 の間）にのみ、専用の報酬メッセージを表示します。
    - 表示はページ内オーバーレイ（既存の openOverlay / openOverlaySafe があればそれを活用）で行い、
      メッセージ本文と「開く」ボタン（指定 URL を new tab で開く）を設置します。
    - 表示は一度きり（save._part5_shown フラグ）で、再表示を防止します。
    - 既存の onGameEnd / startPlay 等を壊さないように、ラップ（バックアップ→呼び出し→拡張）します。
    - ログ・防護処理を充実させ、想定外の環境でも詰まらないように配慮しています。
  使い方:
    - Part1..Part4 の後にこのスクリプトを読み込んでください。
    - そのまま貼るだけで動作します（既存のグローバル関数を呼び出す設計）。
*/

(function Part5Egg(){
  'use strict';

  if(typeof window === 'undefined') return;
  const w = window;

  // ------------- 設定 -------------
  const EGG_URL = 'https://codepen.io/Yuyuyuyuyiko/pen/JoKLJNv'; // ユーザー指定の開けるURL
  const MESSAGE_JP = 'あなたは隠された機能を解放し、この世界の頂点に到達しました。よって褒美です。';
  // 日付ウィンドウ（JST: +09:00）2026-02-01 00:00 ～ 2026-02-15 23:59:59
  const WINDOW_START_MS = Date.parse('2026-02-01T00:00:00+09:00');
  const WINDOW_END_MS   = Date.parse('2026-02-15T23:59:59+09:00');

  // ------------- ヘルパ -------------
  function nowMs(){ try { return Date.now(); } catch(e) { return (new Date()).getTime(); } }

  function inDateWindow(){
    try {
      const t = nowMs();
      return (t >= WINDOW_START_MS && t <= WINDOW_END_MS);
    } catch(e){
      console.warn('[Part5] inDateWindow error', e);
      return false;
    }
  }

  // チャレンジラベルが 10^200 系かどうか判定する (柔軟に substring を使う)
  function isChallenge10e200(){
    try {
      // 複数の場所をチェック: save.settings.challengeMultiplierLabel, session.challengeLabel, session.stageDifficultyMultiplierLabel
      const candidates = [];
      try { if(w.save && w.save.settings && typeof w.save.settings.challengeMultiplierLabel === 'string') candidates.push(w.save.settings.challengeMultiplierLabel); } catch(_) {}
      try { if(w.session && typeof w.session.challengeLabel === 'string') candidates.push(w.session.challengeLabel); } catch(_) {}
      try { if(w.session && typeof w.session.challengeMultiplierLabel === 'string') candidates.push(w.session.challengeMultiplierLabel); } catch(_) {}
      // also check session or save numeric/exponent representations (some parts store exponent)
      try { if(w.save && w.save.settings && w.save.settings.challengeExponent) candidates.push(String(w.save.settings.challengeExponent)); } catch(_) {}
      // normalize and test
      for(const s of candidates){
        if(!s) continue;
        const lowered = String(s).toLowerCase();
        if(lowered.indexOf('10^200') !== -1) return true;
        if(lowered.indexOf('10e200') !== -1) return true;
        if(lowered.indexOf('10^200 x') !== -1) return true;
        if(lowered.indexOf('200') !== -1 && lowered.indexOf('10') !== -1 && lowered.indexOf('^') !== -1) {
          // heuristic, but keep conservative
          if(/10\^?200/.test(s)) return true;
        }
      }
      // If label not found, check if any saved selection contains exponent field equal to 200
      if(w.save && w.save.settings && typeof w.save.settings.challengeMultiplierLabel === 'object' && w.save.settings.challengeMultiplierLabel.exponent === 200) return true;
      return false;
    } catch(e){
      console.warn('[Part5] isChallenge10e200 error', e);
      return false;
    }
  }

  // ------------- 安全なオーバーレイ表示ユーティリティ -------------
  // 既に Part4 で openOverlaySafe/closeOverlaySafe が定義されていることを想定していますが、
  // なければ既存の openOverlay を使い、なければ最小限のモーダルを作ります。
  function showEggOverlay(){
    try {
      // prevent duplicate showing in same runtime if save flag not yet persisted
      if(w.save && w.save._part5_shown) {
        console.log('[Part5] egg already shown (save flag present). skip.');
        return;
      }

      const builder = (panel) => {
        panel.innerHTML = '';
        const title = document.createElement('div'); title.style.fontWeight='900'; title.style.fontSize='18px'; title.style.marginBottom='8px';
        title.textContent = '隠し機能解除';
        panel.appendChild(title);

        const msg = document.createElement('div'); msg.className = 'small'; msg.style.marginBottom = '12px';
        msg.textContent = MESSAGE_JP;
        panel.appendChild(msg);

        // "開く" ボタン — 指定 URL を新しいタブで開く
        const openBtn = document.createElement('div'); openBtn.className = 'btn'; openBtn.style.marginBottom = '8px';
        openBtn.textContent = '褒美を開く';
        openBtn.onclick = () => {
          try {
            window.open(EGG_URL, '_blank', 'noopener');
          } catch(e){ console.warn('[Part5] openBtn window.open failed', e); }
        };
        panel.appendChild(openBtn);

        // 直接リンク（アクセシビリティ）— ユーザーの指示どおり「表示メッセージではない」ので目立たせすぎず設置
        const linkRow = document.createElement('div'); linkRow.className = 'small'; linkRow.style.marginTop='6px';
        const anchor = document.createElement('a'); anchor.href = EGG_URL; anchor.target = '_blank'; anchor.rel = 'noopener'; anchor.textContent = '褒美（外部リンク）を開く';
        anchor.style.color = '#9ae6ff';
        linkRow.appendChild(anchor);
        panel.appendChild(linkRow);

        // 閉じる
        const closeBtn = document.createElement('div'); closeBtn.className = 'btn'; closeBtn.style.marginTop='12px'; closeBtn.textContent = '閉じる';
        closeBtn.onclick = () => { try { if(typeof closeOverlaySafe === 'function') closeOverlaySafe(); else if(typeof closeOverlay === 'function') closeOverlay(); } catch(e){} };
        panel.appendChild(closeBtn);
      };

      // use safe overlay if available
      if(typeof w.openOverlaySafe === 'function'){
        w.openOverlaySafe('part5_egg', builder);
      } else if(typeof w.openOverlay === 'function'){
        try { w.openOverlay('part5_egg', builder); } catch(e){ createMinimalOverlay(builder); }
      } else {
        createMinimalOverlay(builder);
      }

      // mark shown in save so it won't reappear across sessions
      try {
        w.save = w.save || {};
        w.save._part5_shown = true;
        if(typeof safePersistSave === 'function') safePersistSave();
        else {
          try { localStorage.setItem('grow_stg_save_v5', JSON.stringify(w.save)); } catch(e){ console.warn('[Part5] persist fallback failed', e); }
        }
      } catch(e){ console.warn('[Part5] mark shown failed', e); }

    } catch(e){
      console.error('[Part5] showEggOverlay failed', e);
    }
  }

  // 最低限の overlay 作成（openOverlay が無い環境用）
  function createMinimalOverlay(builder){
    try {
      let overlay = document.getElementById('part5_min_overlay');
      if(!overlay){
        overlay = document.createElement('div');
        overlay.id = 'part5_min_overlay';
        overlay.style.position = 'fixed';
        overlay.style.left = 0;
        overlay.style.top = 0;
        overlay.style.right = 0;
        overlay.style.bottom = 0;
        overlay.style.display = 'flex';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.background = 'rgba(0,0,0,0.6)';
        overlay.style.zIndex = 9999;
        const panel = document.createElement('div');
        panel.id = 'part5_min_panel';
        panel.style.background = 'linear-gradient(180deg,#08202b,#05262b)';
        panel.style.padding = '14px';
        panel.style.borderRadius = '12px';
        panel.style.width = 'min(680px,92%)';
        panel.style.maxHeight = '80vh';
        panel.style.overflow = 'auto';
        overlay.appendChild(panel);
        document.body.appendChild(overlay);
      }
      const panel = document.getElementById('part5_min_panel');
      if(panel){
        try { builder(panel); } catch(e){ panel.innerHTML = `<div style="font-weight:900">エラー</div><div class="small">${String(e)}</div><div style="margin-top:8px" class="btn" id="part5_min_close">閉じる</div>`; const btn = document.getElementById('part5_min_close'); if(btn) btn.onclick = () => { overlay.style.display = 'none'; }; }
      }
    } catch(e){ console.warn('[Part5] createMinimalOverlay failed', e); }
  }

  // ------------- 条件チェック & トリガー -------------
  // 条件:
  //  - onGameEnd(win===true) が呼ばれる（またはセッションが終了したと判定できる瞬間）
  //  - session.currentStage === 30
  //  - チャレンジ倍率が 10^200 系であること（isChallenge10e200()）
  //  - 日付が 2026-02-01 ～ 2026-02-15（inDateWindow()）
  //  - かつまだ表示していない（save._part5_shown 未設定）
  //
  // 実装:
  //  - onGameEnd をラップして上記をチェックして showEggOverlay() を呼ぶ（同時に元の onGameEnd を呼ぶ）

  const orig_onGameEnd = (typeof onGameEnd === 'function') ? onGameEnd : null;

  w.onGameEnd = function(win){
    try {
      // call original first so game state is finalized (prefer original behavior)
      if(typeof orig_onGameEnd === 'function'){
        try { orig_onGameEnd(win); } catch(e){ console.warn('[Part5] orig_onGameEnd threw', e); }
      }
    } catch(e){ console.warn('[Part5] calling orig_onGameEnd failed', e); }

    try {
      // only trigger on win === true
      if(!win) return;
      // ensure session exists
      const stage = (w.session && typeof w.session.currentStage !== 'undefined') ? w.session.currentStage : (typeof session !== 'undefined' && session.currentStage ? session.currentStage : null);
      if(stage === null) {
        // Try fallback: session.wave maybe indicates final; we keep conservative
        return;
      }
      // check stage 30
      if(Number(stage) !== 30) return;

      // check date range
      if(!inDateWindow()){
        // not in the allowed date window -> do nothing
        console.log('[Part5] not in date window; skipping egg overlay');
        return;
      }

      // check challenge label (10^200)
      if(!isChallenge10e200()){
        console.log('[Part5] challenge label is not 10^200; skipping egg overlay');
        return;
      }

      // check shown flag
      try {
        w.save = w.save || {};
        if(w.save._part5_shown){
          console.log('[Part5] already shown per save flag; skipping');
          return;
        }
      } catch(e){
        console.warn('[Part5] checking save._part5_shown failed', e);
      }

      // All conditions met -> show overlay
      console.log('[Part5] conditions met: showing egg overlay now');
      try { showEggOverlay(); } catch(e){ console.error('[Part5] showEggOverlay threw', e); }
    } catch(e){
      console.error('[Part5] onGameEnd wrapper error', e);
    }
  };

  // ------------- 追加: セーフティネット -------------
  // もし既にゲームが終了していて条件を満たすとき（ページリロード直後など）に表示し損ねている可能性に備え、
  // 軽いチェックを数秒後に一度だけ実行します（即時処理ではなく安全な補助）。
  setTimeout(() => {
    try {
      // Only run supplemental check if not already shown
      w.save = w.save || {};
      if(w.save._part5_shown) return;
      // If session indicates completed stage 30 and win was true recently, trigger
      if(typeof w.session !== 'undefined' && Number(w.session.currentStage) === 30){
        // Heuristic: if waveState === 'cleared' or state.running === false and last session.xp present, try trigger
        const maybeFinished = (w.session.waveState === 'cleared') || (w.state && w.state.running === false);
        if(maybeFinished && inDateWindow() && isChallenge10e200()){
          console.log('[Part5] supplemental check: attempting showEggOverlay');
          showEggOverlay();
        }
      }
    } catch(e){ /* non-fatal */ console.warn('[Part5] supplemental check failed', e); }
  }, 2500);

  // ------------- エクスポート / デバッグ -------------
  w._part5 = w._part5 || {};
  w._part5.showEggOverlay = showEggOverlay;
  w._part5.isChallenge10e200 = isChallenge10e200;
  w._part5.inDateWindow = inDateWindow;

  console.log('[Part5] patch installed: egg trigger on stage30 + 10^200 challenge between 2026-02-01 and 2026-02-15.');
})();
</script>
