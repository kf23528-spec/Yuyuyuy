<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>成長型STG — 修正版 Part1（基盤・デッキ・ガチャ・入力）</title>
<style>
  :root{
    --bg:#041223; --panel:#072433; --accent:#4de0ff; --muted:rgba(255,255,255,0.06);
    --rarity-N: #bdbdbd;
    --rarity-R: #4da6ff;
    --rarity-SR: #c77dff;
    --rarity-SSR: #ffd700;
    --rarity-XXX: #ff6ff0;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#00121a);font-family:system-ui,-apple-system,Roboto,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;color:#fff;overflow:hidden}
  #app{display:flex;flex-direction:column;align-items:center;padding:8px;box-sizing:border-box;height:100%}
  #topHud{width:100%;max-width:1024px;display:flex;gap:8px;margin-bottom:6px}
  .statBox{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:8px;border-radius:10px;flex:1;min-width:0}
  .small{font-size:12px;opacity:0.9}
  #canvasWrap{width:100%;max-width:1024px;flex:1;display:flex;align-items:center;justify-content:center;position:relative}
  canvas{width:100%;height:100%;border-radius:12px;background:linear-gradient(180deg,#021826,#00121a);touch-action:none}
  #stickBase{position:absolute;left:16px;bottom:16px;width:120px;height:120px;border-radius:60px;background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;z-index:80;touch-action:none;pointer-events:none;opacity:0}
  #stickKnob{width:56px;height:56px;border-radius:28px;background:rgba(255,255,255,0.04);transform:translate(0,0)}
  #overlay{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);z-index:100;pointer-events:auto}
  .panel{background:linear-gradient(180deg,#08202b,#05262b);padding:14px;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.6);width:92%;max-width:1100px;max-height:86vh;overflow:auto;pointer-events:auto}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .choice{background:rgba(255,255,255,0.02);padding:10px;border-radius:10px;cursor:pointer;border:1px solid rgba(255,255,255,0.03);display:flex;justify-content:space-between;align-items:center}
  .btn{background:var(--accent);padding:8px 12px;border-radius:9px;color:#012;font-weight:800;text-align:center;cursor:pointer;user-select:none}
  .btn.secondary{background:rgba(255,255,255,0.03);color:#fff;font-weight:700}
  #bottomTabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.45));gap:8px;z-index:120}
  .tabBtn{background:rgba(255,255,255,0.02);padding:8px 12px;border-radius:10px;color:#fff;cursor:pointer;user-select:none}
  .tabBtn.active{background:var(--accent);color:#001}
  .cardList{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .card{background:rgba(255,255,255,0.02);padding:8px;border-radius:8px;font-size:13px;min-width:160px}
  footer{font-size:12px;opacity:0.9;margin-top:6px}
  .rarity-N{background:var(--rarity-N);color:#001;padding:4px;border-radius:6px}
  .rarity-R{background:var(--rarity-R);color:#001;padding:4px;border-radius:6px}
  .rarity-SR{background:var(--rarity-SR);color:#001;padding:4px;border-radius:6px}
  .rarity-SSR{background:var(--rarity-SSR);color:#001;padding:4px;border-radius:6px}
  .rarity-XXX{background:var(--rarity-XXX);color:#001;padding:4px;border-radius:6px}
  #deckBar{position:fixed;right:12px;top:80px;display:flex;flex-direction:column;gap:6px;z-index:130}
  .deckSlot{width:74px;height:56px;background:rgba(255,255,255,0.02);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer}
  .gachaOverlay{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;z-index:200}
  .gachaCard{width:220px;height:320px;border-radius:12px;background:linear-gradient(180deg,#0a3444,#053241);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:12px;box-shadow:0 8px 40px rgba(0,0,0,0.6)}
  .centerNote{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:210}
  .rarity-tag{padding:6px 10px;border-radius:10px;font-weight:800}
  .disabled{opacity:0.45;pointer-events:none}
  @media (min-width:900px){
    #stickBase{width:140px;height:140px}#stickKnob{width:64px;height:64px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topHud">
    <div class="statBox">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:900">Lv <span id="uiLevel">1</span></div>
        <div class="small" id="uiWaveLabel">Wave 1</div>

        </div>
        <div style="width:84px;text-align:right">
          <div class="small">XP: <span id="uiXpText">0</span></div>
        </div>

    <div id="overlay" aria-hidden="true"><div class="panel" id="overlayPanel"></div></div>

    <div class="gachaOverlay" id="gachaOverlay" style="display:none;background:rgba(0,0,0,0.7)">
      <div id="gachaAnimContainer"></div>
    </div>

  </div>

  <div style="width:100%;max-width:1024px;display:flex;justify-content:space-between;align-items:center;margin-top:8px">
    <div class="small">基礎攻撃: <span id="uiBaseAtk">10</span> /秒</div>
    <div class="small">貫通/拡散: <span id="uiMisc">pierce:1 spread:1</span></div>
    <div class="small">敵残: <span id="uiEnemyCount">0</span></div>
  </div>

  <footer>Part1: 基盤（入力・画面・デッキ・ガチャ・XPループ） — 修正版</footer>
</div>

<div id="deckBar" aria-hidden="false"></div>

<div id="bottomTabs">
  <div class="tabBtn active" data-tab="stage">ステージ選択</div>
  <div class="tabBtn" data-tab="upgrade">強化（永続）</div>
  <div class="tabBtn" data-tab="play">出陣（プレイ）</div>
</div>

<script>
/* =========================
   修正版 Part1 — 統合基盤（長く・丁寧）
   主要変更点（要点）
   - チャレンジ倍率を「UI保存」→「戦闘処理（spawn時）で敵へ焼き込み」する方式へ変更
   - 超指数チャレンジ（exponent:200 等）を内部表現で対応（表示と適用を分離）
   - ガチャ単発/10連のコストは累計XPの2%/20%（実行時に計算）に修正
   - ガチャの確率・種類数は指定どおり反映、プール表示は「種類数 / 残りプール数」を表示
   - 敵HP/攻撃/報酬XP は spawn 時に finalMultiplier を用いて直接上書き（以後 update は参照しない）
   - 既存の関数構造/UIを壊さず、追加フィールドで互換性を保持
   ========================= */

/* -----------------------
   定数 / 保存キー
   ----------------------- */
const SAVE_KEY = 'grow_stg_save_v5';
const MAX_ONSCREEN_PROJECTILES = 800;
const SPLIT_GLOBAL_LIMIT = 240;
const BASE_UPGRADE_BASE_COST = 1000;
const BASE_UPGRADE_SCALE = 1.5;
const MAX_STAGE = 30;

/* -----------------------
   challenge multipliers: 設定と内部表現
   - UI 表示は label（例: "10^200 x"）だが、戦闘用には multiplier オブジェクトを作る
   - multiplier は二種類:
     1) type:'num', n: Number  -> 小さな / 中程度の倍率（普通は Number で表現）
     2) type:'exp', e: Integer -> 10^e の倍率（超指数向け）
   - combineMultipliers で stageMultiplier と challengeMultiplier を合成（結果も同様なオブジェクト）
   ----------------------- */
const CHALLENGE_MULTS = [
  {label:'1x', n:1},
  {label:'2x', n:2},
  {label:'4x', n:4},
  {label:'8x', n:8},
  {label:'16x', n:16},
  {label:'32x', n:32},
  {label:'64x', n:64},
  {label:'128x', n:128},
  {label:'256x', n:256},
  {label:'512x', n:512},
  {label:'1e3 x', n:1000},
  {label:'5e5 x', n:500000},
  {label:'1e7 x', n:10000000},
  {label:'1e9 x', n:1000000000},
  {label:'5e11 x', n:5e11},
  {label:'1e12 x', n:1e12},
  {label:'1景 x', exponent:16}, // 単位「景」を10^16と仮定
  {label:'10^40 x', exponent:40},
  {label:'10^45 x', exponent:45},
  {label:'10^50 x', exponent:50},
  {label:'10^61 x', exponent:61},
  {label:'10^73 x', exponent:73},
  {label:'10^86 x', exponent:86},
  {label:'10^100 x', exponent:100},
  {label:'10^115 x', exponent:115},
  {label:'10^130 x', exponent:130},
  {label:'10^150 x', exponent:150},
  {label:'10^200 x (♾️系)', exponent:200}
];

/* -----------------------
   グローバル状態
   ----------------------- */
const state = {
  screen: 'stage',
  running: false,
  overlayMode: null,
  overlayBusy: false,
  debug: false
};

let save = null;

/* -----------------------
   保存読み書き（初期化で種類数・プール数を分ける）
   - save.cardPoolsTypes : 各レアリティの「種類数」（あなた指定）
   - save.cardPoolsCounts: 実際に引ける残り「枚数」プール（初期は種類数 * 大きめ係数）
   ----------------------- */
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
      // 初期 save: 指定どおりの種類数
      save = {
        version: '5.1',
        totalXP: 0,
        totalMoney: 0,
        baseUpgrades: { atk: 0, shield: 0, speed: 0 },
        ownedCards: [],
        // 種類数（types）と実在プール（counts）を分離
        cardPoolsTypes: { N: 100, R: 70, SR: 50, SSR: 50, XXX: 5 },
        cardPoolsCounts: { N: 1000, R: 700, SR: 500, SSR: 500, XXX: 50 }, // copies — 適宜調整。引かれるたびにデクリメント
        equipped: [],
        equipCapacity: 10,
        unlockedStages: [1],
        settings: { challengeMultiplierLabel: '1x' },
        choiceSlots: 3,
        activeDeck: []
      };
      // 初期所持カード（補填）
      const starter = [
        { id: 'N_init_strike', baseId: 'N_template_01', rarity: 'N', label: '基礎射撃訓練', desc: '攻撃力+12%（セッション）', effectKey: 'atk_pct', params: { pct: 0.12 } },
        { id: 'N_init_boots', baseId: 'N_template_02', rarity: 'N', label: '機動ブーツ', desc: '移動速度+12%', effectKey: 'speed_pct', params: { pct: 0.12 } },
        { id: 'N_init_shield', baseId: 'N_template_03', rarity: 'N', label: '小型シールド', desc: 'シールド+400', effectKey: 'shield_plus', params: { amt: 400 } }
      ];
      save.ownedCards = starter.slice();
      persistSaveLocal();
      return save;
    }
    save = JSON.parse(raw);
    // sanitize essential fields
    save.baseUpgrades = save.baseUpgrades || { atk: 0, shield: 0, speed: 0 };
    save.ownedCards = Array.isArray(save.ownedCards) ? save.ownedCards : [];
    save.cardPoolsTypes = save.cardPoolsTypes || { N: 100, R: 70, SR: 50, SSR: 50, XXX: 5 };
    save.cardPoolsCounts = save.cardPoolsCounts || { N: 1000, R: 700, SR: 500, SSR: 500, XXX: 50 };
    save.settings = save.settings || { challengeMultiplierLabel: '1x' };
    save.choiceSlots = typeof save.choiceSlots === 'number' ? save.choiceSlots : 3;
    save.activeDeck = Array.isArray(save.activeDeck) ? save.activeDeck : [];
    save.equipped = Array.isArray(save.equipped) ? save.equipped : [];
    save.equipCapacity = typeof save.equipCapacity === 'number' ? save.equipCapacity : 10;
    return save;
  } catch (e) {
    console.error('loadSave error', e);
    localStorage.removeItem(SAVE_KEY);
    return loadSave();
  }
}
function persistSaveLocal() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch (e) {
    console.error('persistSaveLocal error', e);
  }
}

/* -----------------------
   UI要素取得
   ----------------------- */
const ui = {
  canvas: document.getElementById('gameCanvas'),
  overlay: document.getElementById('overlay'),
  overlayPanel: document.getElementById('overlayPanel'),
  stickBase: document.getElementById('stickBase'),
  stickKnob: document.getElementById('stickKnob'),
  tabs: document.querySelectorAll('.tabBtn'),
  uiLevel: document.getElementById('uiLevel'),
  uiXpBar: document.getElementById('uiXpBar'),
  uiXpText: document.getElementById('uiXpText'),
  uiShield: document.getElementById('uiShield'),
  uiShieldBar: document.getElementById('uiShieldBar'),
  uiScore: document.getElementById('uiScore'),
  uiDps: document.getElementById('uiDps'),
  uiBaseAtk: document.getElementById('uiBaseAtk'),
  uiMisc: document.getElementById('uiMisc'),
  uiEnemyCount: document.getElementById('uiEnemyCount'),
  uiWaveLabel: document.getElementById('uiWaveLabel'),
  deckBar: document.getElementById('deckBar'),
  gachaOverlay: document.getElementById('gachaOverlay'),
  gachaAnimContainer: document.getElementById('gachaAnimContainer')
};
const ctx = ui.canvas.getContext('2d');

/* -----------------------
   Canvas サイズ管理
   ----------------------- */
let CANVAS_W = 540, CANVAS_H = 960;
function resizeCanvas() {
  const maxW = Math.min(window.innerWidth - 16, 1024);
  CANVAS_W = Math.floor(maxW);
  CANVAS_H = Math.floor(Math.min(window.innerHeight * 0.72, 1400));
  ui.canvas.width = Math.max(320, CANVAS_W);
  ui.canvas.height = Math.max(520, CANVAS_H);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* -----------------------
   Entities / player
   ----------------------- */
let player = null;
function resetPlayerForSession(stageMultiplier) {
  // enforce speed level cap <= 3
  const speedLevel = Math.max(0, Math.min(3, save.baseUpgrades.speed || 0));
  const atkMult = Math.pow(BASE_UPGRADE_SCALE, (save.baseUpgrades.atk || 0));
  const shieldMult = Math.pow(BASE_UPGRADE_SCALE, (save.baseUpgrades.shield || 0));
  const speedMult = Math.pow(1.2, speedLevel);
  player = {
    x: CANVAS_W / 2,
    y: CANVAS_H - 80,
    r: 18,
    shieldMax: Math.floor(5000 * shieldMult),
    shield: Math.floor(5000 * shieldMult),
    fireCooldown: 500,
    damagePerShot: Math.max(1, Math.ceil(5 * atkMult)),
    lastShot: 0,
    speedBase: Math.floor(220 * speedMult),
    spread: 1,
    pierce: 1,
    regen: 0,
    level: 1,
    xp: 0,
    xpNext: 10,
    passives: {},
    buffs: {}
  };
}

/* -----------------------
   Containers
   ----------------------- */
let bullets = [], enemies = [], enemyBullets = [], effects = [], drones = [];

/* -----------------------
   Virtual stick (anywhere)
   ----------------------- */
const stickInput = { x: 0, y: 0, active: false };
let activePointerId = null;
let stickCenter = null;

function initAnywhereStick() {
  const base = ui.stickBase;
  const knob = ui.stickKnob;
  const wrap = document.getElementById('canvasWrap');

  function onPointerDown(e) {
    if (state.overlayMode) return;
    activePointerId = e.pointerId;
    try { wrap.setPointerCapture(activePointerId); } catch (_err) { }
    stickInput.active = true;
    stickCenter = { x: e.clientX, y: e.clientY };
    base.style.left = (stickCenter.x - base.offsetWidth / 2) + 'px';
    base.style.top = (stickCenter.y - base.offsetHeight / 2) + 'px';
    base.style.opacity = 1;
    base.style.pointerEvents = 'auto';
    updateKnobFromEvent(e);
  }
  function onPointerMove(e) {
    if (!stickInput.active || activePointerId !== e.pointerId) return;
    updateKnobFromEvent(e);
  }
  function onPointerUp(e) {
    if (activePointerId !== e.pointerId) return;
    try { wrap.releasePointerCapture(activePointerId); } catch (_err) { }
    activePointerId = null;
    stickInput.active = false;
    stickInput.x = 0; stickInput.y = 0;
    knob.style.transform = `translate(0,0)`;
    base.style.opacity = 0;
    base.style.pointerEvents = 'none';
  }
  function updateKnobFromEvent(e) {
    const dx = e.clientX - (stickCenter.x);
    const dy = e.clientY - (stickCenter.y);
    const max = 48;
    const nx = Math.max(-1, Math.min(1, dx / max));
    const ny = Math.max(-1, Math.min(1, dy / max));
    stickInput.x = nx;
    stickInput.y = ny;
    knob.style.transform = `translate(${nx * max}px, ${ny * max}px)`;
  }

  wrap.removeEventListener('pointerdown', onPointerDown);
  wrap.addEventListener('pointerdown', onPointerDown);
  window.removeEventListener('pointermove', onPointerMove);
  window.addEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  window.addEventListener('pointerup', onPointerUp);

  base.style.opacity = 0;
  base.style.pointerEvents = 'none';
}
initAnywhereStick();

/* -----------------------
   CARD_LIBRARY 作成（指定数のテンプレを自動生成）
   - N:100, R:70, SR:50, SSR:50, XXX:5
   - SR/SSR/XXX は後で強化改修のため識別可能な構造体にしておく
   ----------------------- */
const CARD_LIBRARY = { N: [], R: [], SR: [], SSR: [], XXX: [] };

function addTemplate(cat, name, desc, effectKey, params) {
  const id = `${cat}_${String(CARD_LIBRARY[cat].length + 1).padStart(3, '0')}`;
  CARD_LIBRARY[cat].push({ id, baseId: id, rarity: cat, name, desc, effectKey, params, persistentAllowed: true });
}

/* Populate templates (省略不能：あなたの要望通り大量テンプレ) */
(function buildTemplates() {
  const nDefs = [
    ['攻撃+6%','攻撃力が6%上昇','atk_pct',{pct:0.06}],
    ['発射速度+10%','発射速度が10%向上','fire_rate_pct',{pct:0.10}],
    ['シールド+300','シールド最大値+300','shield_plus',{amt:300}],
    ['回復+4/s','シールド回復+4/s','regen',{amt:4}],
    ['移動速度+8%','移動速度が8%上昇','speed_pct',{pct:0.08}],
    ['貫通+1','弾の貫通が+1','pierce_plus',{amt:1}],
    ['拡散+1','ショットの拡散が+1','spread_plus',{amt:1}],
    ['弾速+8%','弾の速度が+8%','bullet_speed_pct',{pct:0.08}],
    ['XP+8%','獲得XPが+8%','xp_boost_pct',{pct:0.08}],
    ['小分裂','命中時まれに小分裂','split_on_hit',{chance:0.12,shards:2}]
  ];
  for (let i = 0; i < 100; i++) {
    const b = nDefs[i % nDefs.length];
    const p = JSON.parse(JSON.stringify(b[3]));
    if (p.pct) p.pct = Math.round(p.pct * (0.9 + (i % 4) * 0.03) * 100) / 100;
    if (p.amt) p.amt = Math.ceil(p.amt * (0.9 + (i % 5) * 0.08));
    addTemplate('N', `${b[0]} (${i + 1})`, b[1], b[2], p);
  }

  const rDefs = [
    ['命中分裂','命中時小弾に分裂','split_on_hit',{chance:0.28,shards:3}],
    ['命中爆発','命中時爆発','explode_on_hit',{chance:0.12,dmgMul:0.9,radius:36}],
    ['追尾弾','命中時確率で追尾弾生成','homing_on_hit',{chance:0.18,power:0.45}],
    ['撃破散布','撃破時小弾散布','kill_scatter',{shards:6,dmgMul:0.35}],
    ['与ダメ吸収','与ダメの6%をシールド化','leech_pct',{pct:0.06}],
    ['命中遅延','命中時遅延付与','slow_on_hit',{chance:0.30,dur:1500}],
    ['XP+12%','獲得XP+12%','xp_up_pct',{pct:0.12}],
    ['二連射','一定確率で追加弾','double_shot',{chance:0.5}],
    ['貫通大','貫通+2','pierce_big',{amt:2}],
    ['拡散大','拡散+2','spread_big',{amt:2}]
  ];
  for (let i = 0; i < 70; i++) {
    const d = rDefs[i % rDefs.length];
    addTemplate('R', `${d[0]} (${i + 1})`, d[1], d[2], JSON.parse(JSON.stringify(d[3])));
  }

  const srDefs = [

function rarityColor(r) {

/* -----------------------
   applyCardToPlayer: 即時適用（セッション）
   ----------------------- */
function applyCardToPlayer(card, options = { persistent: false }) {
  if (!card || !card.effectKey) return { applied: false, message: 'カード不正' };
  try {
    const handler = CARD_EFFECTS[card.effectKey];
    if (typeof handler === 'function') {
      handler(card);
    } else {
      if (card.params && card.params.pct) player.damagePerShot = Math.max(1, Math.ceil(player.damagePerShot * (1 + card.params.pct)));
      else if (card.params && card.params.amt) { player.shieldMax += card.params.amt; player.shield = Math.min(player.shield, player.shieldMax); }
    }
    if (options.persistent && save) {
      const inst = { id: `${card.baseId || card.id}_${Date.now()}`, baseId: card.baseId || card.id, rarity: card.rarity || 'N', label: card.name || card.label || card.baseId || card.id, desc: card.desc || '', effectKey: card.effectKey, params: Object.assign({}, card.params || {}) };
      save.ownedCards.push(inst);
      persistSaveLocal();
    }
    updateUI();
    effects.push({ type: 'apply', x: player.x, y: player.y - 24, ttl: 900, maxTtl: 900, desc: `${card.rarity} ${card.name || card.label || card.id}` });
    return { applied: true };
  } catch (err) {
    console.error('applyCardToPlayer error', err);
    return { applied: false, message: String(err) };
  }
}

/* -----------------------
   大数倍率ユーティリティ（戦闘用）
   - multiplier オブジェクトの解釈・合成・適用を行う
   - 結果は「可能な場合は Number による乗算」「超大きい場合は Infinity」を返す（あなたの許容どおり）
   ----------------------- */

/**
 * multiplier object:
 *  - { type: 'num', n: Number }
 *  - { type: 'exp', e: Integer }  // represents 10^e
 */
function makeMultiplierFromChoice(choiceObj){
  // choiceObj: { n: Number } or { exponent: Integer } or { label }
  if(!choiceObj) return { type:'num', n:1 };
  if(typeof choiceObj.n === 'number') return { type:'num', n: Number(choiceObj.n) };
  if(typeof choiceObj.exponent === 'number') return { type:'exp', e: Math.floor(choiceObj.exponent) };
  // fallback: if label e.g. '1x'
  if(typeof choiceObj.label === 'string' && /^(\d+)$/.test(choiceObj.label)) return { type:'num', n: Number(choiceObj.label) };
  return { type:'num', n:1 };
}

function multiplierToString(m){
  if(!m) return '1x';
  if(m.type === 'num') return `${m.n}x`;
  if(m.type === 'exp') return `10^${m.e}x`;
  return '1x';
}

// combine two multipliers -> result multiplier
function combineMultipliers(a, b){
  if(!a) a = {type:'num', n:1};
  if(!b) b = {type:'num', n:1};
  // easiest cases
  if(a.type === 'num' && b.type === 'num') return { type:'num', n: a.n * b.n };
  // if either is exp, combine exponents: num * 10^e -> exp with adjusted exponent if num is power of 10
  // Simpler: convert to {mant, exp} where value = mant * 10^exp
  function toMantExp(x){
    if(x.type === 'num'){
      const v = Number(x.n);
      if(v === 0) return { m:0, e:0 };
      // approximate mantissa and exponent using scientific: v = m * 10^e
      const e = Math.floor(Math.log10(Math.abs(v) || 1));
      const m = v / Math.pow(10, e);
      return { m, e };
    } else {
      return { m:1, e: x.e };
    }
  }
  const A = toMantExp(a), B = toMantExp(b);
  // multiply mantissas and add exponents
  const m = A.m * B.m;
  const e = A.e + B.e;
  // if exponent small enough to convert back to Number, do so
  if(e >= -300 && e <= 300){
    const val = m * Math.pow(10, e);
    if(isFinite(val)) return { type:'num', n: val };
  }
  // otherwise return as exp form (normalize mantissa to 1..10)
  const normE = Math.floor(Math.log10(Math.abs(m) || 1));
  const normM = m / Math.pow(10, normE);
  const finalE = e + normE;
  // we return exp with e = finalE and assume mantissa approx 1.x (we don't keep m to keep usage simple)
  return { type:'exp', e: Math.floor(finalE) };
}

// attempt to apply multiplier to a base number, may return Infinity for huge exponents
function applyMultiplierToNumber(base, multObj){
  if(!multObj) return base;
  if(multObj.type === 'num'){
    const res = Number(base) * multObj.n;
    return res;
  }
  if(multObj.type === 'exp'){
    // compute base * 10^e
    // if base is 0 -> 0
    if(base === 0) return 0;
    const e = multObj.e;
    // if moderate exponent, try compute safely
    if(e <= 308){ // safe threshold for Number
      return Number(base) * Math.pow(10, e);
    }
    // otherwise overflow to Infinity
    return Number.POSITIVE_INFINITY;
  }
  return base;
}

/* -----------------------
   大方向: Stage multiplier を数値で計算（可能な限り）
   - small stage multipliers will remain Number; huge challenge exponents will produce exp-type
   ----------------------- */
function calculateStageMultiplier(stage){
  // conservative: stage multiplier grows modestly (unchanged behavior)
  const base = Math.pow(1.08, stage - 1);
  return { type:'num', n: base };
}

/* -----------------------
   Gacha: 確率とプール尊重
   - save.cardPoolsTypes: 種類数（固定）
   - save.cardPoolsCounts: 実際の残りプール数（引かれると減る）
   - 単発: cost = max(100, floor(totalXP * 0.02))
   - 10連: cost = max(1000, floor(totalXP * 0.20))
   - 出現確率（固定）: N90%, R7%, SR2.5%, SSR0.49%, XXX0.01%
   - performGachaOnce は save.cardPoolsCounts を確実にデクリメント（0でそのレアが尽きた場合は低レアへフォールバック）
   ----------------------- */
function weightedRaritySampleRespectPool() {
  const poolCounts = save.cardPoolsCounts || {};
  const probs = [
    { key: 'XXX', prob: 0.0001, count: poolCounts.XXX || 0 },
    { key: 'SSR', prob: 0.0049, count: poolCounts.SSR || 0 },
    { key: 'SR', prob: 0.025, count: poolCounts.SR || 0 },
    { key: 'R', prob: 0.07, count: poolCounts.R || 0 },
    { key: 'N', prob: 0.90, count: poolCounts.N || 0 }
  ];
  // keep only rarities that still have counts
  const avail = probs.filter(p => (save.cardPoolsCounts && (save.cardPoolsCounts[p.key] || 0) > 0));
  if(avail.length === 0){
    // exhausted all pools — fallback to N
    return 'N';
  }
  // normalize probabilities among available
  const totalProb = avail.reduce((s,a)=>s+a.prob,0);
  let r = Math.random() * totalProb;
  for(const a of avail){
    if(r < a.prob) return a.key;
    r -= a.prob;
  }
  return avail[avail.length-1].key;
}
function performGachaOnce() {
  if (!save.cardPoolsCounts) save.cardPoolsCounts = { N: 1000, R: 700, SR: 500, SSR: 500, XXX: 50 };
  const chosenR = weightedRaritySampleRespectPool();
  const list = CARD_LIBRARY[chosenR] || CARD_LIBRARY.N;
  if (!list || list.length === 0) return null;
  const templ = list[Math.floor(Math.random() * list.length)];
  const instance = { id: `${templ.id}_${Date.now()}`, baseId: templ.id, rarity: templ.rarity || chosenR, label: templ.name, desc: templ.desc, effectKey: templ.effectKey, params: Object.assign({}, templ.params) };
  save.ownedCards.push(instance);
  // decrement pool count for that rarity (reflects copies remaining)
  save.cardPoolsCounts[chosenR] = Math.max(0, (save.cardPoolsCounts[chosenR] || 0) - 1);
  persistSaveLocal();
  return instance;
}

   ----------------------- */
function openCardDetailPanel(card, onClose) {
  openOverlay('cardDetail', (panel) => {
    const title = document.createElement('div'); title.style.fontWeight = '900'; title.textContent = `[${card.rarity}] ${card.label || card.name || card.id}`;
    panel.appendChild(title);
    const desc = document.createElement('div'); desc.className = 'small'; desc.style.marginTop = '8px'; desc.textContent = card.desc || '説明なし';
    panel.appendChild(desc);
    const info = document.createElement('div'); info.className = 'small'; info.style.marginTop = '8px'; info.textContent = `効果: ${card.effectKey}`;
    panel.appendChild(info);

    const upgradeDiv = document.createElement('div'); upgradeDiv.style.marginTop = '12px';
    const curUpCount = card._upgradeCount || 0;
    const nextCost = Math.ceil(100 * Math.pow(1.3, curUpCount));
    upgradeDiv.innerHTML = `<div style="font-weight:800">このカードを強化</div><div class="small">現在の強化回数: ${curUpCount}</div><div class="small">次の強化コスト: ${formatLargeNumber(nextCost)} XP</div>`;
    const doUpgradeBtn = document.createElement('div'); doUpgradeBtn.className = 'btn'; doUpgradeBtn.style.marginTop = '8px'; doUpgradeBtn.textContent = `強化する（${formatLargeNumber(nextCost)} XP）`;
    doUpgradeBtn.onclick = () => {
      if ((save.totalXP || 0) < nextCost) { showMessage('累計XPが足りません'); return; }
      save.totalXP -= nextCost;
      card._upgradeCount = (card._upgradeCount || 0) + 1;
      // each upgrade increases numeric params by +10% as requested (元の%が12%なら +1% -> 実装では「+10%増」して近似）
      if (card.params && typeof card.params.pct === 'number') {
        // user requested "例えば攻撃力アップだったら元の%が12%だったら1%ずつ増えていくように"
        // to approximate "increment by +1 percentage point per upgrade", we add 0.01 absolute each upgrade if original pct small
        // But original requirement earlier: "1%ずつ増えていくように" — so implement absolute +0.01 if baseline pct <=0.5, else multiplicative
        if (card._upgradeCount <= 1000) {
          // determine base increment as absolute 0.01 if pct < 0.5, else 10% multiplicative fallback
          if (card.params.pct < 0.5) {
            card.params.pct = Math.round((card.params.pct + 0.01) * 10000) / 10000;
          } else {
            card.params.pct = Math.round(card.params.pct * 1.10 * 10000) / 10000;
          }
        }
      } else if (card.params && typeof card.params.amt === 'number') {
        // increase amount by +1 (or +1%)? use 10% multiplicative to be consistent
        card.params.amt = Math.ceil(card.params.amt * 1.10);
      }
      persistSaveLocal();
      showMessage('強化しました', () => { openCardDetailPanel(card, onClose); });
    };
    upgradeDiv.appendChild(doUpgradeBtn);
    panel.appendChild(upgradeDiv);

    const applyBtn = document.createElement('div'); applyBtn.className = 'btn'; applyBtn.style.marginTop = '12px'; applyBtn.textContent = '戦闘で適用（セッション）';
    applyBtn.onclick = () => { applyCardToPlayer(card, { persistent: false }); closeOverlay(); if (typeof onClose === 'function') onClose(); };
    panel.appendChild(applyBtn);

    const toDeckBtn = document.createElement('div'); toDeckBtn.className = 'btn'; toDeckBtn.style.marginTop = '8px'; toDeckBtn.textContent = 'デッキへ追加';
    toDeckBtn.onclick = () => {
      if (session.activeDeck.length >= 10) { showMessage('デッキは最大10枚です'); return; }
      session.activeDeck.push(card);
      save.activeDeck = JSON.parse(JSON.stringify(session.activeDeck));
      persistSaveLocal();
      showMessage('デッキに追加しました', () => { closeOverlay(); if (typeof onClose === 'function') onClose(); });
    };
    panel.appendChild(toDeckBtn);

    const closeBtn = document.createElement('div'); closeBtn.className = 'btn'; closeBtn.style.marginTop = '8px'; closeBtn.textContent = '閉じる';
    closeBtn.onclick = () => { closeOverlay(); if (typeof onClose === 'function') onClose(); };
    panel.appendChild(closeBtn);
  });
}

/* -----------------------
   buyBaseUpgrade (speed cap enforced)
   ----------------------- */
function buyBaseUpgrade(key) {
  const lvl = save.baseUpgrades[key] || 0;
  const cost = Math.ceil(BASE_UPGRADE_BASE_COST * Math.pow(BASE_UPGRADE_SCALE, lvl));
  if ((save.totalXP || 0) < cost) { showMessage('累計XPが足りません'); return; }
  if (key === 'speed' && lvl >= 3) { showMessage('移動速度は最大 Lv3 が上限です。'); return; }
  save.totalXP -= cost;
  save.baseUpgrades[key] = lvl + 1;
  persistSaveLocal();
  resetPlayerForSession(session.stageDifficultyMultiplier || 1);
  showMessage(`${key} を強化しました`, () => { openUpgradePanel(); });
}

/* -----------------------
   Spawn handling（重要） — finalMultiplier を敵に焼き込む
   - ここが今回の核心。spawnEnemy / spawnBoss は「base 値」を受け取り、
   - session.finalEnemyMultiplier を乗算（あるいは exp 倍を適用）した最終値を e.maxHp, e.damage, e.rewardXp に設定する
   - 以後 update() は e.hp や e.damage をそのまま使うだけ（再評価不要）
   ----------------------- */

/* spawnEnemy: base hp/speed -> apply multiplier and set rewardXp/damage */

function spawnEnemy({ x, y, hp, speed }) {
  // hp,speed are "base" (unmultiplied)
  const mul = session.finalEnemyMultiplier || { type:'num', n:1 };
  const appliedHp = applyMultiplierToNumber(hp, mul);
  const hpVal = (isFinite(appliedHp) ? Math.max(1, Math.floor(appliedHp)) : Number.POSITIVE_INFINITY);
  // damage base calculation similar to old code but based on multiplied HP for consistency
  let baseDamage = Math.max(10, Math.ceil((hpVal || hp) / 40) * 40);
  const damageVal = (isFinite(baseDamage) ? Math.max(1, Math.ceil(applyMultiplierToNumber(baseDamage, {type:'num', n:1}))) : Number.POSITIVE_INFINITY);
  // reward XP: scale by multiplier
  const rewardBase = Math.max(10, Math.ceil((hp || 100) / 100));
  const rewardXp = (isFinite(rewardBase) ? Math.max(1, Math.floor(applyMultiplierToNumber(rewardBase, mul))) : Number.POSITIVE_INFINITY);

  enemies.push({
    id: 'mob',
    x, y,
    w: 44, h: 34,
    hp: hpVal,
    maxHp: hpVal,
    speed: speed,
    damage: damageVal,
    rewardXp: rewardXp,
    status: []
  });
}

/* spawnBoss: set boss maxHp, bullet damage, reward will be large */

function spawnBoss({ x, y, hp, vx, shootInterval }) {
  const mul = session.finalEnemyMultiplier || { type:'num', n:1 };
  const appliedHp = applyMultiplierToNumber(hp, mul);
  const hpVal = (isFinite(appliedHp) ? Math.max(1, Math.floor(appliedHp)) : Number.POSITIVE_INFINITY);
  // boss bullet base damage: keep formula but apply multiplier
  const bulletBase = Math.ceil(hpVal / 160);
  const bulletDamage = (isFinite(bulletBase) ? Math.max(1, Math.ceil(bulletBase)) : Number.POSITIVE_INFINITY);
  const rewardXp = (isFinite(hpVal) ? Math.max(100, Math.floor(hpVal / 10)) : Number.POSITIVE_INFINITY);

  enemies.push({
    id: 'boss',
    x, y,
    w: 160, h: 86,
    hp: hpVal,
    maxHp: hpVal,
    vx: vx || 16,
    shootInterval: shootInterval || 900,
    shootTimer: 0,
    bulletDamage: bulletDamage,
    rewardXp: rewardXp,
    status: []
  });
}

/* spawnBullet unchanged (player bullets) */
function spawnBullet({ x, y, vx, vy, damage = 1, pierce = 0, gen = 0, radius = 4, meta = {} }) {
  if (bullets.length + enemyBullets.length >= MAX_ONSCREEN_PROJECTILES) {
    while (bullets.length && (bullets.length + enemyBullets.length) >= MAX_ONSCREEN_PROJECTILES) bullets.shift();
    if (bullets.length + enemyBullets.length >= MAX_ONSCREEN_PROJECTILES) return null;
  }
  bullets.push({ x, y, vx, vy, damage, pierce, gen, radius, meta, born: performance.now() });
  return true;
}

/* -----------------------
   onEnemyDefeated: reward は e.rewardXp を使う（spawn時に焼き込み済み）
   - これでチャレンジ倍率によって報酬XPも確実に増える
   ----------------------- */
function onEnemyDefeated(e) {
  // score increases (keep original style but scaled)
  const scoreAdd = (isFinite(e.maxHp) ? Math.max(10, Math.floor((e.maxHp || 100) * 1.2)) : Number.POSITIVE_INFINITY);
  state.score = (state.score || 0) + scoreAdd;
  // award XP based on e.rewardXp (spawn-time baked multiplier)
  const rewardXp = (typeof e.rewardXp !== 'undefined') ? e.rewardXp : Math.max(10, Math.ceil((e.maxHp || 100) / 100));
  try { giveXP(rewardXp); } catch (err) { console.warn('giveXP failed', err); }
  // additional effects (passives) preserved
}

/* -----------------------
   onGameEnd

function onGameEnd(win) {

  openOverlay('result', (panel) => {

    panel.appendChild(btns);
  });
}

/* -----------------------
   mainLoop / update / draw
   ----------------------- */
let lastTs = performance.now();
function mainLoop(ts) {
  const dt = Math.min(40, ts - lastTs);
  lastTs = ts;
  if (state.running) {
    try {
      update(dt);
    } catch (e) {
      console.error('Update error', e);
      showMessage(`実行時エラー: ${e && e.message ? e.message : String(e)}`);
      state.running = false;
    }
  }
  draw();
  requestAnimationFrame(mainLoop);
}

/* -----------------------
   update (spawn, movement, collisions) — uses baked values
   ----------------------- */
function update(dt) {
  handleSpawn(dt);

  // player movement
  if (stickInput.active && state.screen === 'play' && state.running) {
    const nx = stickInput.x;
    const ny = stickInput.y;
    const speed = player.speedBase;
    player.x += nx * speed * (dt / 1000);
    player.y += ny * speed * (dt / 1000);
    player.x = clamp(player.x, player.r, CANVAS_W - player.r);
    player.y = clamp(player.y, 60, CANVAS_H - 40);
  }

  const nowTime = performance.now();
  if (player && nowTime - player.lastShot >= player.fireCooldown && state.running) {
    player.lastShot = nowTime;
    const count = player.spread || 1;
    const arc = (count > 1) ? Math.PI / 12 : 0;
    for (let i = 0; i < count; i++) {
      const angle = -Math.PI / 2 + (count > 1 ? (i - (count - 1) / 2) * arc : 0);
      const speedBullet = 700 * (player.passives && player.passives.bulletSpeed || 1);
      const vx = Math.cos(angle) * 0;
      const vy = Math.sin(angle) * speedBullet;
      spawnBullet({ x: player.x, y: player.y - player.r - 6, vx, vy, damage: player.damagePerShot, pierce: player.pierce, gen: 0, radius: 4, meta: { allowSplit: !!player.passives.splitOnHit, splitChance: player.passives.splitChance || 0.35 } });
      if (player.passives.doubleShot && Math.random() < player.passives.doubleShot) {
        spawnBullet({ x: player.x + 12, y: player.y - player.r - 6, vx, vy, damage: player.damagePerShot, pierce: player.pierce, gen: 0, radius: 4, meta: {} });
      }
    }
  }

  // bullets move & collision with enemies
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += (b.vx || 0) * (dt / 1000);
    b.y += (b.vy || -500) * (dt / 1000);
    if (b.y < -40 || b.y > CANVAS_H + 40 || b.x < -80 || b.x > CANVAS_W + 80) {
      bullets.splice(i, 1);
      continue;
    }
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (pointInRect(b.x, b.y, e.x, e.y, e.w, e.h)) {
        // hit
        // apply damage from bullet to enemy hp
        if (isFinite(e.hp)) {
          e.hp -= (b.damage || 1);
        } else {
          // e.hp is Infinity -> treat as huge but allow small progress by subtracting finite? we cannot reduce Infinity => consider immediate no-kill
          // leave as is (user allowed breakage)
        }
        if (b.gen === 0 && b.meta && b.meta.allowSplit && Math.random() < (b.meta.splitChance || 0.35)) {
          const shards = Math.min(6, Math.max(1, Math.floor((b.damage || 1) / 2)));
          if (bullets.length + enemyBullets.length + shards <= SPLIT_GLOBAL_LIMIT) {
            for (let s = 0; s < shards; s++) {
              const ang = randRange(-Math.PI * 0.8, -Math.PI * 0.2);
              spawnBullet({ x: e.x, y: e.y, vx: Math.cos(ang) * randRange(40, 180), vy: Math.sin(ang) * randRange(260, 520), damage: Math.max(1, Math.floor((b.damage || 1) * 0.45)), pierce: 0, gen: 1, radius: 3 });
            }
          }
        }
        b.pierce--;
        if (b.pierce < 0) { bullets.splice(i, 1); }
        if (isFinite(e.hp) && e.hp <= 0) { onEnemyDefeated(e); enemies.splice(j, 1); }
        break;
      }
    }
  }

  // enemies behavior
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.status && e.status.length) {
      for (let sIdx = e.status.length - 1; sIdx >= 0; sIdx--) {
        const s = e.status[sIdx];
        if (s.type === 'poison') { if(isFinite(e.hp)) e.hp -= s.dps * (dt / 1000); s.remain -= dt; if (s.remain <= 0) e.status.splice(sIdx, 1); }
        if (s.type === 'slow') { s.remain -= dt; if (s.remain <= 0) e.status.splice(sIdx, 1); }
      }
    }
    if (e.id === 'mob') {
      let slowFactor = 1;
      if (e.status) for (const st of e.status) if (st.type === 'slow') slowFactor = 0.5;
      e.y += e.speed * (dt / 1000) * slowFactor;
      if (e.y - e.h / 2 > CANVAS_H) {
        player.shield -= e.damage;
        enemies.splice(i, 1);
        if (player.shield <= 0) { player.shield = 0; onGameEnd(false); return; }
      }
    } else if (e.id === 'boss') {
      e.x += e.vx * (dt / 1000);
      if (e.x < e.w / 2) { e.x = e.w / 2; e.vx *= -1; }
      if (e.x > CANVAS_W - e.w / 2) { e.x = CANVAS_W - e.w / 2; e.vx *= -1; }
      e.shootTimer = (e.shootTimer || 0) + dt;
      if (e.shootTimer > (e.shootInterval || 900)) {
        e.shootTimer = 0;
        const shots = 7;
        for (let s = 0; s < shots; s++) {
          const ang = Math.PI / 2 + (s - (shots - 1) / 2) * 0.20;
          // use baked bulletDamage from spawnBoss
          const bd = (typeof e.bulletDamage !== 'undefined') ? e.bulletDamage : Math.ceil(e.maxHp / 160);
          enemyBullets.push({ x: e.x + randRange(-20, 20), y: e.y + e.h / 2, vx: Math.cos(ang) * 120, vy: Math.sin(ang) * 220, damage: bd });
        }
      }
      if (isFinite(e.hp) && e.hp <= 0) { onEnemyDefeated(e); enemies.splice(i, 1); }
    }
  }

  // enemy bullets
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx * (dt / 1000);
    b.y += b.vy * (dt / 1000);
    if (pointInRect(b.x, b.y, player.x, player.y, player.r * 2, player.r * 2)) {
      player.shield -= b.damage; enemyBullets.splice(i, 1);
      if (player.shield <= 0) { player.shield = 0; onGameEnd(false); return; }
      continue;
    }
    if (b.y > CANVAS_H + 40 || b.x < -80 || b.x > CANVAS_W + 80) enemyBullets.splice(i, 1);
  }

  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].ttl -= dt;
    if (effects[i].ttl <= 0) effects.splice(i, 1);
  }

  if (player && player.regen > 0) player.shield = Math.min(player.shieldMax, player.shield + player.regen * (dt / 1000));

  // wave clear detection (simple)
  if (session.waveState === 'active' && enemies.length === 0 && enemyBullets.length === 0) {
    session.waveState = 'cleared';
    state.running = false;
    // giveXP uses computeFinalXP; we also baked rewardXp per enemy at spawn; for waveClear we keep 50*stage as earlier, but scale by final multiplier
    const baseWaveClearXp = 50;
    const xpToGive = applyMultiplierToNumber(baseWaveClearXp, session.finalEnemyMultiplier || {type:'num', n:1});
    giveXP(isFinite(xpToGive) ? Math.floor(xpToGive) : Number.POSITIVE_INFINITY);
    openLevelUpChoices(1, { origin: 'waveClear' });
  }

  updateUI();
}

/* -----------------------
   draw
   ----------------------- */
function draw() {
  ctx.clearRect(0, 0, ui.canvas.width, ui.canvas.height);
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(((i * 47) + (Date.now() / 30 | 0)) % CANVAS_W, (i * 31) % CANVAS_H, 1, 1);
  }
  for (const e of enemies) {
    ctx.save(); ctx.translate(e.x, e.y);
    if (e.id === 'mob') {
      ctx.fillStyle = '#ffb366'; roundRect(ctx, -e.w / 2, -e.h / 2, e.w, e.h, 8); ctx.fill();
      ctx.fillStyle = '#333'; ctx.fillRect(-e.w / 2, e.h / 2 + 6, e.w, 8);
      const hpRatio = (isFinite(e.maxHp) && isFinite(e.hp)) ? Math.max(0, e.hp) / e.maxHp : 1;
      ctx.fillStyle = '#ff6666'; ctx.fillRect(-e.w / 2, e.h / 2 + 6, e.w * hpRatio, 8);
    } else {
      ctx.fillStyle = '#a84d4d'; roundRect(ctx, -e.w / 2, -e.h / 2, e.w, e.h, 12); ctx.fill();
      ctx.fillStyle = '#222'; ctx.fillRect(-e.w / 2, e.h / 2 + 10, e.w, 12);
      const hpRatio = (isFinite(e.maxHp) && isFinite(e.hp)) ? Math.max(0, e.hp) / e.maxHp : 1;
      ctx.fillStyle = '#ff8a8a'; ctx.fillRect(-e.w / 2, e.h / 2 + 10, e.w * hpRatio, 12);
      ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`BOSS ${isFinite(e.hp) ? Math.floor(e.hp) : '∞'}/${isFinite(e.maxHp) ? e.maxHp : '∞'}`, 0, -e.h / 2 - 8);
    }
    ctx.restore();
  }

  for (const b of bullets) { ctx.beginPath(); ctx.fillStyle = '#c6f9ff'; ctx.ellipse(b.x, b.y, b.radius, b.radius, 0, 0, Math.PI * 2); ctx.fill(); }
  for (const eb of enemyBullets) { ctx.beginPath(); ctx.fillStyle = '#ffcccb'; ctx.arc(eb.x, eb.y, 5, 0, Math.PI * 2); ctx.fill(); }

  for (const fx of effects) {
    if (fx.type === 'explosion') { ctx.beginPath(); ctx.fillStyle = 'rgba(255,140,60,0.12)'; ctx.arc(fx.x, fx.y, fx.r * (fx.ttl / fx.maxTtl), 0, Math.PI * 2); ctx.fill(); }
    if (fx.type === 'apply') { ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(fx.desc || '', fx.x, fx.y); }
    if (fx.type === 'pulse') { ctx.beginPath(); ctx.fillStyle = 'rgba(120,200,255,0.08)'; ctx.arc(fx.x, fx.y, fx.r * (fx.ttl / fx.maxTtl), 0, Math.PI * 2); ctx.fill(); }
  }

  if (player) {
    ctx.save(); ctx.translate(player.x, player.y); ctx.fillStyle = '#66c0ff'; roundRect(ctx, -player.r, -player.r, player.r * 2, player.r * 2, 8); ctx.fill(); ctx.fillStyle = '#032'; ctx.fillRect(-8, -6, 16, 12); ctx.restore();
  }
}

/* -----------------------
   XP / レベル処理
   ----------------------- */
function computeFinalXP(baseXp) {
  let xp = baseXp;
  if (player.passives && player.passives.xpBoost) xp = Math.floor(xp * (1 + player.passives.xpBoost));
  if (player.passives && player.passives.xpGlobalMul) xp = Math.floor(xp * player.passives.xpGlobalMul);
  if (player.passives && player.passives.xpDouble && Math.random() < player.passives.xpDouble) xp *= 2;
  return xp;
}
function giveXP(baseXp) {
  const xp = computeFinalXP(Math.floor(baseXp));
  save.totalXP = (save.totalXP || 0);
  session.sessionXP = session.sessionXP || 0;
  session.sessionXP += xp;
  player.xp += xp;
  // handle leveled up possibly multiple times
  while (player.xp >= player.xpNext) {
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.ceil(player.xpNext * 1.35);
    openLevelUpChoices(save.choiceSlots || 3, { origin: 'levelup' });
  }
  updateUI();
}

/* -----------------------
   Overlay helpers (simple)
   ----------------------- */
function openOverlay(mode, builder) {
  if (state.overlayBusy) return;
  state.overlayBusy = true;
  state.overlayMode = mode;
  ui.overlay.style.display = 'flex';
  ui.overlay.setAttribute('aria-hidden', 'false');
  ui.overlayPanel.innerHTML = '';
  try {
    builder(ui.overlayPanel);
  } catch (e) {
    console.error('overlay builder error', e);
    ui.overlayPanel.innerHTML = `<div style="font-weight:900">エラー</div><div class="small">${String(e)}</div><div style="margin-top:8px" class="btn" id="overlayCloseBtn">閉じる</div>`;
    const btn = document.getElementById('overlayCloseBtn');
    if (btn) btn.onclick = () => { closeOverlay(); };
  } finally {
    state.overlayBusy = false;
  }
}
function closeOverlay() {
  ui.overlay.style.display = 'none';
  ui.overlay.setAttribute('aria-hidden', 'true');
  ui.overlayPanel.innerHTML = '';
  state.overlayMode = null;
  state.overlayBusy = false;
}

/* ESC で閉じる */
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.overlayMode && !state.overlayBusy) {
    closeOverlay();
    if (!state.running && state.screen === 'play') state.running = true;
  }
});

/* -----------------------
   Level-up choices（簡易）
   ----------------------- */
function pickCandidatesForChoices(num) {
  const pool = (session.activeDeck && session.activeDeck.length) ? session.activeDeck : save.ownedCards;
  const shuffled = shuffle(pool || []);
  const results = [];
  for (let i = 0; i < shuffled.length && results.length < num; i++) {
    const c = shuffled[i];
    const card = Object.assign({}, c);
    if (!card.label) card.label = card.name || card.baseId || card.id || '無名カード';
    if (!card.desc) card.desc = c.desc || '';
    if (!card.effectKey && c.effectKey) card.effectKey = c.effectKey;
    results.push(card);
  }
  while (results.length < num) {
    results.push({ id: `fallback_${Date.now()}_${results.length}`, rarity: 'N', label: '基礎攻撃+10%', desc: '仮効果: 攻撃+10%', effectKey: 'atk_pct', params: { pct: 0.10 } });
  }
  return results;
}

function openLevelUpChoices(num, opts = {}) {
  state.running = false; // pause locally; Part4 may change overlay behavior
  openOverlay('levelUp', (panel) => {
    const title = document.createElement('div');
    title.style.fontWeight = '900';
    title.style.fontSize = '18px';
    title.textContent = (opts.origin === 'kill') ? '撃破ボーナス — 効果を選択' : (opts.origin === 'waveClear') ? 'Wave報酬' : 'レベルアップ — 効果を選択';
    panel.appendChild(title);
    const sub = document.createElement('div');
    sub.className = 'small';
    sub.style.marginTop = '8px';
    sub.textContent = `選択肢: ${num} 個表示`;
    panel.appendChild(sub);
    const listDiv = document.createElement('div'); listDiv.className = 'choices'; listDiv.style.marginTop = '10px';
    panel.appendChild(listDiv);
    const candidates = pickCandidatesForChoices(num);
    for (const card of candidates) {
      const el = document.createElement('div'); el.className = 'choice';
      const colorClass = (card.rarity === 'XXX') ? 'rarity-XXX' : (card.rarity === 'SSR') ? 'rarity-SSR' : (card.rarity === 'SR') ? 'rarity-SR' : (card.rarity === 'R') ? 'rarity-R' : 'rarity-N';
      el.innerHTML = `<div style="flex:1;display:flex;align-items:center"><div class="rarity-tag ${colorClass}" style="margin-right:8px">${card.rarity}</div><div><strong>${card.label}</strong><div class="small">${card.desc}</div></div></div><div style="width:70px;text-align:center" class="small">選択</div>`;
      el.addEventListener('click', () => {
        applyCardToPlayer(card, { persistent: false });
        closeOverlay();
        state.running = true;
      });
      listDiv.appendChild(el);
    }
    const skip = document.createElement('div'); skip.className = 'btn'; skip.style.marginTop = '10px'; skip.textContent = 'スキップ';
    skip.onclick = () => { closeOverlay(); state.running = true; };
    panel.appendChild(skip);
  });
}

/* -----------------------
   startPlay / startWave
   - startPlay will compute session.finalEnemyMultiplier by combining stage multiplier and chosen challenge multiplier
   - finalEnemyMultiplier is used at spawn time to bake hp/damage/xp
   ----------------------- */
const session = {
  currentStage: 1,
  stageDifficultyMultiplier: { type:'num', n:1 },
  sessionXP: 0,
  wave: 1,
  waveState: 'idle',
  spawnTimer: 0,
  spawnedCount: 0,
  activeDeck: [],
  finalEnemyMultiplier: { type:'num', n:1 } // baked multiplier for this run
};

function parseChallengeSelectValue(valueStr){
  // valueStr is JSON stringified object from select option (we used JSON.stringify)
  try {
    const obj = JSON.parse(valueStr);
    return obj;
  } catch(e){
    // fallback: if plain label like "10^200 x" find in CHALLENGE_MULTS
    const found = CHALLENGE_MULTS.find(m => m.label === valueStr);
    return found || { label:'1x', n:1 };
  }
}

function computeFinalEnemyMultiplier(stage, challengeChoice){
  const stageMult = calculateStageMultiplier(stage); // returns {type:'num', n:...}
  const challengeMult = makeMultiplierFromChoice(challengeChoice); // {type:'num' or type:'exp'}
  const combined = combineMultipliers(stageMult, challengeMult);
  return combined;
}

function startWave(waveNumber) {
  session.currentStage = session.currentStage || 1;
  session.wave = Math.max(1, Math.min(MAX_STAGE, waveNumber));
  session.stageDifficultyMultiplier = calculateStageMultiplier(session.currentStage);
  // session.finalEnemyMultiplier should already be set at startPlay; if absent, compute default
  if(!session.finalEnemyMultiplier) session.finalEnemyMultiplier = computeFinalEnemyMultiplier(session.currentStage, {n:1});
  session.sessionXP = session.sessionXP || 0;
  session.wave = waveNumber;
  session.waveState = 'spawning';
  session.spawnTimer = 0;
  session.spawnedCount = 0;
  ui.uiWaveLabel.textContent = `Wave ${session.wave}`;
}

/* -----------------------

function randRange(a, b) { return Math.random() * (b - a) + a; }
function randint(a, b) { return Math.floor(randRange(a, b + 1)); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function shuffle(arr) { return arr.slice().sort(() => Math.random() - 0.5); }
function pointInRect(px, py, rx, ry, rw, rh) { return px >= rx - rw / 2 && px <= rx + rw / 2 && py >= ry - rh / 2 && py <= ry + rh / 2; }
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* -----------------------
   大数整形 & 表示ユーティリティ
   ----------------------- */
function formatLargeNumber(n) {
  if (n === null || typeof n === 'undefined') return '0';
  if (typeof n === 'number') {
    if (!isFinite(n)) return '∞';
    if (Math.abs(n) < 1000) return String(Math.round(n * 100) / 100);
    if (Math.abs(n) < 1000000) return (Math.round(n) / 1000).toFixed(2) + 'k';
    if (Math.abs(n) < 1e8) return Math.round(n / 10000) + '万';
    if (Math.abs(n) < 1e12) return Math.round(n / 1e8) / 10 + '億';
    if (Math.abs(n) < 1e16) return Math.round(n / 1e12) + '兆';
    return n.toExponential(3);
  }
  if (typeof n === 'object' && n.type === 'exp' && typeof n.e === 'number') {
    return `10^${n.e}x`;
  }
  if (typeof n === 'object' && n.type === 'num' && typeof n.n === 'number') {
    return `${n.n}x`;
  }
  return String(n);
}

/* -----------------------
   Spawn wave generator (keeps previous logic)
   - uses spawnEnemy/spawnBoss which now bake multipliers
   ----------------------- */
const baseWaveTemplate = function (stage, wave) {
  const baseCount = 4 + Math.min(20, Math.floor(stage / 2)) + (wave - 1) * 2;
  const baseHp = Math.max(60, Math.floor(80 + stage * 20 + wave * 30));
  const speed = Math.min(80, 18 + Math.floor(stage / 6) + wave * 2);
  return { count: baseCount, hp: baseHp, speed, spawnInterval: Math.max(420, 1100 - wave * 60) };
};

function handleSpawn(dt) {
  if (session.waveState !== 'spawning' && session.waveState !== 'active') return;
  if (session.wave % 5 === 0) {
    if (session.waveState === 'spawning' && session.spawnedCount === 0) {
      const mul = session.finalEnemyMultiplier || {type:'num', n:1};
      const bossHpBase = Math.max(1, Math.floor((800 + session.currentStage * 120 + session.wave * 300)));
      spawnBoss({ x: CANVAS_W / 2, y: 80, hp: bossHpBase, vx: 28, shootInterval: 900 });
      session.spawnedCount = 1;
      session.waveState = 'active';
    }
    return;
  }
  const cfg = baseWaveTemplate(session.currentStage, session.wave);
  session.spawnTimer += dt;
  if (session.spawnedCount < cfg.count && session.spawnTimer >= cfg.spawnInterval) {
    session.spawnTimer -= cfg.spawnInterval;
    session.spawnedCount++;
    const ex = randRange(30, CANVAS_W - 30) | 0;
    const hp = Math.max(1, Math.floor(cfg.hp));
    spawnEnemy({ x: ex, y: -40, hp, speed: cfg.speed });
    if (session.spawnedCount >= cfg.count) {
      session.waveState = 'active';
    }
  }
}

function executeAllDirBurst(count = 12, damageMul = 1){

(function enhanceCardEffects(){

/* -----------------------
   一括売却：仕様
   - 一度に最大100個を売却
   - 低レアリティから売る（N -> R -> SR）
   - セット中のもの（session.activeDeck 内）と SSR/XXX（SSR以上）は売らない
   - 1つあたり売却価格 = Math.max(1, Math.floor(save.totalMoney * 0.005)) （所持金の0.5%）
   - 売却は save.totalMoney に加算して persistSaveLocal
----------------------- */
function bulkSellUpTo100(){
  if(!save || !Array.isArray(save.ownedCards)) { showMessage('所持カードデータが不正です'); return; }
  if(!save.totalMoney) save.totalMoney = 0;
  const maxSell = 100;
  const deckIds = (session && session.activeDeck) ? session.activeDeck.map(c => c.id) : [];
  const locked = save._lockedCards || {};
  // sort ownedCards by rarity ascending, then by id
  const sellCandidates = save.ownedCards
    .map((c, idx) => ({c, idx}))
    .filter(({c}) => { 
      // exclude if in deck or rarity >= SSR or locked
      if(!c) return false;
      if(c.rarity === 'SSR' || c.rarity === 'XXX') return false;
      if(deckIds.includes(c.id)) return false;
      if(locked[c.id]) return false;
      return true;
    })
    .sort((a,b) => rarityRank(a.c.rarity) - rarityRank(b.c.rarity));

  if(sellCandidates.length === 0){ showMessage('売却可能なカードがありません'); return; }

  const pricePerItem = Math.max(1, Math.floor((save.totalMoney || 0) * 0.005));
  // If pricePerItem is 0 because totalMoney==0, fallback to 1 XP (or 1 money)
  let sold = 0;
  for(const entry of sellCandidates){
    if(sold >= maxSell) break;
    const idx = save.ownedCards.indexOf(entry.c);
    if(idx !== -1){
      // remove the item
      save.ownedCards.splice(idx, 1);
      sold++;
      // pay out
      save.totalMoney = (save.totalMoney || 0) + pricePerItem;
    }
  }
  persistSaveLocal();
  showMessage(`一括売却: ${sold} 個売却しました。1個あたり ${pricePerItem} を獲得しました。`, ()=>{ openUpgradePanel(); });
}

/* -----------------------
   一括覚醒：仕様
   - 同じ baseId（成長選択肢）が 3 個集まると1つの覚醒が生成される
   - 一括覚醒ボタンはガチャの下に設置（openUpgradePanel 内でボタンを描画）
   - 覚醒時コスト: 基本 500 XP * 2^currentAwakenLevel（カードごとに _awakenLevel を持つ）
   - 覚醒により params の数値は *2（性能が2倍）になる（pct / amt を考慮）
   - 一括実行では利用可能なグループをできるだけ多く覚醒（ただし XP が足りない場合は停止）
----------------------- */
function performBulkAwaken(){
  if(!save || !Array.isArray(save.ownedCards)){ showMessage('所持カード情報が不正です'); return; }
  const groups = {};
  // group by baseId (or effectKey fallback)
  for(const c of save.ownedCards){
    const key = c.baseId || c.effectKey || c.id;
    groups[key] = groups[key] || [];
    groups[key].push(c);
  }
  let totalAwakened = 0;
  let xpSpent = 0;
  // iterate groups
  for(const key in groups){
    const arr = groups[key];
    // count how many sets of 3
    const sets = Math.floor(arr.length / 3);
    if(sets <= 0) continue;
    // for each possible set, try to awaken one by one
    for(let s=0; s<sets; s++){
      // find three items among arr that still exist in save.ownedCards
      const candidateIDs = [];
      for(const c of arr){
        if(candidateIDs.length >= 3) break;
        // ensure card still in global ownedCards (might have been consumed)
        if(save.ownedCards.includes(c)) candidateIDs.push(c);
      }
      if(candidateIDs.length < 3) break;
      // determine awaken level for this base (use one of the cards' _awakenLevel as current)
      const exemplar = candidateIDs[0];
      const curLevel = exemplar._awakenLevel || 0;
      const cost = Math.ceil(500 * Math.pow(2, curLevel));
      if((save.totalXP || 0) < cost) {
        // not enough XP to awaken further sets
        continue;
      }
      // consume XP
      save.totalXP -= cost;
      xpSpent += cost;
      // remove the three cards from save.ownedCards (first occurrences)
      for(let k=0;k<3;k++){
        const idx = save.ownedCards.indexOf(candidateIDs[k]);
        if(idx !== -1) save.ownedCards.splice(idx,1);
      }
      // create awakened card instance
      const newInst = JSON.parse(JSON.stringify(exemplar));
      newInst.id = `${newInst.baseId}_AWK_${Date.now()}_${Math.floor(Math.random()*1000)}`;
      newInst._awakenLevel = (exemplar._awakenLevel || 0) + 1;
      // double numeric params
      if(newInst.params && typeof newInst.params.pct === 'number') newInst.params.pct = newInst.params.pct * 2;
      if(newInst.params && typeof newInst.params.amt === 'number') newInst.params.amt = Math.ceil(newInst.params.amt * 2);
      // label marker
      newInst.label = `${newInst.label || newInst.name} ★覚醒Lv${newInst._awakenLevel}`;
      // push to ownedCards
      save.ownedCards.push(newInst);
      totalAwakened++;
      // continue to next possible set
    }
  }
  persistSaveLocal();
  showMessage(`一括覚醒完了: ${totalAwakened} 個覚醒。消費XP: ${xpSpent}`, ()=>{ openUpgradePanel(); });
}

(function installPassiveTick(){
  setInterval(() => {
    try {
      // areaPulse trigger
      if(player && player.passives && player.passives.areaPulse){
        const ap = player.passives.areaPulse;
        const now = performance.now();
        if(now - (ap.last || 0) >= ap.interval){
          ap.last = now;
          // create damage pulse that damages nearby enemies
          for(const e of enemies){
            // distance check
            const dx = e.x - player.x, dy = e.y - player.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if(dist <= (ap.radius || 120) ){
              if(isFinite(e.hp)) e.hp -= (ap.dmg || 120);
            }
          }
          effects.push({ type:'pulse', x: player.x, y: player.y, r: ap.radius || 120, ttl: 500, maxTtl: 500 });
        }
      }

      // waveCannon charge increment: if wave advances we might charge, but we can also increment slowly
      if(player && player.passives && player.passives.waveCannon){
        // if wave changed we assume charge increment happens in startWave wrapper; but support auto-charge over time
        const wc = player.passives.waveCannon;
        if(Date.now() % 6000 < 50){ // approx every 6s
          wc.chargeNow = Math.min(wc.chargeMax, (wc.chargeNow || 0) + 1);
        }
      }

      // timeAccel reduces cooldowns slightly
      if(player && player.passives && player.passives.timeAccel){
        const ta = player.passives.timeAccel;
        if(Date.now() - (ta.born || 0) > (ta.ttl || 8000)){
          delete player.passives.timeAccel;
        }
      }

      // remove expired buffs
      if(player && player.buffs){
        const now = performance.now();
        for(const k in player.buffs){
          const b = player.buffs[k];
          if(b && b.ttl && (now - (b.born || now)) > b.ttl){
            delete player.buffs[k];
          }
        }
      }
    } catch(e){ console.error('passive tick error', e); }
  }, 250);
})();
